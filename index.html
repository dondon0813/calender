<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪莉與朵栗 團購行事曆</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* index.html 專屬樣式。共用的 reset / 版面 / 按鈕 / modal / 頁尾在 shared.css。
     色碼、圓角、陰影一律用 shared.css 的 :root 變數，不要再硬寫。 */

  /* index.html 專屬色彩變數（只在本頁使用，值須與原硬寫色碼完全一致，不與 shared.css 共用鍵合併） */
  :root {
    --ix-month-shadow: #FFE0E8;       /* 月份數字陰影 */
    --ix-day-dim-bg: #FBF6EF;         /* 月曆格：非本月淡出背景 */
    --ix-day-today-bg: #FFE9C2;       /* 月曆格：今天背景 */
    --ix-day-today-ring: #FFB454;     /* 月曆格：今天外框 */
    --ix-day-dim-text: #ddd0c2;       /* 月曆格：非本月淡出文字 */
    --ix-day-today-text: #C97A1A;     /* 月曆格：今天日期文字 */
    --ix-upcoming-border: #E8B93D;    /* 即將開團：外框／圖例外框 */
    --ix-upcoming-text: #8A6D1F;      /* 即將開團：文字 */
    --ix-active-border: #FF9F4A;      /* 開團中：外框／圖例外框 */
    --ix-closing-bg: #FFE1E8;         /* 即將截止：背景／圖例背景 */
    --ix-closing-text: #C1315A;       /* 即將截止：文字 */
    --ix-ended-bg: #EFEBE5;           /* 已結束：背景／圖例背景 */
    --ix-ended-border: #B8AC9C;       /* 已結束：外框／圖例外框 */
    --ix-ended-text: #7A7166;         /* 已結束：文字（也用於清單標題） */
    --ix-frozen-bg: #E6F1FC;          /* 已凍結：背景／圖例背景 */
    --ix-frozen-border: #4F91D9;      /* 已凍結：外框／圖例外框／今日凍結徽章背景 */
    --ix-frozen-text: #2F6FB0;        /* 已凍結：文字 */
    --ix-closing-title: #E0405F;      /* 現正開團中清單：即將截止標題色 */
    --ix-active-title: #C98A3E;       /* 現正開團中清單：開團中標題色 */
    --ix-card-bg: #B98868;            /* 現正開團中卡片：預設背景 */
    --ix-card-today-bg: #7A5A42;      /* 現正開團中卡片：今天特別背景 */
    --ix-card-today-ring: #FFD3DC;    /* 現正開團中卡片：今天外環光暈 */
    --ix-card-gray-bg: #C9C1B4;       /* 現正開團中卡片：已結束灰卡背景 */
    --ix-card-gray-text: #6b6255;     /* 現正開團中卡片：已結束灰卡文字 */
    --ix-today-badge-bg: #FF4D6D;     /* 今日徽章背景 */
    --ix-social-icon-default: #3a2f28; /* 品牌社群圖示：預設底色（無自訂色時） */
    --ix-btn-intro-hover: #5F97DB;    /* 頁首按鈕：品牌介紹 hover */
    --ix-btn-recipe-hover: #F0A05F;   /* 頁首按鈕：食譜 hover */
    --ix-code-hover-bg: #FFE7D6;      /* 折扣碼區塊 hover 背景 */
    --ix-tag-bg: #FF5C8A;             /* 活動標籤背景 */
    --ix-c0-badge-bg: #FFE6EC;        /* 分類0 徽章背景 */
    --ix-c1-badge-bg: #FFEcD6;        /* 分類1 徽章背景 */
    --ix-c3-badge-bg: #DEF5F4;        /* 分類3 徽章背景 */
    --ix-c6-badge-bg: #FBEFD9;        /* 分類6 徽章背景 */
    --ix-c6-text: #D9A441;            /* 分類6 文字色 */
  }

  /* 圓體：字型本身與大部分標題／按鈕由 shared.css 統一處理，
     這裡只補這頁專屬、shared.css 沒有的三個。 */
  .gc-title,
  .gc-btn,
  .gc-code-hint,
  .gc-discount-label {
    font-family: var(--font-round);
  }

  .wrap { position: relative; }

  /* ===== 頁首 ===== */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .header-row2 {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .month-num {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 46px;
    color: var(--c-primary);
    line-height: 1;
    text-shadow: 2px 2px 0 var(--ix-month-shadow);
    flex: none;
  }

  .title-img {
    height: 96px;
    width: auto;
    max-width: 100%;
    flex: 1 1 auto;
    object-fit: contain;
  }

  @media (max-width: 480px) {
    .title-img { height: 68px; }
  }

  .controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* 左上角複製網址按鈕（跟右上角回首頁按鈕對稱，見 shared.css .site-home-btn），
     用 fixed 定位浮在頁面上，不佔 header-row2 版面，不會擠到其他控制項 */
  .header-copy-url-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 44px;
    height: 44px;
    border: 1px solid var(--c-border);
    border-radius: 50%;
    background: #fff;
    color: var(--ix-active-title);
    font-size: 19px;
    cursor: pointer;
    box-shadow: var(--sh-float);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
  }
  .header-copy-url-btn:hover { background: var(--c-bg-bottom); }

  /* ===== 星期列 ===== */
  .weekdays {
    display: grid;
    gap: 5px;
    margin-bottom: 6px;
  }
  .weekday {
    text-align: center;
    padding: 6px 0;
    border-radius: var(--r-pill);
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .wd-0 { background: var(--c-cat-0); }
  .wd-1 { background: var(--c-cat-1); }
  .wd-2 { background: var(--c-cat-2); }
  .wd-3 { background: var(--c-cat-3); }
  .wd-4 { background: var(--c-cat-4); }
  .wd-5 { background: var(--c-cat-5); }
  .wd-6 { background: var(--c-cat-0); }

  /* ===== 月曆格線 ===== */
  .month-grid {
    border-top: 2px solid var(--c-line);
    border-left: 2px solid var(--c-line);
    border-radius: var(--r-md);
    overflow: hidden;
  }

  .week {
    display: grid;
    border-bottom: 2px solid var(--c-line);
  }

  .daycell {
    grid-row: 1 / -1;
    border-right: 2px solid var(--c-line);
    background: var(--c-surface-2);
    padding: 5px 4px 4px;
    min-height: 30px;
  }
  .daycell.dim { background: var(--ix-day-dim-bg); }
  .daycell.today {
    background: var(--ix-day-today-bg);
    box-shadow: inset 0 0 0 2px var(--ix-day-today-ring);
  }
  .daynum {
    font-weight: 700;
    font-size: 13px;
    color: var(--c-muted);
  }
  .daycell.dim .daynum { color: var(--ix-day-dim-text); }
  .daycell.today .daynum { color: var(--ix-day-today-text); font-weight: 900; }

  .daycell-list {
    border-right: 2px solid var(--c-line);
    background: var(--c-surface-2);
    padding: 5px 4px 6px;
    min-height: 30px;
  }
  .daycell-list.dim { background: var(--ix-day-dim-bg); }
  .daycell-list.today {
    background: var(--ix-day-today-bg);
    box-shadow: inset 0 0 0 2px var(--ix-day-today-ring);
  }
  .daycell-list.today .daynum { color: var(--ix-day-today-text); font-weight: 900; }
  .daycell-list .events-stack {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 3px;
  }

  /* ===== 活動色條 ===== */
  .ebar {
    margin: 3px 2px;
    border-radius: var(--r-pill);
    padding: 2px 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow: hidden;
    white-space: nowrap;
    font-size: 11px;
    align-self: center;
    z-index: 2;
    text-decoration: none;
    color: inherit;
  }
  .ebar.clickable {
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .ebar.clickable:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }

  .ebar-wrap {
    align-self: stretch;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    white-space: normal;
    border-radius: var(--r-sm);
    text-align: center;
    position: relative;
  }
  .ebar-wrap .ev-tag {
    margin-left: 0;
    margin-top: 2px;
  }

  .ebar-wrap.cat-upcoming {
    background: var(--c-gold-badge-bg);
    border: 1px solid var(--ix-upcoming-border);
    color: var(--ix-upcoming-text);
  }
  .ebar-wrap.cat-active {
    background: var(--c-orange-badge-bg);
    border: 1px solid var(--ix-active-border);
    color: var(--c-orange-text);
  }
  .ebar-wrap.cat-closingSoon {
    background: var(--ix-closing-bg);
    border: 1px solid var(--c-pink-deep);
    color: var(--ix-closing-text);
  }
  .ebar-wrap.cat-ended {
    background: var(--ix-ended-bg);
    border: 1px solid var(--ix-ended-border);
    color: var(--ix-ended-text);
  }
  .ebar-wrap.cat-frozen {
    background-color: var(--ix-frozen-bg);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><text x='8' y='46' font-size='42' fill='white' fill-opacity='0.35'>%E2%9D%84</text></svg>");
    background-repeat: no-repeat;
    background-position: bottom right;
    background-size: 34px 34px;
    border: 1px solid var(--ix-frozen-border);
    color: var(--ix-frozen-text);
  }

  /* ===== 現正開團中：清單卡片 ===== */
  .group-list {
    padding: 4px 2px 8px;
  }
  .gs-section-title {
    text-align: center;
    font-weight: 900;
    font-size: 20px;
    margin: 18px 0 12px;
    letter-spacing: 1px;
  }
  .gs-section-title:first-child { margin-top: 4px; }
  .gs-title-closing { color: var(--ix-closing-title); }
  .gs-title-active { color: var(--ix-active-title); }
  .gs-title-ended { color: var(--ix-ended-text); }
  .gs-card {
    display: block;
    position: relative;
    background: var(--ix-card-bg);
    color: #fff;
    border-radius: var(--r-lg);
    padding: 14px 20px;
    margin-bottom: 14px;
    text-align: center;
    text-decoration: none;
    cursor: default;
    transition: transform 0.12s ease;
  }
  .gs-card.clickable { cursor: pointer; }
  .gs-card.clickable:hover { transform: scale(1.015); }
  .gs-card.gs-today {
    background: var(--ix-card-today-bg);
    box-shadow: 0 0 0 3px var(--ix-card-today-ring);
  }
  .gs-card.gs-card-gray {
    background: var(--ix-card-gray-bg);
    color: var(--ix-card-gray-text);
  }
  .gs-card-name {
    font-size: 19px;
    font-weight: 700;
  }
  .gs-card-date {
    font-size: 13px;
    opacity: 0.85;
    margin-top: 4px;
  }
  .gs-card-icons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }
  .gs-card-icon {
    width: 26px;
    height: 26px;
    border-radius: 30%;
    background: rgba(255,255,255,0.25);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
  }
  .gs-card-icon svg { width: 62%; height: 62%; display: block; }
  .gs-card-icon:hover { background: rgba(255,255,255,0.4); }
  .gs-badges {
    position: absolute;
    top: -10px;
    right: 12px;
    display: flex;
    gap: 6px;
  }
  .gs-today-badge,
  .gs-frozen-badge,
  .gs-tag-badge {
    white-space: nowrap;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: var(--r-pill);
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .gs-today-badge { background: var(--ix-today-badge-bg); }
  .gs-frozen-badge { background: var(--ix-frozen-border); }
  .gs-tag-badge { background: var(--ix-tag-bg); }
  .gs-empty {
    text-align: center;
    color: var(--c-muted);
    padding: 30px 0;
    font-size: 14px;
  }

  /* ===== 品牌社群連結列（現正開團中最上方）===== */
  .site-social-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 4px 0 18px;
    flex-wrap: wrap;
  }
  .site-social-icon {
    width: 44px;
    height: 44px;
    border-radius: 30%;
    background: var(--social-icon-color, var(--ix-social-icon-default));
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #fff;
    text-decoration: none;
    box-shadow: var(--sh-soft);
    cursor: pointer;
    transition: filter 0.12s ease;
  }
  .site-social-icon svg { width: 52%; height: 52%; display: block; }
  .site-social-icon:hover { filter: brightness(1.12); }

  /* ===== 團購彈窗 ===== */
  .gc-modal-box {
    text-align: center;
  }
  .gc-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 17px;
    color: var(--c-text);
    margin: 4px 0 18px;
    padding-right: 10px;
  }
  .gc-btns {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .gc-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    border-radius: var(--r-pill);
    padding: 12px 14px;
    color: #fff;
    cursor: pointer;
    border: none;
  }
  .gc-btn-intro { background: var(--c-cat-4); }
  .gc-btn-intro:hover { background: var(--ix-btn-intro-hover); }
  .gc-btn-recipe { background: var(--c-cat-1); }
  .gc-btn-recipe:hover { background: var(--ix-btn-recipe-hover); }
  .gc-btn-order { background: var(--c-primary); }
  .gc-btn-order:hover { background: var(--c-primary-dark); }

  /* 折扣碼區塊：沒有折扣碼時整塊隱藏（由 JS 切換 .show） */
  .gc-discount { display: none; }
  .gc-discount.show { display: block; }
  .gc-btns + .gc-discount.show {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--c-line);
  }
  .gc-discount-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--c-text-soft);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .gc-code {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;  /* 折扣碼很長時讓提示標籤換行，不要撐破視窗 */
    gap: 12px;
    width: 100%;
    padding: 11px 14px;
    border: 1px dashed var(--c-border);
    border-radius: var(--r-md);
    background: var(--c-bg-bottom);
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s;
  }
  .gc-code:hover { background: var(--ix-code-hover-bg); border-color: var(--c-primary); }
  .gc-code-text {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--c-text);
    line-height: 1.2;
    word-break: break-all;
  }
  .gc-code-hint {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    background: var(--c-primary);
    border-radius: var(--r-pill);
    padding: 9px 18px;
    white-space: nowrap;
  }
  .gc-code.copied .gc-code-hint { background: var(--c-cat-2); }
  .gc-discount-desc {
    font-size: 13px;
    line-height: 1.6;
    color: var(--c-text-soft);
    margin-top: 10px;
    white-space: pre-line;
  }
  .gc-remind {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--c-primary-dark);
    background: var(--c-bg-bottom);
    border-radius: var(--r-md);
    padding: 8px 12px;
    margin-top: 12px;
  }

  /* ===== 活動內容元件 ===== */
  .badge {
    flex: none;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    color: #fff;
    font-weight: 800;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ev-date {
    flex: none;
    font-weight: 800;
    color: #fff;
    font-size: 11px;
  }
  .ev-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #fff;
    font-weight: 500;
  }
  .ev-title-wrap {
    flex: 1 1 0%;
    min-width: 0;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    line-height: 1.3;
    word-break: keep-all;
    overflow-wrap: normal;
    color: inherit;
    font-weight: 700;
  }
  .ev-tag {
    flex: none;
    background: var(--ix-tag-bg);
    color: #fff;
    font-weight: 800;
    font-size: 9px;
    border-radius: var(--r-pill);
    padding: 1px 6px;
    margin-left: auto;
  }

  .c0 .badge { background: var(--ix-c0-badge-bg); color: var(--c-cat-0); } .c0.ebar { background: var(--c-cat-0); }
  .c1 .badge { background: var(--ix-c1-badge-bg); color: var(--c-cat-1); } .c1.ebar { background: var(--c-cat-1); }
  .c2 .badge { background: var(--c-mint-bg); color: var(--c-cat-2); } .c2.ebar { background: var(--c-cat-2); }
  .c3 .badge { background: var(--ix-c3-badge-bg); color: var(--c-cat-3); } .c3.ebar { background: var(--c-cat-3); }
  .c4 .badge { background: var(--c-blue-bg); color: var(--c-cat-4); } .c4.ebar { background: var(--c-cat-4); }
  .c5 .badge { background: var(--c-purple-bg); color: var(--c-cat-5); } .c5.ebar { background: var(--c-cat-5); }
  .c6 .badge { background: var(--ix-c6-badge-bg); color: var(--ix-c6-text); }        .c6.ebar { background: var(--c-cat-6); }

  /* ===== 圖例 ===== */
  .legend {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-top: 16px;
    padding-top: 10px;
    border-top: 1.5px dashed var(--c-line);
  }
  .legend.show {
    display: flex;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    color: var(--c-muted);
  }
  .legend-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    display: inline-block;
    flex: none;
  }
  .legend-upcoming { background: var(--c-gold-badge-bg); border: 1px solid var(--ix-upcoming-border); }
  .legend-active { background: var(--c-orange-badge-bg); border: 1px solid var(--ix-active-border); }
  .legend-closingSoon { background: var(--ix-closing-bg); border: 1px solid var(--c-pink-deep); }
  .legend-ended { background: var(--ix-ended-bg); border: 1px solid var(--ix-ended-border); }
  .legend-frozen { background: var(--ix-frozen-bg); border: 1px solid var(--ix-frozen-border); }

  @media (max-width: 480px) {
    .month-num { font-size: 36px; }
    .weekday { font-size: 10px; }
    .daynum { font-size: 11px; }
    .ebar { font-size: 9.5px; padding: 2px 6px; }
    .badge { width: 14px; height: 14px; font-size: 8.5px; }
    .ev-date { font-size: 9.5px; }
    .ev-tag { font-size: 8px; }
  }

  /* ===== 自訂橫幅卡片 ===== */
  .cb-card {
    display: block;
    border-radius: var(--r-lg);
    padding: 14px 20px;
    margin-bottom: 14px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .cb-card:hover { transform: scale(1.015); }
  .cb-title {
    font-family: var(--font-display);
    font-weight: 700;
  }
  .cb-subtitle {
    font-size: 12.5px;
    opacity: 0.85;

const STATS_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzTxoqVO1nf--Q9s-lf1eIPdgrDpJgLsuAy1mAwgydYzb7ThAuygx79oFNsEH-kWD2R/exec';
const sentViewKeys = new Set();
let statObserver = null;

function getStatKey(ev) {
  const s = ev.start;
  return `${ev.id}_${s.getFullYear()}-${s.getMonth() + 1}-${s.getDate()}`;
}

// 統計送出（2026-07-31 改成批次）：原本一筆一個請求，客人往下滑過幾張團購卡就送幾次，
// 每一筆都是獨立的 Apps Script 執行作業，還要排隊搶同一把鎖——這是同時執行作業爆量的最大來源。
// 現在先進佇列，短暫等待期間累積的併成一次送（type: 'stat-batch'）。
// 離開頁面／切到背景時會強制送出，所以不會漏記。
const STAT_QUEUE = [];
const STAT_FLUSH_DELAY_VIEW_MS = 1500;  // 瀏覽：滑動時會連續觸發，多等一下併得更多
const STAT_FLUSH_DELAY_CLICK_MS = 300;  // 點擊：可能馬上跳頁，早點送
const STAT_QUEUE_MAX = 50;              // 與後端 STAT_BATCH_MAX_ITEMS 對應，別超過
let statFlushTimer = null;

function postStatPayload(payload) {
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(STATS_BACKEND_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    } else {
      fetch(STATS_BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }
  } catch (e) { /* 統計失敗不影響使用者瀏覽，安靜忽略 */ }
}

function flushStats() {
  if (statFlushTimer) { clearTimeout(statFlushTimer); statFlushTimer = null; }
  if (!STAT_QUEUE.length) return;
  const items = STAT_QUEUE.splice(0, STAT_QUEUE.length);
  postStatPayload(JSON.stringify({ type: 'stat-batch', items: items }));
}

function sendStat(key, field) {
  if (!key || !STATS_BACKEND_URL) return;
  const isClick = field === 'click';
  STAT_QUEUE.push({ key: key, field: isClick ? 'clicks' : 'views' });
  if (STAT_QUEUE.length >= STAT_QUEUE_MAX) { flushStats(); return; }
  if (isClick) {
    // 點擊可能馬上跳頁：不管原本排程在多久之後，一律改成短延遲趕快送出
    if (statFlushTimer) clearTimeout(statFlushTimer);
    statFlushTimer = setTimeout(flushStats, STAT_FLUSH_DELAY_CLICK_MS);
  } else if (!statFlushTimer) {
    // 瀏覽用固定視窗，不是每來一筆就往後延——否則一直滑就一直不送
    statFlushTimer = setTimeout(flushStats, STAT_FLUSH_DELAY_VIEW_MS);
  }
}

function getStatObserver() {
  if (!statObserver) {
    statObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const key = entry.target.dataset.statKey;
        if (key && !sentViewKeys.has(key)) {
          sentViewKeys.add(key);
          sendStat(key, 'view');
        }
        statObserver.unobserve(entry.target);
      });
    }, { threshold: 0.5 });
  }
  return statObserver;
}

// 【修改】點擊時除了送出整體點擊次數，還多送一筆「依目前顯示模式（開團日／結團日／全部顯示／現正開團中）」
// 分開計算的點擊次數，key 格式固定是 團購key + '_src_' + mode，後台可以分開看是哪個表單點的人最多
function attachStatTracking(el, ev, clickable, srcOverride) {
  const key = getStatKey(ev);
  el.dataset.statKey = key;
  getStatObserver().observe(el);
  if (clickable) {
    el.addEventListener('click', () => {
      sendStat(key, 'click');
      sendStat(key + '_src_' + (srcOverride || currentMode), 'click');
    });
  }
}

let allEvents = [];
let currentYear, currentMonth;
let currentMode = 'list';

// 支援網址帶入預設顯示模式，例如 index.html?mode=start（開團日）；
// 沒帶或帶到不認識的值就維持預設「現正開團中」
const urlMode = new URLSearchParams(location.search).get('mode');
if (['all', 'start', 'end', 'list'].includes(urlMode)) {
  currentMode = urlMode;
  document.getElementById('modeSelect').value = urlMode;
}

const MODE_VISIBLE_DAYS = {
  all:   [0,1,2,3,4,5,6],
  start: [1,2,3,4,5],
  end:   [0,1,2,3,4]
};

function parseDateStr(s) {
  if (!s) return null;
  s = String(s).trim();
  const gvizMatch = s.match(/Date\((\d+),(\d+),(\d+)\)/);
  if (gvizMatch) {
    return new Date(parseInt(gvizMatch[1]), parseInt(gvizMatch[2]), parseInt(gvizMatch[3]));
  }
  const parts = s.split(/[\/\-]/).map(p => parseInt(p, 10));
  if (parts.length === 3) return new Date(parts[0], parts[1] - 1, parts[2]);
  return null;
}

function fmtDateLabel(start, end) {
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${f(start)}–${f(end)}`;
}

function fmtSingleDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function isSameDate(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function daysBetween(a, b) {
  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}

function segmentTitle(title) {
  if (typeof Intl !== 'undefined' && Intl.Segmenter) {
    try {
      const seg = new Intl.Segmenter('zh', { granularity: 'word' });
      const parts = [];
      for (const s of seg.segment(title)) {
        if (s.segment && s.segment.trim() !== '') parts.push(s.segment);
      }
      if (parts.length) return parts;
    } catch (e) { /* fallback below */ }
  }
  return title.split('');
}

const KNOWN_BRANDS = ['林貝兒', '小影霸', '台東初鹿', '永圻魚湯', '雪坊優格', '兔比媽咪廚房'];

/* 團名裡的「｜」＝後台自己指定的斷行點（例：Parakito｜防蚊用品）。
   品牌名本身就含產品的（雪坊優格、韓爸米餅）不會有這個符號，維持一行。
   會斷行的地方照斷，橫排一行的地方（清單列、tooltip、彈窗標題）用 plainTitle() 換成空白。
   下面的 KNOWN_BRANDS 是還沒改寫的舊團名的備援，改寫完可以再刪。 */
const TITLE_SEP = /[｜|]/;
function titleParts(t) {
  return String(t || '').split(TITLE_SEP).map(s => s.trim()).filter(s => s !== '');
}
function plainTitle(t) { return titleParts(t).join(' '); }

function wrapTitleLines(title, maxCharsPerLine) {
  const byBar = titleParts(title);
  if (byBar.length > 1) {
    const lines = [];
    byBar.forEach(part => { lines.push(...wrapSegment(part, maxCharsPerLine)); });
    return lines;
  }

  const manualParts = title.split(/[\/、]/).map(s => s.trim()).filter(s => s !== '');
  if (manualParts.length > 1) {
    const lines = [];
    manualParts.forEach(part => {
      lines.push(...wrapSegment(part, maxCharsPerLine));
    });
    return lines;
  }

  const brand = KNOWN_BRANDS.find(b => title.startsWith(b));
  if (brand) {
    const rest = title.slice(brand.length).trim();
    const lines = [brand];
    if (rest) lines.push(...wrapSegment(rest, maxCharsPerLine));
    return lines;
  }

  return wrapSegment(title, maxCharsPerLine);
}

function wrapSegment(text, maxCharsPerLine) {
  const words = segmentTitle(text);
  const lines = [];
  let current = '';
  words.forEach(w => {
    if (current === '') {
      current = w;
    } else if (current.length + w.length <= maxCharsPerLine) {
      current += w;
    } else {
      lines.push(current);
      current = w;
    }
  });
  if (current) lines.push(current);
  return lines;
}

const FROZEN_KEYWORDS = ['永圻魚湯', '雪坊優格', '兔比媽咪廚房'];

function isFrozenEvent(ev) {
  const cat = (ev.category || '').toString().trim();
  if (cat !== '') {
    return cat.includes('冷凍');
  }
  // 比對前先把斷行符號去掉，萬一團名寫成「雪坊｜優格」也照樣認得
  return FROZEN_KEYWORDS.some(k => titleParts(ev.title).join('').includes(k));
}

function isLinkUnlocked(ev) {
  if (!ev.url) return false;
  return new Date() >= ev.start;
}

// 有食譜品牌（食材／食譜入口）或有折扣碼，點擊時都要先跳小視窗而不是直接開網頁
function needsGroupModal(ev) {
  return !!((ev.recipeBrand && ev.recipeBrand.trim()) || (ev.discountCode && ev.discountCode.trim()));
}

function parseExtendRaw(raw, originalEnd) {
  if (raw === null || raw === undefined || raw === '') return null;
  if (typeof raw === 'number') {
    return { type: 'days', value: raw };
  }
  const s = String(raw).trim();
  if (s === '') return null;
  if (/^\d+$/.test(s)) {
    return { type: 'days', value: parseInt(s, 10) };
  }
  const d = parseDateStr(s);
  if (d) {
    // 試算表把「延長天數」存成日期格式時，數字會變成 1900 年初的某天，換算回天數
    if (d.getFullYear() < 2000) {
      const days = Math.round((d.getTime() - new Date(1899, 11, 30).getTime()) / 86400000);
      return days > 0 ? { type: 'days', value: days } : null;
    }
    return { type: 'date', value: d };
  }
  return null;
}

function computeDisplayEnd(end, extend) {
  if (!extend) return end;
  const today = new Date();
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const endStart = new Date(end.getFullYear(), end.getMonth(), end.getDate());
  if (todayStart <= endStart) return end;
  if (extend.type === 'days') {
    return new Date(end.getFullYear(), end.getMonth(), end.getDate() + extend.value);
  }
  return extend.value;
}

async function loadData() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = '資料載入中…';
  statusEl.classList.remove('error');
  try {
    // 改走 Apps Script（scope=calendar 回傳與 gviz 相同格式），試算表就能設為私人、不必公開可讀
    const res = await fetch(STATS_BACKEND_URL + '?scope=calendar&t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('網路錯誤 ' + res.status);
    const text = await res.text();
    const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const data = JSON.parse(jsonStr);
    const rows = data.table.rows;

    const events = [];
    rows.forEach((row) => {
      const c = row.c;
      if (!c || !c[0] || c[0].v === null || c[0].v === '') return;
      const id = c[0].v;
      const startRaw = c[1] ? c[1].v : null;
      const endRaw = c[2] ? c[2].v : null;
      const extendRaw = c[3] ? c[3].v : null;
      const title = c[4] ? c[4].v : '';
      const tag = c[5] ? c[5].v : '';
      const category = c[6] ? c[6].v : '';
      const url = c[7] ? c[7].v : '';
      const adminUrl = c[8] ? c[8].v : '';
      const earlyBirdRaw = c[9] ? c[9].v : '';
      const recipeBrandRaw = c[10] ? c[10].v : '';
      const colorRaw = c[11] ? c[11].v : '';
      const isGroupBuyRaw = c[15] ? String(c[15].v || '').trim() : '';
      const publishedRaw = c[16] ? String(c[16].v || '').trim() : '';
      const iconIg = c[17] ? String(c[17].v || '').trim() : '';
      const iconTiktok = c[18] ? String(c[18].v || '').trim() : '';
      const iconFb = c[19] ? String(c[19].v || '').trim() : '';
      const iconEmail = c[20] ? String(c[20].v || '').trim() : '';
      const discountCode = c[23] ? String(c[23].v || '').trim() : '';
      const discountDesc = c[24] ? String(c[24].v || '').trim() : '';
      const start = parseDateStr(startRaw);
      const end = parseDateStr(endRaw);
      if (!start || !end || !title) return;
      const extend = parseExtendRaw(extendRaw, end);
      const displayEnd = computeDisplayEnd(end, extend);
      const earlyBird = String(earlyBirdRaw || '').split('/').map(s => s.trim()).filter(s => s !== '');
      const color = String(colorRaw || '').trim();
      const recipeBrand = String(recipeBrandRaw || '').trim();
      const isGroupBuy = isGroupBuyRaw === '' ? true : (isGroupBuyRaw === '是');
      const published = publishedRaw === '' ? true : (publishedRaw === '是');
      if (!published) return;
      events.push({ id, start, end, extend, displayEnd, title, tag, category, url, adminUrl, earlyBird, color, isGroupBuy, recipeBrand, iconIg, iconTiktok, iconFb, iconEmail, discountCode, discountDesc });
    });

    allEvents = events;
    statusEl.textContent = `已同步 ${events.length} 檔活動 · ${new Date().toLocaleString('zh-TW')}`;
    populateMonthSelect();
    render();
  } catch (err) {
    statusEl.textContent = '讀取行事曆失敗，請確認 Apps Script 已重新部署且可正常存取。(' + err.message + ')';
    statusEl.classList.add('error');
  }
}

function populateMonthSelect() {
  const sel = document.getElementById('monthSelect');
  const monthsSet = new Set();
  allEvents.forEach(ev => {
    let d = new Date(ev.start.getFullYear(), ev.start.getMonth(), 1);
    const endD = new Date(ev.displayEnd.getFullYear(), ev.displayEnd.getMonth(), 1);
    while (d <= endD) {
      monthsSet.add(`${d.getFullYear()}-${d.getMonth()}`);
      d.setMonth(d.getMonth() + 1);
    }
  });

  const now = new Date();
  const todayKey = `${now.getFullYear()}-${now.getMonth()}`;
  monthsSet.add(todayKey);

  let months = Array.from(monthsSet).map(s => {
    const [y, m] = s.split('-').map(Number);
    return { y, m };
  }).sort((a, b) => a.y - b.y || a.m - b.m);

  sel.innerHTML = '';
  months.forEach(({ y, m }) => {
    const opt = document.createElement('option');
    opt.value = `${y}-${m}`;
    opt.textContent = `${y}年 ${m + 1}月`;
    sel.appendChild(opt);
  });

  if (currentYear === undefined) {
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
  }
  sel.value = `${currentYear}-${currentMonth}`;
  sel.onchange = () => {
    const [y, m] = sel.value.split('-').map(Number);
    currentYear = y; currentMonth = m;
    render();
  };
}

function renderWeekdayHeader() {
  const wdEl = document.getElementById('weekdays');
  const days = MODE_VISIBLE_DAYS[currentMode];
  wdEl.innerHTML = '';
  wdEl.style.gridTemplateColumns = `repeat(${days.length}, minmax(0, 1fr))`;
  days.forEach(wd => {
    const div = document.createElement('div');
    div.className = `weekday wd-${wd}`;
    div.textContent = WD_LABEL[wd];
    wdEl.appendChild(div);
  });
}

function render() {
  if (currentYear === undefined) return;

  const isList = currentMode === 'list';
  document.getElementById('monthNum').textContent = (currentMonth + 1) + '月';
  document.getElementById('monthNum').style.display = isList ? 'none' : '';
  document.getElementById('headerCopyUrlBtn').style.display = isList ? '' : 'none';
  document.getElementById('monthSelect').style.display = isList ? 'none' : '';
  document.getElementById('weekdays').style.display = isList ? 'none' : '';
  document.getElementById('grid').style.display = isList ? 'none' : '';
  document.getElementById('groupList').style.display = isList ? '' : 'none';

  const legendEl = document.getElementById('legend');
  legendEl.classList.toggle('show', currentMode !== 'all' && !isList);

  if (isList) {
    renderGroupList();
    return;
  }

  renderWeekdayHeader();

  if (currentMode === 'all') {
    renderAllMode();
  } else {
    renderSingleDayMode(currentMode);
  }
}

// 【新】最近結束的團購（給「結團查詢」用），依結束日期新到舊排序
function getRecentEndedEvents(limit) {
  const ended = allEvents.filter(ev => getEventStatus(ev) === 'ended');
  ended.sort((a, b) => b.displayEnd - a.displayEnd);
  return ended.slice(0, limit || 7);
}

// 【新】頁首複製網址按鈕（只在「現正開團中」顯示），方便分享給粉絲
document.getElementById('headerCopyUrlBtn').addEventListener('click', function () {
  const btn = this;
  const url = location.origin + location.pathname;
  copyToClipboard(url).then(ok => {
    btn.textContent = ok ? '✅' : '❌';
    setTimeout(() => { btn.textContent = '🔗'; }, 1500);
  });
});

function renderGroupList() {
  const listEl = document.getElementById('groupList');
  listEl.innerHTML = '';

  // 【新】品牌社群連結列，放在整個清單最上方
  const socialRow = buildSocialIconRow();
  if (socialRow) listEl.appendChild(socialRow);

  appendCustomBlocks(listEl, 'before');

  const todayStart = startOfDay(new Date());
  const closingItems = [];
  const activeItems = [];

  allEvents.forEach(ev => {
    const status = getEventStatus(ev);
    if (status === 'closingSoon') closingItems.push(ev);
    else if (status === 'active') activeItems.push(ev);
  });

  closingItems.sort((a, b) => a.displayEnd - b.displayEnd);
  activeItems.sort((a, b) => b.start - a.start);

  const buildCard = (ev, grayOut) => {
    const daysLeft = daysBetween(todayStart, startOfDay(ev.displayEnd));
    const isToday = !grayOut && daysLeft === 0 && getEventStatus(ev) === 'closingSoon';
    const frozen = isFrozenEvent(ev);
    const clickable = isLinkUnlocked(ev);
    const advanced = clickable && needsGroupModal(ev);

    const card = document.createElement((clickable && !advanced) ? 'a' : 'div');
    card.className = 'gs-card' + (isToday ? ' gs-today' : '') + (clickable ? ' clickable' : '') + (grayOut ? ' gs-card-gray' : '');
    if (clickable && !advanced) {
      card.href = ev.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
    } else if (advanced) {
      card.addEventListener('click', () => openGroupChoiceModal(ev));
    }
    attachStatTracking(card, ev, clickable, 'now');
    card.title = plainTitle(ev.title) + (ev.url && !clickable ? '（開團後才能點擊連結）' : '') + (advanced ? '（點擊查看更多選項）' : '');

    const nameEl = document.createElement('div');
    nameEl.className = 'gs-card-name';
    nameEl.textContent = plainTitle(ev.title);
    card.appendChild(nameEl);

    const dateEl = document.createElement('div');
    dateEl.className = 'gs-card-date';
    dateEl.textContent = fmtDateLabel(ev.start, ev.displayEnd);
    card.appendChild(dateEl);

    const icons = buildEventIconElements(ev);
    if (icons.length) {
      const iconsWrap = document.createElement('div');
      iconsWrap.className = 'gs-card-icons';
      icons.forEach(el => iconsWrap.appendChild(el));
      card.appendChild(iconsWrap);
    }

    if (ev.tag || frozen || isToday) {
      const badges = document.createElement('div');
      badges.className = 'gs-badges';
      if (ev.tag) {
        const tagBadge = document.createElement('span');
        tagBadge.className = 'gs-tag-badge';
        tagBadge.textContent = ev.tag;
        badges.appendChild(tagBadge);
      }
      if (frozen) {
        const frozenBadge = document.createElement('span');
        frozenBadge.className = 'gs-frozen-badge';
        frozenBadge.textContent = '❄冷藏冷凍團';
        badges.appendChild(frozenBadge);
      }
      if (isToday) {
        const todayBadge = document.createElement('span');
        todayBadge.className = 'gs-today-badge';
        todayBadge.textContent = '今日截止';
        badges.appendChild(todayBadge);
      }
      card.appendChild(badges);
    }

    return card;
  };

  const buildSection = (title, arr) => {
    if (!arr.length) return;
    const h = document.createElement('div');
    h.className = 'gs-section-title ' + (title.includes('倒數') ? 'gs-title-closing' : 'gs-title-active');
    h.textContent = title;
    listEl.appendChild(h);
    arr.forEach(ev => listEl.appendChild(buildCard(ev)));
  };

  buildSection('‼️結團倒數‼️', closingItems);
  appendCustomBlocks(listEl, 'between');
  buildSection('🌼現正團購中🌼', activeItems);

  if (!closingItems.length && !activeItems.length) {
    const empty = document.createElement('div');
    empty.className = 'gs-empty';
    empty.textContent = '目前沒有進行中的團購';
    listEl.appendChild(empty);
  }

  appendCustomBlocks(listEl, 'after');

  // 【新】結團查詢：最近 7 個結束的團，灰色顯示，最下方，可點開看詳情
  const endedItems = getRecentEndedEvents(7);
  if (endedItems.length) {
    const h = document.createElement('div');
    h.className = 'gs-section-title gs-title-ended';
    h.textContent = '🕰結團查詢（最近' + endedItems.length + '個）';
    listEl.appendChild(h);
    endedItems.forEach(ev => listEl.appendChild(buildCard(ev, true)));
  }
}

function renderAllMode() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const firstOfMonth = new Date(currentYear, currentMonth, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const gridStart = new Date(currentYear, currentMonth, 1 - startOffset);
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const numWeeks = totalCells / 7;

  const groupBuyNumberMap = computeMonthlyGroupBuyNumbers(currentYear, currentMonth);

  for (let w = 0; w < numWeeks; w++) {
    const weekStart = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + w * 7);
    const weekDays = [];
    for (let i = 0; i < 7; i++) {
      weekDays.push(new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i));
    }
    const weekEnd = weekDays[6];

    const weekEvents = allEvents
      .filter(ev => ev.displayEnd >= weekStart && ev.start <= weekEnd)
      .map(ev => {
        const colStart = Math.max(0, daysBetween(weekStart, ev.start));
        const colEnd = Math.min(6, daysBetween(weekStart, ev.displayEnd));
        return { ev, colStart, colEnd };
      })
      .sort((a, b) => a.colStart - b.colStart || (b.colEnd - b.colStart) - (a.colEnd - a.colStart));

    const laneEnd = [];
    weekEvents.forEach(item => {
      let lane = 0;
      while (lane < laneEnd.length && laneEnd[lane] >= item.colStart) lane++;
      laneEnd[lane] = item.colEnd;
      item.lane = lane;
    });
    const maxLanes = Math.max(1, laneEnd.length);

    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    weekEl.style.gridTemplateColumns = 'repeat(7, minmax(0, 1fr))';
    weekEl.style.gridTemplateRows = `22px repeat(${maxLanes}, 21px) 4px`;

    weekDays.forEach((d, i) => {
      const cell = document.createElement('div');
      const dim = d.getMonth() !== currentMonth;
      const today = isSameDate(d, new Date());
      cell.className = 'daycell' + (dim ? ' dim' : '') + (today ? ' today' : '');
      cell.style.gridColumn = `${i + 1}`;
      const dn = document.createElement('div');
      dn.className = 'daynum';
      dn.textContent = d.getDate();
      cell.appendChild(dn);
      weekEl.appendChild(cell);
    });

    weekEvents.forEach(item => {
      const gbNumber = groupBuyNumberMap.get(item.ev.id);
      const colorIdx = gbNumber ? (gbNumber - 1) % COLORS : (item.ev.id - 1) % COLORS;
      const clickable = isLinkUnlocked(item.ev);
      const advanced = clickable && needsGroupModal(item.ev);
      const hasEarlyBird = !clickable && !isStarted(item.ev) && item.ev.earlyBird.length > 0;
      const bar = document.createElement((clickable && !advanced) ? 'a' : 'div');
      bar.className = `ebar c${colorIdx}` + (clickable ? ' clickable' : '') + (hasEarlyBird ? ' clickable' : '');
      // 【修復】依 colStart / colEnd / lane 設定跨欄位置，長條才會橫向跨天顯示。
      // 少了這兩行，瀏覽器的 grid 自動排版會把每個長條硬塞回單一天欄位、疊在一起（就是壞掉的樣子）。
      bar.style.gridColumn = `${item.colStart + 1} / ${item.colEnd + 2}`;
      bar.style.gridRow = `${item.lane + 2}`;
      if (item.ev.color) {
        bar.style.background = item.ev.color;
      }
      if (clickable && !advanced) {
        bar.href = item.ev.url;
        bar.target = '_blank';
        bar.rel = 'noopener noreferrer';
      } else if (advanced) {
        bar.addEventListener('click', () => openGroupChoiceModal(item.ev));
      } else if (hasEarlyBird) {
        bar.addEventListener('click', () => showEarlyBirdModal(item.ev));
      }
      attachStatTracking(bar, item.ev, clickable);
      bar.title = `${plainTitle(item.ev.title)} (${fmtDateLabel(item.ev.start, item.ev.displayEnd)})` + (item.ev.url && !clickable ? '（開團後才能點擊連結）' : '') + (hasEarlyBird ? '（點擊查看早鳥禮）' : '') + (advanced ? '（點擊查看更多選項）' : '');

      if (gbNumber) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = gbNumber;
        bar.appendChild(badge);
      } else if (item.ev.isGroupBuy === false) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '📌';
        badge.style.background = 'rgba(255,255,255,0.55)';
        bar.appendChild(badge);
      }

      const dateSpan = document.createElement('span');
      dateSpan.className = 'ev-date';
      dateSpan.textContent = fmtDateLabel(item.ev.start, item.ev.displayEnd);
      bar.appendChild(dateSpan);

      const titleSpan = document.createElement('span');
      titleSpan.className = 'ev-title';
      titleSpan.textContent = plainTitle(item.ev.title);
      bar.appendChild(titleSpan);

      if (item.ev.tag) {
        const tagSpan = document.createElement('span');
        tagSpan.className = 'ev-tag';
        tagSpan.textContent = item.ev.tag;
        bar.appendChild(tagSpan);
      }

      weekEl.appendChild(bar);
    });

    grid.appendChild(weekEl);
  }
}

function computeMonthlyGroupBuyNumbers(year, month) {
  const map = new Map();
  const inMonth = allEvents.filter(ev => {
    if (ev.isGroupBuy === false) return false;
    return ev.start.getFullYear() === year && ev.start.getMonth() === month;
  }).sort((a, b) => a.start - b.start || a.id - b.id);
  inMonth.forEach((ev, idx) => map.set(ev.id, idx + 1));
  return map;
}

function renderSingleDayMode(mode) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const visibleDays = MODE_VISIBLE_DAYS[mode];
  const colCount = visibleDays.length;

  const firstOfMonth = new Date(currentYear, currentMonth, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const gridStart = new Date(currentYear, currentMonth, 1 - startOffset);
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const numWeeks = totalCells / 7;

  const dateKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const eventsByDate = {};
  allEvents.forEach(ev => {
    const targetDate = mode === 'start' ? ev.start : ev.displayEnd;
    const wd = targetDate.getDay();
    if (!visibleDays.includes(wd)) return;
    const key = dateKey(targetDate);
    if (!eventsByDate[key]) eventsByDate[key] = [];
    eventsByDate[key].push(ev);
  });

  for (let w = 0; w < numWeeks; w++) {
    const weekStart = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + w * 7);
    const weekDays = [];
    for (let i = 0; i < 7; i++) {
      weekDays.push(new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i));
    }

    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    weekEl.style.gridTemplateColumns = `repeat(${colCount}, minmax(0, 1fr))`;
    weekEl.style.gridTemplateRows = 'auto';

    visibleDays.forEach((wd, colIdx) => {
      const d = weekDays[wd];
      const dim = d.getMonth() !== currentMonth;
      const today = isSameDate(d, new Date());
      const cell = document.createElement('div');
      cell.className = 'daycell-list' + (dim ? ' dim' : '') + (today ? ' today' : '');
      cell.style.gridColumn = `${colIdx + 1}`;

      const dn = document.createElement('div');
      dn.className = 'daynum';
      dn.textContent = d.getDate();
      cell.appendChild(dn);

      const key = dateKey(d);
      const dayEvents = eventsByDate[key] || [];
      if (dayEvents.length) {
        const stack = document.createElement('div');
        stack.className = 'events-stack';
        dayEvents.forEach(ev => {
          const frozen = isFrozenEvent(ev);
          const status = getEventStatus(ev);
          const clickable = isLinkUnlocked(ev);
          const advanced = clickable && needsGroupModal(ev);
          const hasEarlyBird = !clickable && status === 'upcoming' && ev.earlyBird.length > 0;
          const bar = document.createElement((clickable && !advanced) ? 'a' : 'div');
          // 已結團的灰色優先於冷凍團藍色：冷凍標示只在團還沒結束時才有意義，
          // 不然冷凍團結團後會永遠掛著藍色，看起來像還在開團
          const catClass = (frozen && status !== 'ended') ? 'cat-frozen' : `cat-${status}`;
          bar.className = `ebar ebar-wrap ${catClass}` + (clickable || hasEarlyBird ? ' clickable' : '');
          if (clickable && !advanced) {
            bar.href = ev.url;
            bar.target = '_blank';
            bar.rel = 'noopener noreferrer';
          } else if (advanced) {
            bar.addEventListener('click', () => openGroupChoiceModal(ev));
          } else if (hasEarlyBird) {
            bar.addEventListener('click', () => showEarlyBirdModal(ev));
          }
          attachStatTracking(bar, ev, clickable);
          bar.title = `${plainTitle(ev.title)} (${mode === 'start' ? '開團' : '結團'} ${fmtSingleDate(mode === 'start' ? ev.start : ev.displayEnd)})` + (ev.url && !clickable ? '（開團後才能點擊連結）' : '') + (hasEarlyBird ? '（點擊查看早鳥禮）' : '') + (advanced ? '（點擊查看更多選項）' : '');

          const titleSpan = document.createElement('span');
          titleSpan.className = 'ev-title ev-title-wrap';
          const lines = wrapTitleLines(ev.title, 4);
          lines.forEach((line, idx) => {
            if (idx > 0) titleSpan.appendChild(document.createElement('br'));
            titleSpan.appendChild(document.createTextNode(line));
          });
          bar.appendChild(titleSpan);

          if (ev.tag) {
            const tagSpan = document.createElement('span');
            tagSpan.className = 'ev-tag';
            tagSpan.textContent = ev.tag;
            bar.appendChild(tagSpan);
          }

          stack.appendChild(bar);
        });
        cell.appendChild(stack);
      }

      weekEl.appendChild(cell);
    });

    grid.appendChild(weekEl);
  }
}

function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function isStarted(ev) {
  return startOfDay(new Date()) >= startOfDay(ev.start);
}

function getEventStatus(ev) {
  const todayStart = startOfDay(new Date());
  const startD = startOfDay(ev.start);
  const endD = startOfDay(ev.displayEnd);
  if (todayStart < startD) return 'upcoming';
  if (todayStart > endD) return 'ended';
  const closeThreshold = new Date(endD.getFullYear(), endD.getMonth(), endD.getDate() - 1);
  if (todayStart >= closeThreshold) return 'closingSoon';
  return 'active';
}

function showEarlyBirdModal(ev) {
  const modal = document.getElementById('earlyBirdModal');
  const titleEl = document.getElementById('earlyBirdTitle');
  const listEl = document.getElementById('earlyBirdList');
  titleEl.textContent = plainTitle(ev.title) + ' 早鳥禮';
  listEl.innerHTML = '';
  ev.earlyBird.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item;
    listEl.appendChild(li);
  });
  modal.classList.add('show');
}

function closeEarlyBirdModal() {
  document.getElementById('earlyBirdModal').classList.remove('show');
}

function openGroupChoiceModal(ev) {
  const brand = (ev.recipeBrand || '').trim();
  const code = (ev.discountCode || '').trim();
  if (!brand && !code) return;

  const modal = document.getElementById('groupChoiceModal');
  document.getElementById('groupChoiceTitle').textContent = plainTitle(ev.title);

  const introBtn = document.getElementById('gcIntroBtn');
  const recipeBtn = document.getElementById('gcRecipeBtn');
  const orderBtn = document.getElementById('gcOrderBtn');

  const baseKey = getStatKey(ev);

  // 沒有品牌時只留「前往下單」，不顯示食材／食譜入口
  introBtn.style.display = brand ? '' : 'none';
  recipeBtn.style.display = brand ? '' : 'none';
  if (brand) {
    introBtn.href = `${RECIPES_PAGE_URL}?view=ingredients&brand=${encodeURIComponent(brand)}`;
    introBtn.onclick = () => sendStat(baseKey + '_intro', 'click');

    recipeBtn.href = `${RECIPES_PAGE_URL}?view=recipes&brand=${encodeURIComponent(brand)}`;
    recipeBtn.textContent = `🍽 ${brand} 食譜大全`;
    recipeBtn.onclick = () => sendStat(baseKey + '_recipe', 'click');
  }

  orderBtn.href = ev.url;
  orderBtn.onclick = () => {
    sendStat(baseKey + '_order', 'click');
    // 有折扣碼時，點「前往下單」順手幫使用者複製，貼到下單頁就能用（不擋跳轉）
    if (code) copyToClipboard(code).then(flashGcCopied);
  };

  setupDiscountBlock(ev, code, baseKey);

  modal.classList.add('show');
}

// 折扣碼複製後的提示回饋（點折扣碼本身、或點前往下單都會用到）
function flashGcCopied(ok) {
  const codeBtn = document.getElementById('gcCodeBtn');
  const hint = document.getElementById('gcCodeHint');
  hint.textContent = ok ? '已複製 ✓' : '請手動複製';
  codeBtn.classList.toggle('copied', ok);
  setTimeout(() => {
    hint.textContent = '點擊複製';
    codeBtn.classList.remove('copied');
  }, 2000);
}

function setupDiscountBlock(ev, code, baseKey) {
  const wrap = document.getElementById('gcDiscount');
  const codeBtn = document.getElementById('gcCodeBtn');
  const hint = document.getElementById('gcCodeHint');
  const descEl = document.getElementById('gcDiscountDesc');

  if (!code) {
    wrap.classList.remove('show');
    return;
  }

  document.getElementById('gcCodeText').textContent = code;
  const desc = (ev.discountDesc || '').trim();
  descEl.textContent = desc;
  descEl.style.display = desc ? '' : 'none';

  codeBtn.classList.remove('copied');
  hint.textContent = '點擊複製';
  codeBtn.onclick = () => {
    copyToClipboard(code).then(ok => {
      if (ok) sendStat(baseKey + '_code', 'click');
      flashGcCopied(ok);
    });
  };

  wrap.classList.add('show');
}

// Apps Script 前台可能不是 https（或舊瀏覽器），navigator.clipboard 不一定存在，退回 execCommand
function copyToClipboard(code) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(code).then(() => true).catch(() => legacyCopy(code));
  }
  return Promise.resolve(legacyCopy(code));
}

function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) {
    return false;
  }
}

function closeGroupChoiceModal() {
  document.getElementById('groupChoiceModal').classList.remove('show');
}

document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('modeSelect').addEventListener('change', (e) => {
  currentMode = e.target.value;
  render();
});

loadCustomBlocks().then(() => { if (currentMode === 'list') render(); });
loadData();

// 自動更新（2026-07-31 改）：原本是不管有沒有人在看，每 60 秒硬打兩支後端 API。
// 客人把分頁開著一小時＝120 次執行作業，是 Apps Script 同時執行作業逼近上限的主因之一。
// 改成①間隔拉長到 5 分鐘 ②分頁被切走／縮到背景就停，切回來若超過一個間隔沒更新才補抓一次。
const AUTO_REFRESH_MS = 5 * 60 * 1000;
let autoRefreshTimer = null;
let lastRefreshAt = Date.now();

function refreshAll() {
  lastRefreshAt = Date.now();
  loadData();
  loadCustomBlocks();
}

function startAutoRefresh() {
  if (autoRefreshTimer) return;
  autoRefreshTimer = setInterval(() => {
    if (document.hidden) return; // 保險：有些瀏覽器不會觸發 visibilitychange
    refreshAll();
  }, AUTO_REFRESH_MS);
}

function stopAutoRefresh() {
  if (!autoRefreshTimer) return;
  clearInterval(autoRefreshTimer);
  autoRefreshTimer = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopAutoRefresh();
    flushStats(); // 離開前把還沒送出的統計送掉
  } else {
    if (Date.now() - lastRefreshAt >= AUTO_REFRESH_MS) refreshAll();
    startAutoRefresh();
  }
});
window.addEventListener('pagehide', flushStats);

if (!document.hidden) startAutoRefresh();

// 頁面瀏覽量統計：每次載入送一次，key 格式與 getStatKey 同款日期組法（本地時區、月/日不補零）
(function sendIndexPageview() {
  const d = new Date();
  sendStat(`page_index_${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`, 'view');
})();
</script>
