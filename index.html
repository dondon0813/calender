<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪莉與朵栗 團購行事曆</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;700;800&display=swap');

  * { box-sizing: border-box; min-width: 0; }
  html, body { width: 100%; overflow-x: hidden; }

  body {
    margin: 0;
    font-family: 'Noto Sans TC', sans-serif;
    background: linear-gradient(180deg, #FFF7EE 0%, #FFF1E6 100%);
    color: #5a4a3f;
    padding: 16px 8px 50px;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    background: #FFFBF5;
    border-radius: 22px;
    border: 3px solid #FFE3CC;
    padding: 18px 14px 26px;
    box-shadow: 0 10px 30px rgba(230, 160, 120, 0.15);
    position: relative;
  }

  .site-home-btn {
    position: fixed;
    top: 14px;
    right: 14px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #FFD3B6;
    color: #b5755a;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 3px 10px rgba(230,160,120,0.25);
    z-index: 30;
    cursor: pointer;
  }
  .site-home-btn:hover { background: #FFF1E6; }

  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  .header-row2 {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .month-num {
    font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
    font-weight: 800;
    font-size: 46px;
    color: #FF8FA3;
    line-height: 1;
    text-shadow: 2px 2px 0 #FFE0E8;
    flex: none;
  }

  .title-img {
    height: 96px;
    width: auto;
    max-width: 100%;
    flex: 1 1 auto;
    object-fit: contain;
  }

  @media (max-width: 480px) {
    .title-img { height: 68px; }
  }

  .controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .controls select, .controls button {
    font-family: 'Noto Sans TC', sans-serif;
    font-weight: 700;
    font-size: 13px;
    border-radius: 999px;
    border: 2px solid #FFD3B6;
    background: #fff;
    color: #b5755a;
    padding: 7px 14px;
    cursor: pointer;
  }
  .controls button:hover { background: #FFF1E6; }

  .status {
    font-size: 11px;
    color: #b39a8b;
    margin-bottom: 10px;
  }
  .status.error { color: #e0654f; }

  .weekdays {
    display: grid;
    gap: 5px;
    margin-bottom: 6px;
  }
  .weekday {
    text-align: center;
    padding: 6px 0;
    border-radius: 999px;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .wd-0 { background: #FF8FA3; }
  .wd-1 { background: #FFB37A; }
  .wd-2 { background: #9ACB85; }
  .wd-3 { background: #6FC8C2; }
  .wd-4 { background: #7AAEEB; }
  .wd-5 { background: #B79AE8; }
  .wd-6 { background: #FF8FA3; }

  .month-grid {
    border-top: 2px solid #F3E2D3;
    border-left: 2px solid #F3E2D3;
    border-radius: 12px;
    overflow: hidden;
  }

  .week {
    display: grid;
    border-bottom: 2px solid #F3E2D3;
  }

  .daycell {
    grid-row: 1 / -1;
    border-right: 2px solid #F3E2D3;
    background: #FFFDFA;
    padding: 5px 4px 4px;
    min-height: 30px;
  }
  .daycell.dim { background: #FBF6EF; }
  .daycell.today {
    background: #FFE9C2;
    box-shadow: inset 0 0 0 2px #FFB454;
  }
  .daynum {
    font-weight: 700;
    font-size: 13px;
    color: #a89888;
  }
  .daycell.dim .daynum { color: #ddd0c2; }
  .daycell.today .daynum { color: #C97A1A; font-weight: 900; }

  .daycell-list {
    border-right: 2px solid #F3E2D3;
    background: #FFFDFA;
    padding: 5px 4px 6px;
    min-height: 30px;
  }
  .daycell-list.dim { background: #FBF6EF; }
  .daycell-list.today {
    background: #FFE9C2;
    box-shadow: inset 0 0 0 2px #FFB454;
  }
  .daycell-list.today .daynum { color: #C97A1A; font-weight: 900; }
  .daycell-list .events-stack {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 3px;
  }

  .ebar {
    margin: 3px 2px;
    border-radius: 999px;
    padding: 2px 8px;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow: hidden;
    white-space: nowrap;
    font-size: 11px;
    align-self: center;
    z-index: 2;
    text-decoration: none;
    color: inherit;
  }
  .ebar.clickable {
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .ebar.clickable:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }

  .ebar-wrap {
    align-self: stretch;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    white-space: normal;
    border-radius: 10px;
    text-align: center;
    position: relative;
  }
  .ebar-wrap .ev-tag {
    margin-left: 0;
    margin-top: 2px;
  }

  .ebar-wrap.cat-upcoming {
    background: #FFF6DD;
    border: 1.5px solid #E8B93D;
    color: #8A6D1F;
  }
  .ebar-wrap.cat-active {
    background: #FFEcD9;
    border: 1.5px solid #FF9F4A;
    color: #B5601C;
  }
  .ebar-wrap.cat-closingSoon {
    background: #FFE1E8;
    border: 1.5px solid #FF6F91;
    color: #C1315A;
  }
  .ebar-wrap.cat-ended {
    background: #EFEBE5;
    border: 1.5px solid #B8AC9C;
    color: #7A7166;
  }
  .ebar-wrap.cat-frozen {
    background-color: #E6F1FC;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><text x='8' y='46' font-size='42' fill='white' fill-opacity='0.35'>%E2%9D%84</text></svg>");
    background-repeat: no-repeat;
    background-position: bottom right;
    background-size: 34px 34px;
    border: 1.5px solid #4F91D9;
    color: #2F6FB0;
  }

  .group-list {
    padding: 4px 2px 8px;
  }
  .gs-section-title {
    text-align: center;
    font-weight: 900;
    font-size: 20px;
    margin: 18px 0 12px;
    letter-spacing: 1px;
  }
  .gs-section-title:first-child { margin-top: 4px; }
  .gs-title-closing { color: #E0405F; }
  .gs-title-active { color: #C98A3E; }
  .gs-title-ended { color: #7A7166; }
  .gs-card {
    display: block;
    position: relative;
    background: #B98868;
    color: #fff;
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 14px;
    text-align: center;
    text-decoration: none;
    cursor: default;
    transition: transform 0.12s ease;
  }
  .gs-card.clickable { cursor: pointer; }
  .gs-card.clickable:hover { transform: scale(1.015); }
  .gs-card.gs-today {
    background: #7A5A42;
    box-shadow: 0 0 0 3px #FFD3DC;
  }
  .gs-card.gs-card-gray {
    background: #C9C1B4;
    color: #6b6255;
  }
  .gs-card-name {
    font-size: 19px;
    font-weight: 700;
  }
  .gs-card-date {
    font-size: 13px;
    opacity: 0.85;
    margin-top: 4px;
  }
  .gs-card-icons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 8px;
  }
  .gs-card-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    cursor: pointer;
  }
  .gs-card-icon svg { width: 60%; height: 60%; display: block; }
  .gs-card-icon:hover { background: rgba(255,255,255,0.4); }
  .gs-badges {
    position: absolute;
    top: -10px;
    right: 12px;
    display: flex;
    gap: 6px;
  }
  .gs-today-badge,
  .gs-frozen-badge {
    white-space: nowrap;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  .gs-today-badge { background: #FF4D6D; }
  .gs-frozen-badge { background: #4F91D9; }
  .gs-empty {
    text-align: center;
    color: #a89787;
    padding: 30px 0;
    font-size: 14px;
  }

  /* ===== 【新】品牌社群連結列（現正開團中最上方）===== */
  .site-social-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin: 4px 0 18px;
    flex-wrap: wrap;
  }
  .site-social-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--social-icon-color, #FFD3B6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--social-icon-color, #b5755a);
    text-decoration: none;
    box-shadow: 0 3px 8px rgba(230,160,120,0.15);
    cursor: pointer;
  }
  .site-social-icon svg { width: 50%; height: 50%; display: block; }
  .site-social-icon:hover { background: #FFF1E6; }

  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(90, 74, 63, 0.45);
    z-index: 50;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.show {
    display: flex;
  }
  .modal-box {
    position: relative;
    background: #FFFBF5;
    border-radius: 18px;
    border: 3px solid #FFE3CC;
    padding: 24px 22px;
    max-width: 90%;
    width: 360px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .modal-box h3 {
    margin: 0 0 12px;
    color: #FF8FA3;
    font-size: 17px;
  }
  .modal-box ul {
    margin: 0;
    padding-left: 18px;
    color: #5a4a3f;
    font-size: 14px;
    line-height: 1.7;
  }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    border: none;
    background: none;
    font-size: 16px;
    color: #b5755a;
    cursor: pointer;
  }

  .gc-modal-box {
    text-align: center;
  }
  .gc-title {
    font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
    font-weight: 800;
    font-size: 17px;
    color: #5a4a3f;
    margin: 4px 0 18px;
    padding-right: 10px;
  }
  .gc-btns {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .gc-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    font-weight: 800;
    font-size: 14px;
    border-radius: 999px;
    padding: 12px 14px;
    color: #fff;
    cursor: pointer;
    border: none;
  }
  .gc-btn-intro { background: #7AAEEB; }
  .gc-btn-intro:hover { background: #5F97DB; }
  .gc-btn-recipe { background: #FFB37A; }
  .gc-btn-recipe:hover { background: #F0A05F; }
  .gc-btn-order { background: #FF8FA3; }
  .gc-btn-order:hover { background: #FF7391; }

  .badge {
    flex: none;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    color: #fff;
    font-weight: 800;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ev-date {
    flex: none;
    font-weight: 800;
    color: #fff;
    font-size: 11px;
  }
  .ev-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #fff;
    font-weight: 500;
  }
  .ev-title-wrap {
    flex: 1 1 0%;
    min-width: 0;
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    line-height: 1.3;
    word-break: keep-all;
    overflow-wrap: normal;
    color: inherit;
    font-weight: 700;
  }
  .ev-tag {
    flex: none;
    background: #FF5C8A;
    color: #fff;
    font-weight: 800;
    font-size: 9px;
    border-radius: 999px;
    padding: 1px 6px;
    margin-left: auto;
  }

  .c0 .badge { background: #FFE6EC; color: #FF8FA3; } .c0.ebar { background: #FF8FA3; }
  .c1 .badge { background: #FFEcD6; color: #FFB37A; } .c1.ebar { background: #FFB37A; }
  .c2 .badge { background: #E4F5DF; color: #9ACB85; } .c2.ebar { background: #9ACB85; }
  .c3 .badge { background: #DEF5F4; color: #6FC8C2; } .c3.ebar { background: #6FC8C2; }
  .c4 .badge { background: #E2EBFD; color: #7AAEEB; } .c4.ebar { background: #7AAEEB; }
  .c5 .badge { background: #EFE4FB; color: #B79AE8; } .c5.ebar { background: #B79AE8; }
  .c6 .badge { background: #FBEFD9; color: #D9A441; } .c6.ebar { background: #F0C36D; }

  .footer {
    text-align: center;
    margin-top: 18px;
    color: #FF8FA3;
    font-weight: 700;
    font-size: 14px;
  }

  .legend {
    display: none;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    margin-top: 16px;
    padding-top: 10px;
    border-top: 1.5px dashed #F3E2D3;
  }
  .legend.show {
    display: flex;
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    color: #a89888;
  }
  .legend-dot {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    display: inline-block;
    flex: none;
  }
  .legend-upcoming { background: #FFF6DD; border: 1.5px solid #E8B93D; }
  .legend-active { background: #FFEcD9; border: 1.5px solid #FF9F4A; }
  .legend-closingSoon { background: #FFE1E8; border: 1.5px solid #FF6F91; }
  .legend-ended { background: #EFEBE5; border: 1.5px solid #B8AC9C; }
  .legend-frozen { background: #E6F1FC; border: 1.5px solid #4F91D9; }
  .footer a {
    color: inherit;
    text-decoration: none;
  }
  .footer a:hover {
    text-decoration: underline;
  }

  @media (max-width: 480px) {
    .month-num { font-size: 36px; }
    .weekday { font-size: 10px; }
    .daynum { font-size: 11px; }
    .ebar { font-size: 9.5px; padding: 2px 6px; }
    .badge { width: 14px; height: 14px; font-size: 8.5px; }
    .ev-date { font-size: 9.5px; }
    .ev-tag { font-size: 8px; }
  }

  .cb-card {
    display: block;
    border-radius: 16px;
    padding: 14px 20px;
    margin-bottom: 14px;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform 0.12s ease;
  }
  .cb-card:hover { transform: scale(1.015); }
  .cb-title {
    font-family: 'Baloo 2', 'Noto Sans TC', sans-serif;
    font-weight: 700;
  }
  .cb-subtitle {
    font-size: 12.5px;
    opacity: 0.85;
    margin-top: 4px;
  }
  @keyframes cbShake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
    20%, 40%, 60%, 80% { transform: translateX(4px); }
  }
  @keyframes cbBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  @keyframes cbVibrate {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-1.5deg); }
    75% { transform: rotate(1.5deg); }
  }
  .cb-anim-shake { animation: cbShake 0.6s ease-in-out infinite; }
  .cb-anim-bounce { animation: cbBounce 0.9s ease-in-out infinite; }
  .cb-anim-vibrate { animation: cbVibrate 0.35s ease-in-out infinite; }
</style>
</head>

const STATS_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzTxoqVO1nf--Q9s-lf1eIPdgrDpJgLsuAy1mAwgydYzb7ThAuygx79oFNsEH-kWD2R/exec';
const sentViewKeys = new Set();
let statObserver = null;

function getStatKey(ev) {
  const s = ev.start;
  return `${ev.id}_${s.getFullYear()}-${s.getMonth() + 1}-${s.getDate()}`;
}

function sendStat(key, field) {
  if (!key || !STATS_BACKEND_URL) return;
  const type = field === 'click' ? 'stat-click' : 'stat-view';
  const payload = JSON.stringify({ type, key });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(STATS_BACKEND_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    } else {
      fetch(STATS_BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }
  } catch (e) { /* 統計失敗不影響使用者瀏覽，安靜忽略 */ }
}

function getStatObserver() {
  if (!statObserver) {
    statObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const key = entry.target.dataset.statKey;
        if (key && !sentViewKeys.has(key)) {
          sentViewKeys.add(key);
          sendStat(key, 'view');
        }
        statObserver.unobserve(entry.target);
      });
    }, { threshold: 0.5 });
  }
  return statObserver;
}

// 【修改】點擊時除了送出整體點擊次數，還多送一筆「依目前顯示模式（開團日／結團日／全部顯示／現正開團中）」
// 分開計算的點擊次數，key 格式固定是 團購key + '_src_' + mode，後台可以分開看是哪個表單點的人最多
function attachStatTracking(el, ev, clickable) {
  const key = getStatKey(ev);
  el.dataset.statKey = key;
  getStatObserver().observe(el);
  if (clickable) {
    el.addEventListener('click', () => {
      sendStat(key, 'click');
      sendStat(key + '_src_' + currentMode, 'click');
    });
  }
}

  start: [1,2,3,4,5],
  end:   [0,1,2,3,4]
};

function parseDateStr(s) {
  if (!s) return null;
  s = String(s).trim();
  const gvizMatch = s.match(/Date\((\d+),(\d+),(\d+)\)/);
  if (gvizMatch) {
    return new Date(parseInt(gvizMatch[1]), parseInt(gvizMatch[2]), parseInt(gvizMatch[3]));
  }
  const parts = s.split(/[\/\-]/).map(p => parseInt(p, 10));
  if (parts.length === 3) return new Date(parts[0], parts[1] - 1, parts[2]);
  return null;
}

function fmtDateLabel(start, end) {
  const f = d => `${d.getMonth()+1}/${d.getDate()}`;
  return `${f(start)}–${f(end)}`;
}

function fmtSingleDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function isSameDate(a, b) {
  return a.getFullYear() === b.getFullYear() &&
         a.getMonth() === b.getMonth() &&
         a.getDate() === b.getDate();
}

function daysBetween(a, b) {
  const A = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const B = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}

function segmentTitle(title) {
  if (typeof Intl !== 'undefined' && Intl.Segmenter) {
    try {
      const seg = new Intl.Segmenter('zh', { granularity: 'word' });
      const parts = [];
      for (const s of seg.segment(title)) {
        if (s.segment && s.segment.trim() !== '') parts.push(s.segment);
      }
      if (parts.length) return parts;
    } catch (e) { /* fallback below */ }
  }
  return title.split('');
}

const KNOWN_BRANDS = ['林貝兒', '小影霸', '台東初鹿', '永圻魚湯', '雪坊優格', '兔比媽咪廚房'];

function wrapTitleLines(title, maxCharsPerLine) {
  const manualParts = title.split(/[\/、]/).map(s => s.trim()).filter(s => s !== '');
  if (manualParts.length > 1) {
    const lines = [];
    manualParts.forEach(part => {
      lines.push(...wrapSegment(part, maxCharsPerLine));
    });
    return lines;
  }

  const brand = KNOWN_BRANDS.find(b => title.startsWith(b));
  if (brand) {
    const rest = title.slice(brand.length).trim();
    const lines = [brand];
    if (rest) lines.push(...wrapSegment(rest, maxCharsPerLine));
    return lines;
  }

  return wrapSegment(title, maxCharsPerLine);
}

function wrapSegment(text, maxCharsPerLine) {
  const words = segmentTitle(text);
  const lines = [];
  let current = '';
  words.forEach(w => {
    if (current === '') {
      current = w;
    } else if (current.length + w.length <= maxCharsPerLine) {
      current += w;
    } else {
      lines.push(current);
      current = w;
    }
  });
  if (current) lines.push(current);
  return lines;
}

const FROZEN_KEYWORDS = ['永圻魚湯', '雪坊優格', '兔比媽咪廚房'];

function isFrozenEvent(ev) {
  const cat = (ev.category || '').toString().trim();
  if (cat !== '') {
    return cat.includes('冷凍');
  }
  return FROZEN_KEYWORDS.some(k => ev.title.includes(k));
}

function isLinkUnlocked(ev) {
  if (!ev.url) return false;
  return new Date() >= ev.start;
}

function hasAdvancedIntro(ev) {
  return !!(ev.recipeBrand && ev.recipeBrand.trim());
}

function parseExtendRaw(raw, originalEnd) {
  if (raw === null || raw === undefined || raw === '') return null;
  if (typeof raw === 'number') {
    return { type: 'days', value: raw };
  }
  const s = String(raw).trim();
  if (s === '') return null;
  if (/^\d+$/.test(s)) {
    return { type: 'days', value: parseInt(s, 10) };
  }
  const d = parseDateStr(s);
  if (d) return { type: 'date', value: d };
  return null;
}

function computeDisplayEnd(end, extend) {
  if (!extend) return end;
  const today = new Date();
  const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  const endStart = new Date(end.getFullYear(), end.getMonth(), end.getDate());
  if (todayStart <= endStart) return end;
  if (extend.type === 'days') {
    return new Date(end.getFullYear(), end.getMonth(), end.getDate() + extend.value);
  }
  return extend.value;
}

async function loadData() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = '資料載入中…';
  statusEl.classList.remove('error');
  try {
    const res = await fetch(GVIZ_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('網路錯誤 ' + res.status);
    const text = await res.text();
    const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
    const data = JSON.parse(jsonStr);
    const rows = data.table.rows;

    const events = [];
    rows.forEach((row) => {
      const c = row.c;
      if (!c || !c[0] || c[0].v === null || c[0].v === '') return;
      const id = c[0].v;
      const startRaw = c[1] ? c[1].v : null;
      const endRaw = c[2] ? c[2].v : null;
      const extendRaw = c[3] ? c[3].v : null;
      const title = c[4] ? c[4].v : '';
      const tag = c[5] ? c[5].v : '';
      const category = c[6] ? c[6].v : '';
      const url = c[7] ? c[7].v : '';
      const adminUrl = c[8] ? c[8].v : '';
      const earlyBirdRaw = c[9] ? c[9].v : '';
      const recipeBrandRaw = c[10] ? c[10].v : '';
      const colorRaw = c[11] ? c[11].v : '';
      const isGroupBuyRaw = c[15] ? String(c[15].v || '').trim() : '';
      const publishedRaw = c[16] ? String(c[16].v || '').trim() : '';
      const iconIg = c[17] ? String(c[17].v || '').trim() : '';
      const iconTiktok = c[18] ? String(c[18].v || '').trim() : '';
      const iconFb = c[19] ? String(c[19].v || '').trim() : '';
      const iconEmail = c[20] ? String(c[20].v || '').trim() : '';
      const start = parseDateStr(startRaw);
      const end = parseDateStr(endRaw);
      if (!start || !end || !title) return;
      const extend = parseExtendRaw(extendRaw, end);
      const displayEnd = computeDisplayEnd(end, extend);
      const earlyBird = String(earlyBirdRaw || '').split('/').map(s => s.trim()).filter(s => s !== '');
      const color = String(colorRaw || '').trim();
      const recipeBrand = String(recipeBrandRaw || '').trim();
      const isGroupBuy = isGroupBuyRaw === '' ? true : (isGroupBuyRaw === '是');
      const published = publishedRaw === '' ? true : (publishedRaw === '是');
      if (!published) return;
      events.push({ id, start, end, extend, displayEnd, title, tag, category, url, adminUrl, earlyBird, color, isGroupBuy, recipeBrand, iconIg, iconTiktok, iconFb, iconEmail });
    });

    allEvents = events;
    statusEl.textContent = `已同步 ${events.length} 檔活動 · ${new Date().toLocaleString('zh-TW')}`;
    populateMonthSelect();
    render();
  } catch (err) {
    statusEl.textContent = '讀取試算表失敗，請確認試算表已設定「知道連結的人可檢視」。(' + err.message + ')';
    statusEl.classList.add('error');
  }
}

function populateMonthSelect() {
  const sel = document.getElementById('monthSelect');
  const monthsSet = new Set();
  allEvents.forEach(ev => {
    let d = new Date(ev.start.getFullYear(), ev.start.getMonth(), 1);
    const endD = new Date(ev.displayEnd.getFullYear(), ev.displayEnd.getMonth(), 1);
    while (d <= endD) {
      monthsSet.add(`${d.getFullYear()}-${d.getMonth()}`);
      d.setMonth(d.getMonth() + 1);
    }
  });

  const now = new Date();
  const todayKey = `${now.getFullYear()}-${now.getMonth()}`;
  monthsSet.add(todayKey);

  let months = Array.from(monthsSet).map(s => {
    const [y, m] = s.split('-').map(Number);
    return { y, m };
  }).sort((a, b) => a.y - b.y || a.m - b.m);

  sel.innerHTML = '';
  months.forEach(({ y, m }) => {
    const opt = document.createElement('option');
    opt.value = `${y}-${m}`;
    opt.textContent = `${y}年 ${m + 1}月`;
    sel.appendChild(opt);
  });

  if (currentYear === undefined) {
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
  }
  sel.value = `${currentYear}-${currentMonth}`;
  sel.onchange = () => {
    const [y, m] = sel.value.split('-').map(Number);
    currentYear = y; currentMonth = m;
    render();
  };
}

function render() {
  if (currentYear === undefined) return;

  const isList = currentMode === 'list';

  document.getElementById('monthSelect').style.display = isList ? 'none' : '';

// 【新】最近結束的團購（給「結團查詢」用），依結束日期新到舊排序
function getRecentEndedEvents(limit) {
  const ended = allEvents.filter(ev => getEventStatus(ev) === 'ended');
  ended.sort((a, b) => b.displayEnd - a.displayEnd);
  return ended.slice(0, limit || 7);
}

function renderGroupList() {
  const listEl = document.getElementById('groupList');
  listEl.innerHTML = '';

  // 【新】品牌社群連結列，放在整個清單最上方
  const socialRow = buildSocialIconRow();
  if (socialRow) listEl.appendChild(socialRow);

  appendCustomBlocks(listEl, 'before');

  const todayStart = startOfDay(new Date());
  const closingItems = [];
  const activeItems = [];

  allEvents.forEach(ev => {
    const status = getEventStatus(ev);
    if (status === 'closingSoon') closingItems.push(ev);
    else if (status === 'active') activeItems.push(ev);
  });

  closingItems.sort((a, b) => a.displayEnd - b.displayEnd);
  activeItems.sort((a, b) => a.displayEnd - b.displayEnd);

  const buildCard = (ev, grayOut) => {
    const daysLeft = daysBetween(todayStart, startOfDay(ev.displayEnd));
    const isToday = !grayOut && daysLeft === 0 && getEventStatus(ev) === 'closingSoon';
    const frozen = isFrozenEvent(ev);
    const clickable = isLinkUnlocked(ev);
    const advanced = clickable && hasAdvancedIntro(ev);

    const card = document.createElement((clickable && !advanced) ? 'a' : 'div');
    card.className = 'gs-card' + (isToday ? ' gs-today' : '') + (clickable ? ' clickable' : '') + (grayOut ? ' gs-card-gray' : '');
    if (clickable && !advanced) {
      card.href = ev.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
    } else if (advanced) {
      card.addEventListener('click', () => openGroupChoiceModal(ev));
    }
    attachStatTracking(card, ev, clickable);
    card.title = ev.title + (ev.url && !clickable ? '（開團後才能點擊連結）' : '') + (advanced ? '（點擊查看更多選項）' : '');

    const nameEl = document.createElement('div');
    nameEl.className = 'gs-card-name';
    nameEl.textContent = ev.title;
    card.appendChild(nameEl);

    const dateEl = document.createElement('div');
    dateEl.className = 'gs-card-date';
    dateEl.textContent = fmtDateLabel(ev.start, ev.displayEnd);
    card.appendChild(dateEl);

    const icons = buildEventIconElements(ev);
    if (icons.length) {
      const iconsWrap = document.createElement('div');
      iconsWrap.className = 'gs-card-icons';
      icons.forEach(el => iconsWrap.appendChild(el));
      card.appendChild(iconsWrap);
    }

    if (frozen || isToday) {
      const badges = document.createElement('div');
      badges.className = 'gs-badges';
      if (frozen) {
        const frozenBadge = document.createElement('span');
        frozenBadge.className = 'gs-frozen-badge';
        frozenBadge.textContent = '❄冷藏冷凍團';
        badges.appendChild(frozenBadge);
      }
      if (isToday) {
        const todayBadge = document.createElement('span');
        todayBadge.className = 'gs-today-badge';
        todayBadge.textContent = '今日截止';
        badges.appendChild(todayBadge);
      }
      card.appendChild(badges);
    }

    return card;
  };

  const buildSection = (title, arr) => {
    if (!arr.length) return;
    const h = document.createElement('div');
    h.className = 'gs-section-title ' + (title.includes('倒數') ? 'gs-title-closing' : 'gs-title-active');
    h.textContent = title;
    listEl.appendChild(h);
    arr.forEach(ev => listEl.appendChild(buildCard(ev)));
  };

  buildSection('‼️結團倒數‼️', closingItems);
  appendCustomBlocks(listEl, 'between');
  buildSection('🌼現正團購中🌼', activeItems);

  if (!closingItems.length && !activeItems.length) {
    const empty = document.createElement('div');
    empty.className = 'gs-empty';
    empty.textContent = '目前沒有進行中的團購';
    listEl.appendChild(empty);
  }

  appendCustomBlocks(listEl, 'after');

  // 【新】結團查詢：最近 7 個結束的團，灰色顯示，最下方，可點開看詳情
  const endedItems = getRecentEndedEvents(7);
  if (endedItems.length) {
    const h = document.createElement('div');
    h.className = 'gs-section-title gs-title-ended';
    h.textContent = '🕰結團查詢（最近' + endedItems.length + '個）';
    listEl.appendChild(h);
    endedItems.forEach(ev => listEl.appendChild(buildCard(ev, true)));
  }
}

function renderAllMode() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const firstOfMonth = new Date(currentYear, currentMonth, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const gridStart = new Date(currentYear, currentMonth, 1 - startOffset);
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const numWeeks = totalCells / 7;

  const groupBuyNumberMap = computeMonthlyGroupBuyNumbers(currentYear, currentMonth);

  for (let w = 0; w < numWeeks; w++) {
    const weekStart = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + w * 7);
    const weekDays = [];
    for (let i = 0; i < 7; i++) {
      weekDays.push(new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i));
    }
    const weekEnd = weekDays[6];

    const weekEvents = allEvents
      .filter(ev => ev.displayEnd >= weekStart && ev.start <= weekEnd)
      .map(ev => {
        const colStart = Math.max(0, daysBetween(weekStart, ev.start));
        const colEnd = Math.min(6, daysBetween(weekStart, ev.displayEnd));
        return { ev, colStart, colEnd };
      })
      .sort((a, b) => a.colStart - b.colStart || (b.colEnd - b.colStart) - (a.colEnd - a.colStart));

    const laneEnd = [];
    weekEvents.forEach(item => {
      let lane = 0;
      while (lane < laneEnd.length && laneEnd[lane] >= item.colStart) lane++;
      laneEnd[lane] = item.colEnd;
      item.lane = lane;
    });
    const maxLanes = Math.max(1, laneEnd.length);

    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    weekEl.style.gridTemplateColumns = 'repeat(7, minmax(0, 1fr))';
    weekEl.style.gridTemplateRows = `22px repeat(${maxLanes}, 21px) 4px`;

    weekDays.forEach((d, i) => {
      const cell = document.createElement('div');
      const dim = d.getMonth() !== currentMonth;
      const today = isSameDate(d, new Date());
      cell.className = 'daycell' + (dim ? ' dim' : '') + (today ? ' today' : '');
      cell.style.gridColumn = `${i + 1}`;
      const dn = document.createElement('div');
      dn.className = 'daynum';
      dn.textContent = d.getDate();
      cell.appendChild(dn);
      weekEl.appendChild(cell);
    });

    weekEvents.forEach(item => {
      const gbNumber = groupBuyNumberMap.get(item.ev.id);
      const colorIdx = gbNumber ? (gbNumber - 1) % COLORS : (item.ev.id - 1) % COLORS;
      const clickable = isLinkUnlocked(item.ev);
      const advanced = clickable && hasAdvancedIntro(item.ev);
      const hasEarlyBird = !clickable && !isStarted(item.ev) && item.ev.earlyBird.length > 0;
      const bar = document.createElement((clickable && !advanced) ? 'a' : 'div');
      bar.className = `ebar c${colorIdx}` + (clickable ? ' clickable' : '') + (hasEarlyBird ? ' clickable' : '');
      // 【修復】依 colStart / colEnd / lane 設定跨欄位置，長條才會橫向跨天顯示。
      // 少了這兩行，瀏覽器的 grid 自動排版會把每個長條硬塞回單一天欄位、疊在一起（就是壞掉的樣子）。
      bar.style.gridColumn = `${item.colStart + 1} / ${item.colEnd + 2}`;
      bar.style.gridRow = `${item.lane + 2}`;
      if (item.ev.color) {
        bar.style.background = item.ev.color;
      }
      if (clickable && !advanced) {
        bar.href = item.ev.url;
        bar.target = '_blank';
        bar.rel = 'noopener noreferrer';
      } else if (advanced) {
        bar.addEventListener('click', () => openGroupChoiceModal(item.ev));
      } else if (hasEarlyBird) {
        bar.addEventListener('click', () => showEarlyBirdModal(item.ev));
      }
      attachStatTracking(bar, item.ev, clickable);
      bar.title = `${item.ev.title} (${fmtDateLabel(item.ev.start, item.ev.displayEnd)})` + (item.ev.url && !clickable ? '（開團後才能點擊連結）' : '') + (hasEarlyBird ? '（點擊查看早鳥禮）' : '') + (advanced ? '（點擊查看更多選項）' : '');

      if (gbNumber) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = gbNumber;
        bar.appendChild(badge);
      } else if (item.ev.isGroupBuy === false) {
        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '📌';
        badge.style.background = 'rgba(255,255,255,0.55)';
        bar.appendChild(badge);
      }

      const dateSpan = document.createElement('span');
      dateSpan.className = 'ev-date';
      dateSpan.textContent = fmtDateLabel(item.ev.start, item.ev.displayEnd);
      bar.appendChild(dateSpan);

      const titleSpan = document.createElement('span');
      titleSpan.className = 'ev-title';
      titleSpan.textContent = item.ev.title;
      bar.appendChild(titleSpan);

      if (item.ev.tag) {
        const tagSpan = document.createElement('span');
        tagSpan.className = 'ev-tag';
        tagSpan.textContent = item.ev.tag;
        bar.appendChild(tagSpan);
      }

      weekEl.appendChild(bar);
    });

    grid.appendChild(weekEl);
  }
}

function computeMonthlyGroupBuyNumbers(year, month) {
  const map = new Map();
  const inMonth = allEvents.filter(ev => {
    if (ev.isGroupBuy === false) return false;
    return ev.start.getFullYear() === year && ev.start.getMonth() === month;
  }).sort((a, b) => a.start - b.start || a.id - b.id);
  inMonth.forEach((ev, idx) => map.set(ev.id, idx + 1));
  return map;
}

function renderSingleDayMode(mode) {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const visibleDays = MODE_VISIBLE_DAYS[mode];
  const colCount = visibleDays.length;

  const firstOfMonth = new Date(currentYear, currentMonth, 1);
  const startOffset = firstOfMonth.getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const gridStart = new Date(currentYear, currentMonth, 1 - startOffset);
  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  const numWeeks = totalCells / 7;

  const dateKey = d => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  const eventsByDate = {};
  allEvents.forEach(ev => {
    const targetDate = mode === 'start' ? ev.start : ev.displayEnd;
    const wd = targetDate.getDay();
    if (!visibleDays.includes(wd)) return;
    const key = dateKey(targetDate);
    if (!eventsByDate[key]) eventsByDate[key] = [];
    eventsByDate[key].push(ev);
  });

  for (let w = 0; w < numWeeks; w++) {
    const weekStart = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + w * 7);
    const weekDays = [];
    for (let i = 0; i < 7; i++) {
      weekDays.push(new Date(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate() + i));
    }

    const weekEl = document.createElement('div');
    weekEl.className = 'week';
    weekEl.style.gridTemplateColumns = `repeat(${colCount}, minmax(0, 1fr))`;
    weekEl.style.gridTemplateRows = 'auto';

    visibleDays.forEach((wd, colIdx) => {
      const d = weekDays[wd];
      const dim = d.getMonth() !== currentMonth;
      const today = isSameDate(d, new Date());
      const cell = document.createElement('div');
      cell.className = 'daycell-list' + (dim ? ' dim' : '') + (today ? ' today' : '');
      cell.style.gridColumn = `${colIdx + 1}`;

      const dn = document.createElement('div');
      dn.className = 'daynum';
      dn.textContent = d.getDate();
      cell.appendChild(dn);

      const key = dateKey(d);
      const dayEvents = eventsByDate[key] || [];
      if (dayEvents.length) {
        const stack = document.createElement('div');
        stack.className = 'events-stack';
        dayEvents.forEach(ev => {
          const frozen = isFrozenEvent(ev);
          const status = getEventStatus(ev);
          const clickable = isLinkUnlocked(ev);
          const advanced = clickable && hasAdvancedIntro(ev);
          const hasEarlyBird = !clickable && status === 'upcoming' && ev.earlyBird.length > 0;
          const bar = document.createElement((clickable && !advanced) ? 'a' : 'div');
          const catClass = frozen ? 'cat-frozen' : `cat-${status}`;
          bar.className = `ebar ebar-wrap ${catClass}` + (clickable || hasEarlyBird ? ' clickable' : '');
          if (clickable && !advanced) {
            bar.href = ev.url;
            bar.target = '_blank';
            bar.rel = 'noopener noreferrer';
          } else if (advanced) {
            bar.addEventListener('click', () => openGroupChoiceModal(ev));
          } else if (hasEarlyBird) {
            bar.addEventListener('click', () => showEarlyBirdModal(ev));
          }
          attachStatTracking(bar, ev, clickable);
          bar.title = `${ev.title} (${mode === 'start' ? '開團' : '結團'} ${fmtSingleDate(mode === 'start' ? ev.start : ev.displayEnd)})` + (ev.url && !clickable ? '（開團後才能點擊連結）' : '') + (hasEarlyBird ? '（點擊查看早鳥禮）' : '') + (advanced ? '（點擊查看更多選項）' : '');

          const titleSpan = document.createElement('span');
          titleSpan.className = 'ev-title ev-title-wrap';
          const lines = wrapTitleLines(ev.title, 4);
          lines.forEach((line, idx) => {
            if (idx > 0) titleSpan.appendChild(document.createElement('br'));
            titleSpan.appendChild(document.createTextNode(line));
          });
          bar.appendChild(titleSpan);

          if (ev.tag) {
            const tagSpan = document.createElement('span');
            tagSpan.className = 'ev-tag';
            tagSpan.textContent = ev.tag;
            bar.appendChild(tagSpan);
          }

          stack.appendChild(bar);
        });
        cell.appendChild(stack);
      }

      weekEl.appendChild(cell);
    });

    grid.appendChild(weekEl);
  }
}

function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function isStarted(ev) {
  return startOfDay(new Date()) >= startOfDay(ev.start);
}

function getEventStatus(ev) {
  const todayStart = startOfDay(new Date());
  const startD = startOfDay(ev.start);
  const endD = startOfDay(ev.displayEnd);
  if (todayStart < startD) return 'upcoming';
  if (todayStart > endD) return 'ended';
  const closeThreshold = new Date(endD.getFullYear(), endD.getMonth(), endD.getDate() - 1);
  if (todayStart >= closeThreshold) return 'closingSoon';
  return 'active';
}

function showEarlyBirdModal(ev) {
  const modal = document.getElementById('earlyBirdModal');
  const titleEl = document.getElementById('earlyBirdTitle');
  const listEl = document.getElementById('earlyBirdList');
  titleEl.textContent = ev.title + ' 早鳥禮';
  listEl.innerHTML = '';
  ev.earlyBird.forEach(item => {
    const li = document.createElement('li');
    li.textContent = item;
    listEl.appendChild(li);
  });
  modal.classList.add('show');
}

function closeEarlyBirdModal() {
  document.getElementById('earlyBirdModal').classList.remove('show');
}

function openGroupChoiceModal(ev) {
  const brand = (ev.recipeBrand || '').trim();
  if (!brand) return;

  const modal = document.getElementById('groupChoiceModal');
  document.getElementById('groupChoiceTitle').textContent = ev.title;

  const introBtn = document.getElementById('gcIntroBtn');
  const recipeBtn = document.getElementById('gcRecipeBtn');
  const orderBtn = document.getElementById('gcOrderBtn');

  const baseKey = getStatKey(ev);

  introBtn.href = `${RECIPES_PAGE_URL}?view=ingredients&brand=${encodeURIComponent(brand)}`;
  introBtn.onclick = () => sendStat(baseKey + '_intro', 'click');

  recipeBtn.href = `${RECIPES_PAGE_URL}?view=recipes&brand=${encodeURIComponent(brand)}`;
  recipeBtn.textContent = `🍽 ${brand} 食譜大全`;
  recipeBtn.onclick = () => sendStat(baseKey + '_recipe', 'click');

  orderBtn.href = ev.url;
  orderBtn.onclick = () => sendStat(baseKey + '_order', 'click');

  modal.classList.add('show');
}

function closeGroupChoiceModal() {
  document.getElementById('groupChoiceModal').classList.remove('show');
}

document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('modeSelect').addEventListener('change', (e) => {
  currentMode = e.target.value;
  render();
});

loadCustomBlocks().then(() => { if (currentMode === 'list') render(); });
loadData();
setInterval(loadData, 60000);
setInterval(loadCustomBlocks, 60000);
</script>
