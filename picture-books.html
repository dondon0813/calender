<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>雪莉與朵栗 繪本館</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* picture-books.html 專屬樣式。共用的 reset / 版面 / 標題 / 頁尾 / modal 在 shared.css。 */

  .pb-featured { margin: 0 0 16px; }
  .pb-featured-set { margin: 0 0 14px; }
  .pb-featured-set:last-child { margin-bottom: 0; }
  .pb-featured-title {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--c-muted);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .pb-featured-intro {
    font-size: 11.5px;
    color: var(--c-muted);
    margin: -4px 0 8px;
    line-height: 1.5;
  }
  .pb-featured-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  .pb-featured-item { flex: 0 0 auto; width: 76px; text-align: center; cursor: pointer; }
  .pb-featured-item:active { opacity: .8; }
  .pb-featured-cover-wrap {
    width: 76px;
    height: 92px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  /* 封面都是去背圖：不裁切、不墊底色，跟書卡格同一種自由呈現（灰底框只留給沒圖的占位） */
  .pb-featured-cover-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .pb-featured-cover-wrap.placeholder {
    padding: 4px;
    align-items: center;
    background: var(--c-border-light);
    border-radius: var(--r-md);
  }
  .pb-featured-cover-wrap.placeholder span {
    font-size: 10px;
    font-weight: 700;
    color: var(--c-brown);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .pb-featured-name {
    margin-top: 4px;
    font-size: 11px;
    font-weight: 700;
    color: var(--c-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .pb-search-row { margin-bottom: 14px; }
  .pb-search-input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 700;
    color: var(--c-text);
    border: 1px solid var(--c-border);
    border-radius: var(--r-pill);
    padding: 10px 16px;
    background: #fff;
    outline: none;
  }
  .pb-search-input::placeholder { color: var(--c-placeholder); }
  .pb-search-input:focus { border-color: var(--c-primary); }

  .filter-section { margin-bottom: 14px; }
  .filter-label {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--c-muted);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-size: 12px;
    font-weight: 700;
    border-radius: var(--r-pill);
    border: 1px solid var(--c-border);
    background: #fff;
    color: var(--c-brown);
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }

  .pb-count {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--c-muted);
    margin: 14px 0 10px;
  }

  .status-msg { text-align: center; color: var(--c-muted-light); font-size: 12px; padding: 30px 0; }
  .status-msg.error { color: var(--c-danger); }
  .empty-state { text-align: center; color: var(--c-muted-light); font-size: 13px; padding: 40px 0; }

  .pb-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px 12px;
  }
  @media (min-width: 640px) { .pb-grid { grid-template-columns: repeat(4, 1fr); gap: 22px 18px; } }
  @media (min-width: 900px) { .pb-grid { grid-template-columns: repeat(5, 1fr); gap: 24px 20px; } }
  @media (min-width: 1200px) { .pb-grid { grid-template-columns: repeat(6, 1fr); gap: 24px 20px; } }

  .pb-card {
    background: none;
    border: none;
    border-radius: 0;
    box-shadow: none;
    overflow: visible;
    cursor: pointer;
    text-align: center;
    padding: 0;
    transition: transform .15s ease;
  }
  .pb-card:hover { transform: translateY(-4px) scale(1.03); }

  .pb-card-cover-wrap {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 150px;
    margin-bottom: 8px;
  }
  @media (min-width: 640px) { .pb-card-cover-wrap { height: 190px; } }
  .pb-card-cover-wrap.placeholder {
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: var(--c-placeholder);
    opacity: .55;
  }
  .pb-card-cover {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    background: transparent;
  }
  .pb-card-body { padding: 0; }
  .pb-card-title {
    font-family: var(--font-round);
    font-weight: 700;
    font-size: 13px;
    color: var(--c-text);
    line-height: 1.35;
    margin-bottom: 6px;
    text-align: center;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .pb-card-likes { font-size: 10.5px; font-weight: 700; color: var(--c-muted-light); text-align: center; margin-bottom: 4px; }
  .pb-card-tags { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
  .mini-tag {
    font-size: 9px;
    font-weight: 700;
    border-radius: var(--r-pill);
    padding: 2px 7px;
    background: var(--c-mint-bg);
    color: var(--c-mint-text);
  }

  /* ===== Modal ===== */
  .modal-backdrop { padding: 16px; }
  .modal-box.pb-modal-box {
    background: #fff;
    border: none;
    padding: 22px 20px 24px;
    max-width: 92%;
    width: 420px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .rc-close-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--c-primary);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    z-index: 2;
  }
  /* 去背封面：不裁切、不墊底色，整張置中顯示 */
  .pb-cover-wrap {
    position: relative;
    margin-bottom: 14px;
    display: flex; align-items: center; justify-content: center;
    max-height: 320px;
  }
  .pb-cover-wrap img { max-width: 100%; max-height: 320px; object-fit: contain; display: block; }
  .pb-cover-wrap.placeholder {
    aspect-ratio: 3 / 4;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; color: var(--c-placeholder);
  }
  .rc-title { font-family: var(--font-display); font-weight: 800; font-size: 19px; color: var(--c-text); margin: 0 0 4px; word-break: keep-all; overflow-wrap: break-word; }
  .pb-modal-like-row { display: flex; justify-content: center; margin: 0 0 6px; }
  .pb-like-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: none; padding: 4px 10px;
    cursor: pointer; color: var(--c-muted-light); font-size: 13px; font-weight: 800;
  }
  .pb-like-btn svg { width: 20px; height: 20px; display: block; }
  .pb-like-btn.liked { color: var(--c-primary); }
  .pb-like-btn.liked svg { fill: currentColor; }
  .pb-subline { font-size: 12.5px; color: var(--c-text-soft); margin-bottom: 10px; }
  .pb-tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .pb-tag { font-size: 11px; font-weight: 700; border-radius: var(--r-pill); padding: 3px 10px; }
  .pb-tag-cat { background: var(--c-purple-bg); color: var(--c-purple-text); }
  .pb-tag-type { background: var(--c-mint-bg); color: var(--c-mint-text); }

  .rc-tip-box {
    background: var(--c-orange-bg);
    border: 1px dashed var(--c-orange-dash-2);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .rc-tip-title { font-size: 12.5px; font-weight: 800; color: var(--rcp-oil-text, var(--c-orange-text)); margin-bottom: 6px; }
  .rc-tip-text { font-size: 13px; color: var(--c-text); line-height: 1.7; white-space: pre-wrap; }

  .pb-yt-wrap {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 14px;
    background: #000;
    aspect-ratio: 16 / 9;
    cursor: pointer;
  }
  /* Shorts／直式影片：改 9:16、置中、限制寬度，不要硬塞進橫框 */
  .pb-yt-wrap.vertical {
    aspect-ratio: 9 / 16;
    /* 寬度取三者最小：容器寬、320px、或讓高度不超過 65vh 的寬度，確保比例永遠是真正的 9:16 */
    width: min(100%, 320px, calc(65vh * 9 / 16));
    margin-left: auto;
    margin-right: auto;
  }
  .pb-yt-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pb-yt-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
  .pb-yt-play {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .pb-yt-play span {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.9);
    color: var(--c-primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
  }

  /* 頂端團購入口 */
  .pb-top-purchase { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 0 0 14px; }
  .pb-top-purchase .pb-top-btn {
    display: inline-block; text-decoration: none; text-align: center;
    font-family: var(--font-round); font-weight: 800; font-size: 14px;
    color: #fff; background: var(--c-primary);
    border-radius: var(--r-pill); padding: 11px 22px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10);
  }
  .pb-top-purchase .pb-top-btn:hover { background: var(--c-primary-dark); }
  .pb-top-purchase button.pb-top-btn { border: none; cursor: pointer; font-family: var(--font-round); }
  .pb-top-purchase .pb-top-btn-soft { background: var(--c-cat-4); }
  /* 倒數按鈕（7 天內即將開團）：兩行排版，手機也不爆版 */
  .pb-top-purchase button.pb-top-btn-countdown {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    line-height: 1.3; padding: 9px 20px; max-width: 92vw;
  }
  .pb-top-btn-line1 { font-size: 13.5px; word-break: break-word; }
  .pb-top-btn-line2 { font-size: 12px; font-weight: 700; opacity: .92; letter-spacing: .3px; }
  /* 開團中：頂端活動區塊（標題＋優惠條列＋下單按鈕），手機優先、寬度貼齊搜尋列 */
  .pb-top-active {
    width: 100%; max-width: 420px; margin: 0 auto;
    background: var(--c-mint-bg, #eef8f4);
    border: 1.5px solid var(--c-mint-text, var(--c-primary));
    border-radius: var(--r-lg, 16px);
    padding: 14px 16px;
    text-align: center;
  }
  .pb-top-active-header {
    font-family: var(--font-round); font-weight: 800; font-size: 15px;
    color: var(--c-text); margin-bottom: 8px;
  }
  .pb-top-active-dates {
    font-size: 12.5px; color: var(--c-text-2, var(--c-text));
    margin: -2px 0 8px;
  }
  .pb-top-active-promos {
    text-align: left; display: flex; flex-direction: column; gap: 5px;
    max-height: 132px; overflow-y: auto;
    margin: 0 0 10px; padding: 9px 11px;
    background: rgba(255,255,255,0.65); border-radius: 10px;
  }
  .pb-top-active-promo-line { font-size: 12.5px; line-height: 1.5; color: var(--c-text); white-space: pre-wrap; word-break: break-word; }
  .pb-top-active-ctas { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .pb-top-active .pb-top-btn { margin: 0; }
  /* 滿額贈：可累積達標一次帶走，橫滑卡片列（沿用 .pb-featured-row 的橫滑模式），
     用在頂端開團活動區與「團購優惠」浮動視窗兩處，純展示不可點擊 */
  .pb-gift-wrap { margin: 0 0 10px; text-align: left; }
  .pb-gift-note { font-size: 12px; font-weight: 700; color: var(--c-text); margin: 0 0 8px; }
  .pb-gift-row {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
  }
  .pb-gift-item { flex: 0 0 auto; width: 84px; text-align: center; }
  .pb-gift-thumb-wrap {
    width: 72px;
    height: 72px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  /* 贈品圖都是去背圖：不裁切、不墊底色（灰底框只留給無圖占位），同套組小圖做法 */
  .pb-gift-thumb-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .pb-gift-thumb-wrap.placeholder {
    font-size: 24px;
    align-items: center;
    background: var(--c-border-light);
    border-radius: var(--r-md);
  }
  .pb-gift-name {
    margin-top: 4px;
    font-size: 11px;
    font-weight: 700;
    color: var(--c-text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pb-gift-badge {
    display: inline-block;
    margin-top: 3px;
    background: var(--c-primary);
    color: #fff;
    font-size: 10.5px;
    font-weight: 800;
    border-radius: var(--r-pill);
    padding: 2px 9px;
    white-space: nowrap;
  }
  .pb-gift-note-text {
    margin-top: 3px;
    font-size: 10px;
    color: var(--c-muted);
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 團購資訊浮動視窗 */
  .pb-promo-box { text-align: center; }
  .pb-promo-title { font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--c-text); margin: 6px 0 4px; }
  .pb-promo-sub { font-family: var(--font-round); font-weight: 800; font-size: 15px; color: var(--c-primary); margin-bottom: 16px; }
  .pb-promo-sec-title { font-weight: 800; font-size: 13.5px; color: var(--c-text); margin-bottom: 8px; text-align: left; }
  .pb-promo-list { list-style: none; margin: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 6px; }
  .pb-promo-list li {
    background: var(--c-mint-bg, #eef8f4); border-radius: 10px; padding: 9px 12px;
    font-size: 13.5px; line-height: 1.5; color: var(--c-text); white-space: pre-wrap; word-break: break-word;
  }
  .pb-promo-list li::before { content: '✦ '; color: var(--c-primary); font-weight: 800; }
  .pb-promo-empty { font-size: 13px; color: var(--c-text-soft); padding: 10px 0 4px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; margin-bottom: 14px; flex-wrap: wrap; }
  .action-btn { text-align: center; text-decoration: none; font-weight: 800; border: none; border-radius: var(--r-pill); background: var(--c-primary); color: #fff; cursor: pointer; flex: 1 1 auto; font-size: 13.5px; padding: 11px 12px; }
  .action-btn:hover { background: var(--c-primary-dark); }
  .action-btn-alt { background: var(--c-cat-4); }
  .action-btn-alt:hover { background: #5F97DB; }
  .pb-next-date { font-size: 12.5px; color: var(--c-text-soft); text-align: center; margin-bottom: 10px; }

  .pb-series-block { margin-bottom: 14px; }
  .pb-series-label {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--c-purple-text);
    margin-bottom: 8px;
  }
  .pb-series-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
  .pb-series-item {
    flex: 0 0 auto;
    width: 84px;
    text-align: center;
    cursor: pointer;
  }
  .pb-series-item-cover-wrap {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 84px;
    margin-bottom: 5px;
  }
  .pb-series-item-cover-wrap.placeholder {
    align-items: center;
    justify-content: center;
    font-size: 26px;
    color: var(--c-placeholder);
    opacity: .55;
  }
  .pb-series-item img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .pb-series-item-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--c-text);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .pb-materials-toggle {
    width: 100%;
    text-align: center;
    font-family: var(--font-round);
    font-weight: 800;
    font-size: 13px;
    color: var(--c-brown);
    background: var(--c-orange-bg-2);
    border: none;
    border-radius: var(--r-pill);
    padding: 10px 12px;
    cursor: pointer;
    margin-top: 4px;
  }
  .pb-materials-panel { display: none; margin-top: 12px; }
  .pb-materials-panel.show {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }
  @media (min-width: 640px) {
    .pb-materials-panel.show { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  }

  #pbToast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--c-text);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 18px;
    border-radius: var(--r-pill);
    box-shadow: var(--sh-modal);
    z-index: 210;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  #pbToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .pb-material-card {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: #fff;
    border: none;
    border-radius: 16px;
    overflow: hidden;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .pb-material-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.09); }

  .pb-material-card-img {
    width: 100%;
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border-radius: 14px;
    margin-bottom: 8px;
  }
  .pb-material-card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* 白底教材照片跟頁面背景太接近，疊一層薄灰讓它從背景浮出來（不加框、不留白邊，類似 Pinterest 卡片） */
  .pb-material-card-img::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(20, 15, 10, 0.03);
    mix-blend-mode: multiply;
    pointer-events: none;
  }
  .pb-material-card-img.placeholder {
    aspect-ratio: 3 / 4;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    color: var(--c-placeholder);
    background: var(--c-bg-bottom);
  }
  .pb-material-card-img.placeholder::after { content: none; }

  .pb-material-card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 10px 12px 12px;
  }
  .pb-material-card-titlerow { display: flex; align-items: flex-start; gap: 6px; }
  .pb-material-card-title {
    flex: 1;
    min-width: 0;
    font-family: var(--font-round);
    font-weight: 700;
    font-size: 13px;
    color: var(--c-text);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .pb-mat-more {
    flex: none;
    border: none;
    background: none;
    padding: 0;
    margin-top: 1px;
    font-family: var(--font-body);
    font-size: 11px;
    font-weight: 700;
    color: var(--c-text-soft);
    cursor: pointer;
    white-space: nowrap;
  }
  .pb-mat-more:hover { color: var(--c-text); }
  .pb-mat-desc {
    display: none;
    margin-top: 4px;
    font-size: 11.5px;
    color: var(--c-text-soft);
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .pb-mat-desc.show { display: block; }
  .pb-mat-desc .pb-mat-size { font-weight: 700; color: var(--c-text); margin-bottom: 3px; }
  .pb-mat-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;

<script>
const BOOKS_API_URL = 'https://dondon-platform.vercel.app/api/books';

let ALL_BOOKS = [];
let ALL_CATEGORIES = [];
let ALL_TYPES = [];
let USED_BRANDS = [];
let ALL_PROMOTIONS = []; // 優惠活動 [{id,text}]（後台維護，沒開團時在團購資訊視窗顯示）
let ALL_GIFTS = []; // 滿額贈 [{id,title,amount,note,imageUrl}]（後端已依 amount 低→高排序，2026-08-24）
let ALL_SETS = []; // 套組專區 [{id,title,intro,bookIds}]（公開包已算好可見性，2026-08-24）
let CURRENT_BOOK = null; // 目前開著的繪本浮動視窗，教材大圖的分享按鈕要用

// 三組篩選狀態：null 代表選「全部」，Set 代表已選中的單一具體選項（組內單選）
let selCats = null;
let selBrands = null;
let selTypes = null;
let searchTerm = '';

// ===== 書名智慧換行 =====
// 「｜」是後台可以手動指定的斷行點（比照行事曆標題的既有慣例）；沒有手動標記時，
// 標題夠長才自動在「中英交界」跟「標點符號後面」插入 <wbr>（可斷行提示，瀏覽器只有在真的
// 需要換行時才會用到，短標題不受影響，不會看起來被過度切開）。
const TITLE_BREAK_MIN_LEN = 10;
const TITLE_BREAK_PUNCT = /[，。、；：！？,.;:!?～\/]/;
function isCjkChar(ch) { return /[一-鿿㐀-䶿豈-﫿]/.test(ch); }
function isLatinDigitChar(ch) { return /[A-Za-z0-9]/.test(ch); }
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function smartBreakSegment(segment) {
  if (segment.length <= TITLE_BREAK_MIN_LEN) return escapeHtml(segment);
  let out = '';
  for (let i = 0; i < segment.length; i++) {
    const ch = segment[i];
    out += escapeHtml(ch);
    const next = segment[i + 1];
    if (!next) continue;
    const atLangBoundary = (isCjkChar(ch) && isLatinDigitChar(next)) || (isLatinDigitChar(ch) && isCjkChar(next));
    const afterPunct = TITLE_BREAK_PUNCT.test(ch);
    if (atLangBoundary || afterPunct) out += '<wbr>';
  }
  return out;
}
function smartTitleHtml(rawTitle) {
  return String(rawTitle || '').split('｜').map(smartBreakSegment).join('<br>');
}

// ===== 載入資料 =====
async function loadBooks() {
  const statusEl = document.getElementById('statusMsg');
  try {
    // 每 20 秒換一次快取鍵：CDN 仍能合併同一時段的請求，但後台存檔後最多 20 秒前台就看得到
    const bucket = Math.floor(Date.now() / 20000);
    const res = await fetch(`${BOOKS_API_URL}?v=${bucket}`, { cache: 'no-store' });
    const data = await res.json();
    if (!data || data.success !== true) throw new Error((data && data.error) || '載入失敗');

    ALL_BOOKS = data.books || [];
    ALL_CATEGORIES = (data.categories || []).slice().sort((a, b) => (a.sort || 0) - (b.sort || 0));
    ALL_TYPES = data.types || [];
    ALL_PROMOTIONS = (data.promotions || []).filter(p => p && p.text);
    ALL_GIFTS = data.gifts || [];
    ALL_SETS = data.sets || [];

    const brandIdsUsed = new Set(ALL_BOOKS.map(b => b.brand_id).filter(Boolean));
    USED_BRANDS = (data.brands || []).filter(b => brandIdsUsed.has(b.id));

    statusEl.style.display = 'none';
    document.getElementById('pbContent').style.display = 'block';

    renderChips();
    applyBrandParam();
    renderTopPurchase();
    renderFeatured();
    renderGrid();
    handleHashOpen();
  } catch (err) {
    statusEl.textContent = '繪本資料載入失敗，請稍後再試 🙏';
    statusEl.classList.add('error');
    console.error('繪本載入失敗', err);
  }
}

// ===== 免登入寫入：fire-and-forget（教材下載計數用）=====
// 跟頁首瀏覽量統計同一套手法：sendBeacon 優先，Blob 用 text/plain 避開跨網域 preflight
// （後端照樣把 body 當 JSON 解析），沒有 sendBeacon 才退回 fetch keepalive；失敗一律安靜吞掉。
function sendBooksBeacon(type, extra) {
  try {
    const payload = JSON.stringify(Object.assign({ type }, extra || {}));
    if (navigator.sendBeacon) {
      navigator.sendBeacon(BOOKS_API_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    } else {
      fetch(BOOKS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }
  } catch (e) { /* 統計失敗不影響使用者操作，安靜忽略 */ }
}

// ===== 愛心（喜歡這本繪本）=====
// 「按過」狀態存 localStorage，跨重整記住；無痕模式等寫入失敗時 try/catch 吞掉，
// 按讚本身仍可送出，只是重整後會忘記已經按過（不影響當次操作）。
const PB_LIKED_KEY = 'pbLikedBooks';
function loadLikedBookIds() {
  try {
    const arr = JSON.parse(localStorage.getItem(PB_LIKED_KEY) || '[]');
    return new Set(Array.isArray(arr) ? arr : []);
  } catch (e) { return new Set(); }
}
function saveLikedBookIds(set) {
  try { localStorage.setItem(PB_LIKED_KEY, JSON.stringify([...set])); } catch (e) { /* 無痕模式等寫入失敗，忽略 */ }
}
let LIKED_BOOK_IDS = loadLikedBookIds();
let LIKE_REQ_SEQ = {}; // bookId -> 最新一次送出的序號，用來忽略連點時過期的回應，避免舊回應覆蓋新狀態

function isBookLiked(bookId) { return LIKED_BOOK_IDS.has(bookId); }

// 樂觀更新：先切本地「按過」狀態＋畫面上的數字，再送 API；API 回真正的 likeCount 才校正一次。
// 方向永遠以本地已按過/沒按過的狀態為準，所以連點會正確地一次+1、一次-1交替，不會同方向送兩次。
function toggleBookLike(book) {
  const liked = isBookLiked(book.id);
  const delta = liked ? -1 : 1;
  if (liked) LIKED_BOOK_IDS.delete(book.id); else LIKED_BOOK_IDS.add(book.id);
  saveLikedBookIds(LIKED_BOOK_IDS);

  book.likeCount = Math.max(0, (Number(book.likeCount) || 0) + delta);
  renderModalLike(book);
  renderGrid();

  const seq = (LIKE_REQ_SEQ[book.id] || 0) + 1;
  LIKE_REQ_SEQ[book.id] = seq;

  fetch(BOOKS_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'book-like', bookId: book.id, delta })
  }).then(res => res.json()).then(data => {
    if (LIKE_REQ_SEQ[book.id] !== seq) return; // 這期間又點過，回應已過期，不要覆蓋更新的狀態
    if (data && data.success && typeof data.likeCount === 'number') {
      book.likeCount = data.likeCount;
      renderModalLike(book);
      renderGrid();
    }
  }).catch(() => { /* 功能未上線／請求失敗都安靜忽略，畫面維持樂觀更新的結果 */ });
}

function renderModalLike(book) {
  const btn = document.getElementById('pbModalLikeBtn');
  const countEl = document.getElementById('pbModalLikeCount');
  if (!btn || !countEl) return;
  btn.classList.toggle('liked', isBookLiked(book.id));
  countEl.textContent = String(Number(book.likeCount) || 0);
  btn.onclick = () => toggleBookLike(book);
}

// ===== 篩選 chips =====
function buildChipGroup(containerId, options, selectedSet, onToggle) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.type = 'button';
  allChip.className = 'chip' + (selectedSet === null ? ' active' : '');
  allChip.textContent = '全部';
  allChip.addEventListener('click', () => onToggle(null));
  el.appendChild(allChip);

  options.forEach(opt => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (selectedSet && selectedSet.has(opt) ? ' active' : '');
    chip.textContent = opt;
    chip.addEventListener('click', () => onToggle(opt));
    el.appendChild(chip);
  });
}

// 組內單選互斥：點某顆＝只選它（自動取消同組其他）；再點同一顆已選中的，或點「全部」＝回到「全部」
function toggleSelection(current, value, setter) {
  // value === null -> 點「全部」，清空選擇
  if (value === null) { setter(null); renderChips(); renderGrid(); return; }
  if (current && current.has(value) && current.size === 1) {
    setter(null);
  } else {
    setter(new Set([value]));
  }
  renderChips();
  renderGrid();
}

// 套組分類判定：分類名稱含「套組」或「雪莉精選」都算，另外用頂端套組專區呈現，
// 不重複出現在年齡與主題 chips 裡（renderChips／renderFeatured 共用同一判定）
function isSetCategory(name) {
  return typeof name === 'string' && (name.includes('套組') || name.includes('雪莉精選'));
}

function renderChips() {
  buildChipGroup('pbCatChips', ALL_CATEGORIES.filter(c => !isSetCategory(c.name)).map(c => c.name), selCats,
    v => toggleSelection(selCats, v, s => { selCats = s; }));
  document.getElementById('pbBrandSection').style.display = USED_BRANDS.length > 1 ? '' : 'none';
  buildChipGroup('pbBrandChips', USED_BRANDS.map(b => b.name), selBrands,
    v => toggleSelection(selBrands, v, s => { selBrands = s; }));
  buildChipGroup('pbTypeChips', ALL_TYPES.slice(), selTypes,
    v => toggleSelection(selTypes, v, s => { selTypes = s; }));
}

// ===== 品牌專屬連結 ?brand=品牌名稱 =====
// 載入完成、chips 建好後套用；找不到同名品牌（打錯字、品牌後來下架等）就忽略，不報錯。
// 效果等同使用者自己點了那顆品牌 chip；後面緊接的 renderGrid() 會套用篩選，這裡只負責
// 設定選取狀態＋重繪 chips 讓選中的品牌 chip 亮起來。
function applyBrandParam() {
  const raw = new URLSearchParams(location.search).get('brand');
  if (!raw) return;
  let name = raw;
  try { name = decodeURIComponent(raw); } catch (e) { /* 已經是解碼過的字串，忽略 */ }
  const match = USED_BRANDS.find(b => b.name === name);
  if (!match) return;
  selBrands = new Set([match.name]);
  renderChips();
}

// ===== 篩選邏輯 =====
function matchesFilters(book) {
  if (searchTerm) {
    const hay = `${book.title || ''} ${book.author || ''}`.toLowerCase();
    if (!hay.includes(searchTerm)) return false;
  }
  if (selCats) {
    const cats = book.categories || [];
    if (!cats.some(c => selCats.has(c))) return false;
  }
  if (selBrands) {
    if (!book.brand_name || !selBrands.has(book.brand_name)) return false;
  }
  if (selTypes) {
    const types = book.types || [];
    if (!types.some(t => selTypes.has(t))) return false;
  }
  return true;
}

// ===== 套組專區（頂端橫向滑動小圖區，可能多排）=====
// 資料來源改為後端公開包的 sets（2026-08-24）：只回傳「目前可見」的套組（開團前 showNow 開才顯示、
// 結團含延長就自動消失，可見性判斷全在後端），前端不再自己用分類名稱／開團狀態判斷要不要顯示。
// 每排照 set.bookIds 順序取書，找不到（下架/刪除）的 id 跳過；整排一本都對不到就不渲染該排。
// sets 為空/undefined（表還沒建、或都不可見）→ 整區隱藏，不留空框。點小圖走跟書卡完全同一顆 openBookModal。
function renderFeatured() {
  const wrap = document.getElementById('pbFeatured');
  if (!wrap) return;
  wrap.innerHTML = '';

  let anyShown = false;

  (ALL_SETS || []).forEach(set => {
    const bookIds = set.bookIds || [];
    const list = bookIds.map(id => ALL_BOOKS.find(b => b.id === id)).filter(Boolean);
    if (!list.length) return;
    anyShown = true;

    const setEl = document.createElement('div');
    setEl.className = 'pb-featured-set';

    const title = document.createElement('div');
    title.className = 'pb-featured-title';
    title.textContent = `⭐ ${set.title || ''}`;
    setEl.appendChild(title);

    if (set.intro) {
      const intro = document.createElement('div');
      intro.className = 'pb-featured-intro';
      intro.textContent = set.intro;
      setEl.appendChild(intro);
    }

    const row = document.createElement('div');
    row.className = 'pb-featured-row';
    list.forEach(book => {
      const item = document.createElement('div');
      item.className = 'pb-featured-item';
      item.addEventListener('click', () => openBookModal(book));

      const coverWrap = document.createElement('div');
      coverWrap.className = 'pb-featured-cover-wrap';
      if (book.cover_url) {
        const img = document.createElement('img');
        img.src = book.cover_url;
        img.alt = book.title;
        img.loading = 'lazy';
        coverWrap.appendChild(img);
      } else {
        coverWrap.classList.add('placeholder');
        const span = document.createElement('span');
        span.textContent = book.title || '';
        coverWrap.appendChild(span);
      }
      item.appendChild(coverWrap);

      const name = document.createElement('div');
      name.className = 'pb-featured-name';
      name.textContent = book.title || '';
      item.appendChild(name);

      row.appendChild(item);
    });
    setEl.appendChild(row);
    wrap.appendChild(setEl);
  });

  wrap.style.display = anyShown ? 'block' : 'none';
}

function renderGrid() {

// ===== YouTube 網址解析 =====
function parseYoutubeId(url) {
  return parseYoutube(url).id;
}
// 回 { id, vertical }：vertical＝網址是 /shorts/ → 前台用直式 9:16 框
function parseYoutube(url) {
  const none = { id: '', vertical: false };
  if (!url) return none;
  try {
    const u = new URL(String(url).trim());
    const host = u.hostname.replace(/^www\./, '');
    if (host === 'youtu.be') return { id: u.pathname.slice(1).split('/')[0] || '', vertical: false };
    if (host.indexOf('youtube.com') !== -1) {
      if (u.pathname === '/watch') return { id: u.searchParams.get('v') || '', vertical: false };
      const m = u.pathname.match(/^\/(shorts|embed)\/([^/?]+)/);
      if (m) return { id: m[2], vertical: m[1] === 'shorts' };
    }
  } catch (e) { /* 網址格式不對，當作沒有影片 */ }
  return none;
}

// ===== 頂端團購入口 =====
// 彙總所有書的 purchase 狀態（後端依品牌對照行事曆算好的）：
// 有品牌開團中 → 「前往團購下單」按鈕直接連到團購頁；
// 沒開團但有排程 → 按鈕顯示下一團日期（7 天內顯示「即將開團」），點開浮動視窗看日期＋優惠活動；
// 沒排程但後台有填優惠活動 → 「團購優惠」按鈕開同一個視窗；什麼都沒有 → 隱藏
let TOP_PURCHASE_INFO = null;
// 倒數計時器（7 天內即將開團時才會啟動）：每次重繪先清掉舊的，避免疊加；
// 倒數歸零時只 reload 一次，靠這個旗標防連續觸發
let topCountdownInterval = null;
let topCountdownReloadTriggered = false;
function renderTopPurchase() {
  const wrap = document.getElementById('pbTopPurchase');
  if (!wrap) return;
  if (topCountdownInterval) { clearInterval(topCountdownInterval); topCountdownInterval = null; }
  wrap.innerHTML = '';
  const openByUrl = new Map();   // url → 品牌名稱
  const upcoming = new Map();    // 品牌名稱 → 最近的 nextDate
  ALL_BOOKS.forEach(b => {
    const p = b.purchase || {};
    const brand = b.brand_name || '';
    if (p.status === 'open' && p.url) {
      if (!openByUrl.has(p.url)) openByUrl.set(p.url, { brand, startDate: p.startDate || '', endDate: p.endDate || '' });
    } else if (p.status === 'upcoming' && p.nextDate) {
      const prev = upcoming.get(brand);
      if (!prev || p.nextDate < prev) upcoming.set(brand, p.nextDate);
    }
  });

  if (openByUrl.size) {
    // 開團中：不再只放單顆按鈕，改成攤開的活動區塊（標題＋團購時間＋優惠條列＋下單按鈕）。
    const multi = openByUrl.size > 1;
    const brandNames = [...openByUrl.values()].map(v => v.brand).filter(Boolean);

    const box = document.createElement('div');
    box.className = 'pb-top-active';

    const header = document.createElement('div');
    header.className = 'pb-top-active-header';
    const headline = brandNames.length ? `${brandNames.join('・')} 團購開跑中` : '團購開跑中';
    header.textContent = `🛒 ${headline}`;
    box.appendChild(header);

    // 團購時間：單一團才顯示（多團日期各異，掛在各自按鈕上反而亂，省略）
    if (!multi) {
      const only = [...openByUrl.values()][0];
      if (only.startDate && only.endDate) {
        const dateLine = document.createElement('div');
        dateLine.className = 'pb-top-active-dates';
        dateLine.textContent = `⏰ 團購時間：${fmtMD(only.startDate)} – ${fmtMD(only.endDate)}`;
        box.appendChild(dateLine);
      }
    }

    const giftSection = buildGiftSection();
    if (giftSection) box.appendChild(giftSection);

    if (ALL_PROMOTIONS.length) {
      const promoWrap = document.createElement('div');
      promoWrap.className = 'pb-top-active-promos';
      ALL_PROMOTIONS.forEach(p => {
        const line = document.createElement('div');
        line.className = 'pb-top-active-promo-line';
        line.textContent = `🎁 ${p.text}`;
        promoWrap.appendChild(line);
      });
      box.appendChild(promoWrap);
    }

    const ctaWrap = document.createElement('div');
    ctaWrap.className = 'pb-top-active-ctas';
    openByUrl.forEach((info, url) => {
      const a = document.createElement('a');
      a.className = 'pb-top-btn';
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = multi && info.brand ? `🛒 ${info.brand} 前往下單` : '🛒 前往團購下單';
      ctaWrap.appendChild(a);
    });
    box.appendChild(ctaWrap);

    wrap.appendChild(box);
    wrap.style.display = 'flex';
    return;
  }

  const entries = [...upcoming.entries()].sort((a, b) => a[1].localeCompare(b[1]));
  if (!entries.length && !ALL_PROMOTIONS.length && !ALL_GIFTS.length) { wrap.style.display = 'none'; return; }

  const next = entries[0] || null;
  const soon = next ? daysUntil(next[1]) <= 7 : false;
  TOP_PURCHASE_INFO = { entries, soon };

  if (next && soon) {
    renderTopCountdownButton(wrap, entries, next[1]);
    return;
  }

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pb-top-btn' + (next ? '' : ' pb-top-btn-soft');
  if (next) btn.textContent = `📅 下一團 ${fmtMD(next[1])} 開團`;
  else btn.textContent = '🎁 團購優惠';
  btn.addEventListener('click', openPromoModal);
  wrap.appendChild(btn);
  wrap.style.display = 'flex';
}

// 倒數按鈕：品牌名取最早那團（多品牌同日用「・」串接），標題行＋倒數行分兩行顯示，
// 每秒更新；倒數歸零 clearInterval 並整頁 reload 一次，讓開團中活動區接手渲染
function renderTopCountdownButton(wrap, entries, earliestDate) {
  const brandNames = entries.filter(e => e[1] === earliestDate).map(e => e[0]).filter(Boolean);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pb-top-btn pb-top-btn-countdown';

  const line1 = document.createElement('div');
  line1.className = 'pb-top-btn-line1';
  line1.textContent = `🔥 ${brandNames.join('・')} ${fmtMD(earliestDate)} 開團`;
  btn.appendChild(line1);

  const line2 = document.createElement('div');
  line2.className = 'pb-top-btn-line2';
  line2.id = 'pbTopCountdownLine';
  btn.appendChild(line2);

  // 用 onclick（不用 addEventListener）：倒數歸零冷卻期要整顆改成「點擊更新頁面」，直接覆蓋才不會兩個行為同時觸發
  btn.onclick = openPromoModal;
  wrap.appendChild(btn);
  wrap.style.display = 'flex';

  const targetMs = countdownTargetMs(earliestDate);
  topCountdownReloadTriggered = false;
  const tick = () => {
    const lineEl = document.getElementById('pbTopCountdownLine');
    const diff = targetMs === null ? 0 : targetMs - Date.now();
    if (diff <= 0) {
      if (topCountdownInterval) { clearInterval(topCountdownInterval); topCountdownInterval = null; }
      // API 快取鍵每 20 秒換一次：歸零 reload 後可能還拿到「未開團」舊快取又進到這裡。
      // 25 秒內不重複自動 reload；sessionStorage 不可用（無痕模式等）時完全不自動 reload——
      // 冷卻依據只有 sessionStorage，沒有它就無法防連環刷新，一律走手動更新按鈕
      let canAutoReload = false;
      if (!topCountdownReloadTriggered) {
        try {
          const lastReload = Number(sessionStorage.getItem('pbCdReloadAt')) || 0;
          if (Date.now() - lastReload > 25000) {
            sessionStorage.setItem('pbCdReloadAt', String(Date.now()));
            canAutoReload = true;
          }
        } catch (e) { /* storage 被擋：canAutoReload 維持 false */ }
      }
      if (canAutoReload) {
        topCountdownReloadTriggered = true;
        location.reload();
      } else {
        if (lineEl) lineEl.textContent = '🎉 開團囉！點我更新頁面';
        btn.onclick = () => location.reload();
      }
      return;
    }
    if (lineEl) lineEl.textContent = formatCountdown(diff);
  };
  tick();
  topCountdownInterval = setInterval(tick, 1000);
}

// 倒數目標時間（毫秒）：nextDate（YYYY-MM-DD）當天 00:00:00，本機時間（同 daysUntil 慣例，不用時區庫）
function countdownTargetMs(dateStr) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr || '');
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime();
}

// 毫秒差轉「⏳ 倒數 D 天 HH:MM:SS」；抽成獨立函式方便單測
function formatCountdown(diffMs) {
  const totalSec = Math.max(0, Math.floor(diffMs / 1000));
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return `⏳ 倒數 ${days} 天 ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
}

// 千分位金額顯示（1999 → "1,999"）
function pbFormatMoney(n) {
  return (Number(n) || 0).toLocaleString('en-US');
}

function fmtMD(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  return m ? `${Number(m[2])}/${Number(m[3])}` : String(s || '');
}
// 距離某天（YYYY-MM-DD）還有幾天（以本機日期算；今天＝0）
function daysUntil(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  if (!m) return Infinity;
  const target = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}

function openPromoModal() {
  const info = TOP_PURCHASE_INFO || { entries: [], soon: false };
  const titleEl = document.getElementById('pbPromoTitle');
  const subEl = document.getElementById('pbPromoSub');
  const listEl = document.getElementById('pbPromoList');
  const emptyEl = document.getElementById('pbPromoEmpty');

  if (info.entries.length) {
    const [brand, d] = info.entries[0];
    const days = daysUntil(d);
    titleEl.textContent = info.soon ? '🔥 即將開團！' : '📅 下一團開團時間';
    let sub = `${fmtMD(d)} 開團`;
    if (days === 0) sub = '今天開團！';
    else if (days > 0 && days <= 7) sub += `（還有 ${days} 天）`;
    if (info.entries.length > 1) sub += '｜' + info.entries.slice(1).map(([b2, d2]) => `${b2} ${fmtMD(d2)}`).join('・');
    else if (brand) sub = `${brand}：${sub}`;
    subEl.textContent = sub;
  } else {
    titleEl.textContent = '📅 下一團開團時間';
    subEl.textContent = '開團時間待公布，敬請期待';
  }

  const giftWrapEl = document.getElementById('pbPromoGiftWrap');
  giftWrapEl.innerHTML = '';
  const giftSection = buildGiftSection();
  if (giftSection) {
    giftWrapEl.appendChild(giftSection);
    giftWrapEl.style.display = '';
  } else {
    giftWrapEl.style.display = 'none';
  }

  listEl.innerHTML = '';
  if (ALL_PROMOTIONS.length) {
    ALL_PROMOTIONS.forEach(p => {
      const li = document.createElement('li');
      li.textContent = p.text;
      listEl.appendChild(li);
    });
    listEl.style.display = '';
    emptyEl.style.display = 'none';
  } else {
    listEl.style.display = 'none';
    emptyEl.style.display = '';
  }
  document.getElementById('pbPromoModal').classList.add('show');
}
function closePromoModal() {
  document.getElementById('pbPromoModal').classList.remove('show');
}

      moreBtn.type = 'button';
      moreBtn.className = 'pb-mat-more';
      moreBtn.textContent = '更多';
      titleRow.appendChild(moreBtn);

      const desc = document.createElement('div');
      desc.className = 'pb-mat-desc';
      if (m.print_size) {
        const sizeLine = document.createElement('div');
        sizeLine.className = 'pb-mat-size';
        sizeLine.textContent = `🖨️ 列印建議尺寸：${m.print_size}`;
        desc.appendChild(sizeLine);
      }
      if (m.description) {
        const descText = document.createElement('div');
        descText.textContent = m.description;
        desc.appendChild(descText);
      }

      moreBtn.addEventListener('click', () => {
        const show = desc.classList.toggle('show');
        moreBtn.textContent = show ? '收起' : '更多';
      });

      body.appendChild(titleRow);
      body.appendChild(desc);
    } else {
      body.appendChild(titleRow);
    }

    card.appendChild(body);
    panel.appendChild(card);
  });

  toggle.onclick = () => panel.classList.toggle('show');
}

// YYYY-MM-DD → M/D（不同年則顯示 YYYY/M/D）
function formatPbAvailableFrom(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  if (!m) return String(s || '');
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  return y === new Date().getFullYear() ? `${mo}/${d}` : `${y}/${mo}/${d}`;
}

// ===== Modal 開關 =====
function openBookModal(book) {
  CURRENT_BOOK = book;
  document.getElementById('pbModalTitle').innerHTML = smartTitleHtml(book.title);

  const subParts = [];
  if (book.author) subParts.push(book.author);
  if (book.publisher) subParts.push(book.publisher);
  document.getElementById('pbModalSubline').textContent = subParts.join(' ・ ');

  const coverWrap = document.getElementById('pbModalCoverWrap');
  const coverImg = document.getElementById('pbModalCover');
  // 占位 emoji 用獨立節點，不能用 textContent 覆寫（會把 <img> 從 DOM 移除，之後每本書的 modal 都會壞）
  let coverPh = document.getElementById('pbModalCoverPh');
  if (!coverPh) {
    coverPh = document.createElement('span');
    coverPh.id = 'pbModalCoverPh';
    coverPh.textContent = '📖';
    coverPh.style.display = 'none';
    coverWrap.appendChild(coverPh);
  }
  if (book.cover_url) {
    coverWrap.classList.remove('placeholder');
    coverPh.style.display = 'none';
    coverImg.style.display = 'block';
    coverImg.src = book.cover_url;
    coverImg.alt = book.title;
  } else {
    coverWrap.classList.add('placeholder');
    coverImg.style.display = 'none';
    coverImg.removeAttribute('src');
    coverPh.style.display = 'block';
  }

  const tagsEl = document.getElementById('pbModalTags');
  tagsEl.innerHTML = '';
  (book.categories || []).forEach(c => {
    const t = document.createElement('span');
    t.className = 'pb-tag pb-tag-cat';
    t.textContent = c;
    tagsEl.appendChild(t);
  });
  (book.types || []).forEach(t => {
    const el = document.createElement('span');
    el.className = 'pb-tag pb-tag-type';
    el.textContent = t;
    tagsEl.appendChild(el);
  });

  const descBox = document.getElementById('pbModalDescBox');
  if (book.description) {
    descBox.style.display = 'block';
    document.getElementById('pbModalDesc').textContent = book.description;
  } else {
    descBox.style.display = 'none';
  }

  const ytWrap = document.getElementById('pbYtWrap');
  const yt = parseYoutube(book.youtube_url);
  const ytId = yt.id;
  ytWrap.classList.toggle('vertical', Boolean(ytId) && yt.vertical);
  // 有影片介紹 → 影片當首圖，封面隱藏（封面在書卡上仍看得到）；沒影片 → 封面照常
  coverWrap.style.display = ytId ? 'none' : '';
  if (ytId) {
    ytWrap.style.display = 'block';
    // 預覽圖依序嘗試高畫質版本：Shorts 先用直式 oardefault（1080×1920）→ maxresdefault（1280×720）→ hqdefault（480×360）。
    // 不是每支都有高畫質版，沒有時 YouTube 回 120×90 的灰色佔位圖，用 naturalWidth 判斷後換下一個。
    const thumbNames = (yt.vertical ? ['oardefault'] : []).concat(['maxresdefault', 'hqdefault']);
    ytWrap.innerHTML = `<img id="pbYtThumb" alt="YouTube 影片"><div class="pb-yt-play" id="pbYtPlayBtn"><span>▶</span></div>`;
    const thumb = document.getElementById('pbYtThumb');
    let thumbIdx = 0;
    const tryNextThumb = () => {
      if (thumbIdx >= thumbNames.length) { thumb.onload = null; thumb.onerror = null; return; }
      thumb.src = `https://i.ytimg.com/vi/${ytId}/${thumbNames[thumbIdx++]}.jpg`;
    };
    thumb.onload = () => { if (thumb.naturalWidth <= 120 && thumbIdx < thumbNames.length) tryNextThumb(); };
    thumb.onerror = tryNextThumb;
    tryNextThumb();
    ytWrap.onclick = function () {
      ytWrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" title="YouTube 影片" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      ytWrap.onclick = null;
    };
  } else {
    ytWrap.style.display = 'none';
    ytWrap.onclick = null;
  }

  renderModalLike(book);
  renderPurchaseSection(book);
  renderSeriesBlock(book);
  renderOrderCta(book);
  renderMaterials(book);

  document.getElementById('bookModal').classList.add('show');
  const modalBox = document.querySelector('.pb-modal-box');
  if (modalBox) modalBox.scrollTop = 0;
  history.replaceState(null, '', '#book=' + encodeURIComponent(book.id));
}

// ===== 延伸教材前的「前往下單」提醒（跟頂部購買按鈕分開放，讓要下載教材的人也順手看到下單連結）=====
function renderOrderCta(book) {
  const wrap = document.getElementById('pbOrderCta');
  wrap.innerHTML = '';
  if (!book.shopee_url) return;
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const btn = document.createElement('a');
  btn.className = 'action-btn';
  btn.href = book.shopee_url;
  btn.target = '_blank';
  btn.rel = 'noopener noreferrer';
  btn.textContent = '🛒 前往下單';
  actions.appendChild(btn);
  wrap.appendChild(actions);
}

// ===== 同系列作品 =====
function renderSeriesBlock(book) {
  const blockEl = document.getElementById('pbSeriesBlock');
  const rowEl = document.getElementById('pbSeriesRow');
  rowEl.innerHTML = '';

  if (!book.series_name) { blockEl.style.display = 'none'; return; }
  const siblings = ALL_BOOKS.filter(b => b.series_name === book.series_name && b.id !== book.id);
  if (!siblings.length) { blockEl.style.display = 'none'; return; }

  document.getElementById('pbSeriesLabel').textContent = `🔗 同系列作品：${book.series_name}`;
  siblings.forEach(sib => {
    const item = document.createElement('div');
    item.className = 'pb-series-item';
    item.addEventListener('click', () => openBookModal(sib));

    const coverWrap = document.createElement('div');
    coverWrap.className = 'pb-series-item-cover-wrap';
    if (sib.cover_url) {
      const img = document.createElement('img');
      img.src = sib.cover_url;
      img.alt = sib.title;
      img.loading = 'lazy';
      coverWrap.appendChild(img);
    } else {
      coverWrap.classList.add('placeholder');
      coverWrap.textContent = '📖';
    }
    item.appendChild(coverWrap);

    const title = document.createElement('div');
    title.className = 'pb-series-item-title';
    title.innerHTML = smartTitleHtml(sib.title);
    item.appendChild(title);

    rowEl.appendChild(item);
  });
  blockEl.style.display = 'block';
}

function closeBookModal() {
  document.getElementById('bookModal').classList.remove('show');
  const url = location.pathname + location.search;
  history.replaceState(null, '', url);
}

// 分享＝分享這本繪本的介紹網址（帶 #book= 深連結，開啟時會自動跳出這本書的浮動視窗）。
function sharePbBook() {
  if (!CURRENT_BOOK) return;
  const url = location.origin + location.pathname + '#book=' + encodeURIComponent(CURRENT_BOOK.id);
  if (navigator.share) {
    navigator.share({ title: CURRENT_BOOK.title, url }).catch(() => {});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => showPbToast('已複製繪本連結')).catch(() => promptShareUrl(url));
  } else {
    promptShareUrl(url);
  }
}

function promptShareUrl(url) {
  window.prompt('複製這個連結：', url);
}

let pbToastTimer = null;
function showPbToast(msg) {
  const el = document.getElementById('pbToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(pbToastTimer);
  pbToastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}


function handleHashOpen() {
  const m = /^#book=(.+)$/.exec(location.hash);
  if (!m) return;
  const id = decodeURIComponent(m[1]);
  const book = ALL_BOOKS.find(b => b.id === id);
  if (book) openBookModal(book);
}

document.getElementById('pbSearchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderGrid();
});

window.addEventListener('hashchange', handleHashOpen);

loadBooks();
