  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pb-top-btn' + (next ? '' : ' pb-top-btn-soft');
  if (next) btn.textContent = `📅 下一團 ${fmtMD(next[1])} 開團`;
  else btn.textContent = '🎁 團購優惠';
  btn.addEventListener('click', openPromoModal);
  wrap.appendChild(btn);
  wrap.style.display = 'flex';
}

// 倒數按鈕：品牌名取最早那團（多品牌同日用「・」串接），標題行＋倒數行分兩行顯示，
// 每秒更新；倒數歸零 clearInterval 並整頁 reload 一次，讓開團中活動區接手渲染
function renderTopCountdownButton(wrap, entries, earliestDate) {
  const brandNames = entries.filter(e => e[1] === earliestDate).map(e => e[0]).filter(Boolean);

  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pb-top-btn pb-top-btn-countdown';

  const line1 = document.createElement('div');
  line1.className = 'pb-top-btn-line1';
  line1.textContent = `🔥 ${brandNames.join('・')} ${fmtMD(earliestDate)} 開團`;
  btn.appendChild(line1);

  const line2 = document.createElement('div');
  line2.className = 'pb-top-btn-line2';
  line2.id = 'pbTopCountdownLine';
  btn.appendChild(line2);

  // 用 onclick（不用 addEventListener）：倒數歸零冷卻期要整顆改成「點擊更新頁面」，直接覆蓋才不會兩個行為同時觸發
  btn.onclick = openPromoModal;
  wrap.appendChild(btn);
  wrap.style.display = 'flex';

  const targetMs = countdownTargetMs(earliestDate);
  topCountdownReloadTriggered = false;
  const tick = () => {
    const lineEl = document.getElementById('pbTopCountdownLine');
    const diff = targetMs === null ? 0 : targetMs - Date.now();
    if (diff <= 0) {
      if (topCountdownInterval) { clearInterval(topCountdownInterval); topCountdownInterval = null; }
      // API 快取鍵每 20 秒換一次：歸零 reload 後可能還拿到「未開團」舊快取又進到這裡。
      // 25 秒內不重複自動 reload；sessionStorage 不可用（無痕模式等）時完全不自動 reload——
      // 冷卻依據只有 sessionStorage，沒有它就無法防連環刷新，一律走手動更新按鈕
      let canAutoReload = false;
      if (!topCountdownReloadTriggered) {
        try {
          const lastReload = Number(sessionStorage.getItem('pbCdReloadAt')) || 0;
          if (Date.now() - lastReload > 25000) {
            sessionStorage.setItem('pbCdReloadAt', String(Date.now()));
            canAutoReload = true;
          }
        } catch (e) { /* storage 被擋：canAutoReload 維持 false */ }
      }
      if (canAutoReload) {
        topCountdownReloadTriggered = true;
        location.reload();
      } else {
        if (lineEl) lineEl.textContent = '🎉 開團囉！點我更新頁面';
        btn.onclick = () => location.reload();
      }
      return;
    }
    if (lineEl) lineEl.textContent = formatCountdown(diff);
  };
  tick();
  topCountdownInterval = setInterval(tick, 1000);
}

// 倒數目標時間（毫秒）：nextDate（YYYY-MM-DD）當天 00:00:00，本機時間（同 daysUntil 慣例，不用時區庫）
function countdownTargetMs(dateStr) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(dateStr || '');
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime();
}

// 毫秒差轉「⏳ 倒數 D 天 HH:MM:SS」；抽成獨立函式方便單測
function formatCountdown(diffMs) {
  const totalSec = Math.max(0, Math.floor(diffMs / 1000));
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return `⏳ 倒數 ${days} 天 ${pad(hours)}:${pad(mins)}:${pad(secs)}`;
}

// 千分位金額顯示（1999 → "1,999"）
function pbFormatMoney(n) {
  return (Number(n) || 0).toLocaleString('en-US');
}

// 綁團過濾（2026-09-07）：後端只回「可見」的優惠/滿額贈，綁團的多帶 eventStatus（'open'＝當團、'upcoming'＝下一團）。
// 沒有 eventStatus＝長期活動兩邊都列；開團活動區只列「長期＋當團」、「下一團」浮動視窗只列「長期＋下一團」，
// 結團的後端就不會回來（自動下架）。
// 品牌館模式（2026-09-23）：綁了團的優惠／滿額贈只留「團名對得到這個品牌」的（比對同後端 purchase：
// 去掉空白與｜/|・後包含品牌名、保留大小寫）；沒綁團（無 eventStatus／無 eventTitle）的長期活動照舊顯示。
function pbNormTitle(s) { return String(s || '').replace(/[\s｜|・]/g, ''); }
function promoBelongsToHall(it) {
  if (!BRAND_HALL || !it.eventStatus || !it.eventTitle) return true;
  return pbNormTitle(it.eventTitle).includes(pbNormTitle(BRAND_HALL.name));
}
function promoItemsFor(ctx, list) {
  return (list || []).filter(it => it && (!it.eventStatus || it.eventStatus === ctx) && promoBelongsToHall(it));
}

// 滿額贈橫滑卡片列（純展示，不可點擊）。gifts 空陣列時回傳 null，呼叫方自行決定不插入。
function buildGiftSection(gifts) {
  if (!gifts || !gifts.length) return null;
  const wrap = document.createElement('div');
  wrap.className = 'pb-gift-wrap';

  const note = document.createElement('div');
  note.className = 'pb-gift-note';
  note.textContent = '💝 滿額禮可累積，全部達標一次帶走！';

  pbWrapScrollArrow(row, '36px'); // 滿額贈小圖 72px 高 → 箭頭中心 36px（同開團小圖列）
  return wrap;
}

// 單張滿額贈卡片：浮動視窗的橫滑列與頂端開團卡片列共用
function buildGiftItem(g) {
  const item = document.createElement('div');
  item.className = 'pb-gift-item';

  const thumbWrap = document.createElement('div');
  thumbWrap.className = 'pb-gift-thumb-wrap';
  if (g.imageUrl) {
    const img = document.createElement('img');
    img.src = g.imageUrl;
    img.alt = g.title || '';
    img.loading = 'lazy';
    thumbWrap.appendChild(img);
  } else {
    thumbWrap.classList.add('placeholder');
    thumbWrap.textContent = '🎁';
  }
  item.appendChild(thumbWrap);

  const name = document.createElement('div');
  name.className = 'pb-gift-name';
  name.textContent = g.title || '';
  item.appendChild(name);

  const badge = document.createElement('div');
  badge.className = 'pb-gift-badge';
  badge.textContent = `滿 $${pbFormatMoney(g.amount)}`;
  item.appendChild(badge);

  if (g.note) {
    const noteText = document.createElement('div');
    noteText.className = 'pb-gift-note-text';
    noteText.textContent = g.note;
    item.appendChild(noteText);
  }

  return item;
}

function fmtMD(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  return m ? `${Number(m[2])}/${Number(m[3])}` : String(s || '');
}
// 距離某天（YYYY-MM-DD）還有幾天（以本機日期算；今天＝0）
function daysUntil(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
  if (!m) return Infinity;
  const target = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}

function openPromoModal() {
  const info = TOP_PURCHASE_INFO || { entries: [], soon: false };
  const titleEl = document.getElementById('pbPromoTitle');
  const subEl = document.getElementById('pbPromoSub');
  const listEl = document.getElementById('pbPromoList');
  const emptyEl = document.getElementById('pbPromoEmpty');

  if (info.entries.length) {
    const [brand, d] = info.entries[0];
    const days = daysUntil(d);
    titleEl.textContent = info.soon ? '🔥 即將開團！' : '📅 下一團開團時間';
    let sub = `${fmtMD(d)} 開團`;
    if (days === 0) sub = '今天開團！';
    else if (days > 0 && days <= 7) sub += `（還有 ${days} 天）`;
    if (info.entries.length > 1) sub += '｜' + info.entries.slice(1).map(([b2, d2]) => `${b2} ${fmtMD(d2)}`).join('・');
    else if (brand) sub = `${brand}：${sub}`;
    subEl.textContent = sub;
  } else {
    titleEl.textContent = '📅 下一團開團時間';
    subEl.textContent = '開團時間待公布，敬請期待';
  }

  const giftWrapEl = document.getElementById('pbPromoGiftWrap');
  giftWrapEl.innerHTML = '';
  const giftSection = buildGiftSection(promoItemsFor('upcoming', ALL_GIFTS));
  if (giftSection) {
    giftWrapEl.appendChild(giftSection);
    giftWrapEl.style.display = '';
  } else {
    giftWrapEl.style.display = 'none';
  }

  listEl.innerHTML = '';
  const modalPromos = promoItemsFor('upcoming', ALL_PROMOTIONS);
  if (modalPromos.length) {
    modalPromos.forEach(p => {
      const li = document.createElement('li');
      li.textContent = p.text;
      listEl.appendChild(li);
    });
    listEl.style.display = '';
    emptyEl.style.display = 'none';
  } else {
    listEl.style.display = 'none';
    emptyEl.style.display = '';
  }
  document.getElementById('pbPromoModal').classList.add('show');
}
function closePromoModal() {
  document.getElementById('pbPromoModal').classList.remove('show');
}

// ===== 購買區塊 =====
function renderPurchaseSection(book) {
  const wrap = document.getElementById('pbPurchaseSection');
  wrap.innerHTML = '';
  const p = book.purchase || { status: 'none' };
  const shopeeUrl = book.shopee_url || '';

  if (p.status === 'open') {
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const btn = document.createElement('a');
    btn.className = 'action-btn';
    btn.href = p.url;
    btn.target = '_blank';
    btn.rel = 'noopener noreferrer';
    btn.textContent = '現正開團中，前往下單';
    const modalCode = (p.discountCode || '').trim();
    btn.addEventListener('click', () => {
      pbTrackClick('booksbuy');
      if (modalCode) pbCopyCode(modalCode).then(ok => { if (ok) showPbToast('折扣碼已複製 ✓'); });
    });
    actions.appendChild(btn);
    wrap.appendChild(actions);
    if (modalCode) wrap.appendChild(buildDiscountBlock(modalCode, (p.discountDesc || '').trim(), ''));
    return;
  }

  if (p.status === 'upcoming') {
    const next = document.createElement('div');
    next.className = 'pb-next-date';
    const d = new Date(p.nextDate + 'T00:00:00');
    next.textContent = isNaN(d) ? `下次開團 ${p.nextDate}` : `📅 下次開團 ${d.getMonth() + 1}/${d.getDate()}`;
    wrap.appendChild(next);
    if (shopeeUrl) {
      const actions = document.createElement('div');
      actions.className = 'modal-actions';
      const btn = document.createElement('a');
      btn.className = 'action-btn action-btn-alt';
      btn.href = shopeeUrl;
      btn.target = '_blank';
      btn.rel = 'noopener noreferrer';
      btn.textContent = '🛍 蝦皮購買';
      btn.addEventListener('click', () => pbTrackClick('booksshopee'));
      actions.appendChild(btn);
      wrap.appendChild(actions);
    }
    return;
  }

  // 'ended' / 'none'：只在有蝦皮連結時顯示
  if (shopeeUrl) {
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const btn = document.createElement('a');
    btn.className = 'action-btn action-btn-alt';
    btn.href = shopeeUrl;
    btn.target = '_blank';
    btn.rel = 'noopener noreferrer';
    btn.textContent = '🛍 蝦皮購買';
    btn.addEventListener('click', () => pbTrackClick('booksshopee'));
    actions.appendChild(btn);
    wrap.appendChild(actions);
  }
}

function renderGiftResources(book) {
  const wrap = document.getElementById('pbGiftRes');
  if (!wrap) return;
  const list = (Array.isArray(book.gift_resources) ? book.gift_resources : []).filter(r => r && r.slug);
  if (!list.length) {
    wrap.innerHTML = '';
    wrap.style.display = 'none';
    return;
  }
  const cards = list.map(r => {
    const href = 'https://member.sheridondon.com.tw/materials/' + encodeURIComponent(String(r.slug));
    const img = r.cover_url
      ? `<img class="pb-gift-res-img" src="${escapeHtml(r.cover_url)}" alt="" loading="lazy">`
      : '';
    const sub = r.is_free ? '免費下載' : '開團下單即贈';
    return `<a class="pb-gift-res-card" href="${escapeHtml(href)}" target="_blank" rel="noopener">`
      + img
      + `<div class="pb-gift-res-body"><div class="pb-gift-res-title">${escapeHtml(r.title || '教材')}</div>`
      + `<div class="pb-gift-res-sub">${sub}</div></div>`
      + `<span class="pb-gift-res-go">前往教材館 ›</span></a>`;
  }).join('');
  wrap.innerHTML = `<div class="pb-gift-res-label">🎁 跟團贈品延伸教材</div>${cards}`;
  wrap.style.display = '';
}

// YYYY-MM-DD → M/D（不同年則顯示 YYYY/M/D）
function formatPbAvailableFrom(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  if (!m) return String(s || '');
  const y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
  return y === new Date().getFullYear() ? `${mo}/${d}` : `${y}/${mo}/${d}`;
}

// ===== Modal 開關 =====
function openBookModal(book) {
  CURRENT_BOOK = book;
  // 每本書點擊計數（2026-08-25）：點開介紹視窗就 +1，fire-and-forget，數字只有後台看得到
  sendBooksBeacon('book-click-hit', { bookId: book.id });
  document.getElementById('pbModalTitle').innerHTML = smartTitleHtml(book.title);

  const subParts = [];
  if (book.author) subParts.push(book.author);
  if (book.publisher) subParts.push(book.publisher);
  const sublineEl = document.getElementById('pbModalSubline');
  sublineEl.textContent = subParts.join(' ・ ');
  sublineEl.style.display = subParts.length ? '' : 'none'; // 作者、出版社都沒填就整行不顯示（雪莉 2026-09-20）

  const coverWrap = document.getElementById('pbModalCoverWrap');
  const coverImg = document.getElementById('pbModalCover');
  // 占位 emoji 用獨立節點，不能用 textContent 覆寫（會把 <img> 從 DOM 移除，之後每本書的 modal 都會壞）
  let coverPh = document.getElementById('pbModalCoverPh');
  if (!coverPh) {
    coverPh = document.createElement('span');
    coverPh.id = 'pbModalCoverPh';
    coverPh.textContent = '📖';
    coverPh.style.display = 'none';
    coverWrap.appendChild(coverPh);
  }
  if (book.cover_url) {
    coverWrap.classList.remove('placeholder');
    coverPh.style.display = 'none';
    coverImg.style.display = 'block';
    coverImg.src = book.cover_url;
    coverImg.alt = book.title;
  } else {
    coverWrap.classList.add('placeholder');
    coverImg.style.display = 'none';
    coverImg.removeAttribute('src');
    coverPh.style.display = 'block';
  }

  const tagsEl = document.getElementById('pbModalTags');
  tagsEl.innerHTML = '';
  // 商品（非書，2026-09-23）：標題旁第一顆膠囊標示「商品」
  if (book.kind === 'product') {
    const kindTag = document.createElement('span');
    kindTag.className = 'pb-tag pb-tag-kind';
    kindTag.textContent = '商品';
    tagsEl.appendChild(kindTag);
  }
  (book.categories || []).forEach(c => {
    const t = document.createElement('span');
    t.className = 'pb-tag pb-tag-cat';
    t.textContent = c;
    tagsEl.appendChild(t);
  });
  (book.types || []).forEach(t => {
    const el = document.createElement('span');
    el.className = 'pb-tag pb-tag-type';
    el.textContent = t;
    tagsEl.appendChild(el);
  });

  const descBox = document.getElementById('pbModalDescBox');
  if (book.description) {
    descBox.style.display = 'block';
    document.getElementById('pbModalDesc').textContent = book.description;
  } else {
    descBox.style.display = 'none';
  }

  // 影片：後端每本書回 videos 陣列（book_videos 表）；舊快取/表未 push 只有 youtube_url → 合成單支。
  // 有影片介紹 → 影片當首圖，封面隱藏（封面在書卡上仍看得到）；沒影片 → 封面照常
  MODAL_VIDEOS = getBookVideos(book);
  MODAL_VIDEO_IDX = 0;
  coverWrap.style.display = MODAL_VIDEOS.length ? 'none' : '';
  document.getElementById('pbVideoArea').style.display = MODAL_VIDEOS.length ? 'block' : 'none';
  if (MODAL_VIDEOS.length) renderModalVideo();

  renderModalLike(book);
  renderPurchaseSection(book);
  renderSeriesBlock(book);
  renderOrderCta(book);
  renderMaterials(book);
  renderGiftResources(book);

  document.getElementById('bookModal').classList.add('show');
  const modalBox = document.querySelector('.pb-modal-box');
  if (modalBox) modalBox.scrollTop = 0;
  history.replaceState(null, '', '#book=' + encodeURIComponent(book.id));
}

function renderSeriesBlock(book) {

  if (!book.series_name) { blockEl.style.display = 'none'; return; }
  const siblings = ALL_BOOKS.filter(b => b.series_name === book.series_name && b.id !== book.id);

  document.getElementById('pbSeriesLabel').textContent = `🔗 同系列作品：${book.series_name}`;

// 分享＝分享這本繪本的介紹網址（帶 #book= 深連結，開啟時會自動跳出這本書的浮動視窗）。
function sharePbBook() {
  if (!CURRENT_BOOK) return;
  const url = location.origin + location.pathname + '#book=' + encodeURIComponent(CURRENT_BOOK.id);
  if (navigator.share) {
    navigator.share({ title: CURRENT_BOOK.title, url }).catch(() => {});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => showPbToast('已複製繪本連結')).catch(() => promptShareUrl(url));
  } else {
    promptShareUrl(url);
  }
}

function promptShareUrl(url) {
  window.prompt('複製這個連結：', url);
}

let pbToastTimer = null;
function showPbToast(msg) {
  const el = document.getElementById('pbToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(pbToastTimer);
  pbToastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}


function handleHashOpen() {
  const m = /^#book=(.+)$/.exec(location.hash);
  if (!m) return;
  const id = decodeURIComponent(m[1]);
  const book = ALL_BOOKS.find(b => b.id === id);
  if (book) openBookModal(book);
}

window.addEventListener('hashchange', handleHashOpen);
