<script>
(function sendBooksPageview() {
  const STATS_BACKEND_URL = 'https://dondon-platform.vercel.app/api/legacy';
  const d = new Date();
  const key = `page_books_${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const payload = JSON.stringify({ type: 'stat-view', key });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(STATS_BACKEND_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    } else {
      fetch(STATS_BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }
  } catch (e) { /* 統計失敗不影響使用者瀏覽，安靜忽略 */ }
})();
</script>

<script>
const BOOKS_API_URL = 'https://dondon-platform.vercel.app/api/books';

let ALL_BOOKS = [];
let ALL_CATEGORIES = [];
let ALL_TYPES = [];
let USED_BRANDS = [];
let CURRENT_BOOK = null; // 目前開著的繪本浮動視窗，教材大圖的分享按鈕要用

// 三組篩選狀態：null 代表選「全部」，Set 代表已選中的單一具體選項（組內單選）
let selCats = null;
let selBrands = null;
let selTypes = null;
let searchTerm = '';

// ===== 載入資料 =====
async function loadBooks() {
  const statusEl = document.getElementById('statusMsg');
  try {
    // 每 20 秒換一次快取鍵：CDN 仍能合併同一時段的請求，但後台存檔後最多 20 秒前台就看得到
    const bucket = Math.floor(Date.now() / 20000);
    const res = await fetch(`${BOOKS_API_URL}?v=${bucket}`, { cache: 'no-store' });
    const data = await res.json();
    if (!data || data.success !== true) throw new Error((data && data.error) || '載入失敗');

    ALL_BOOKS = data.books || [];
    ALL_CATEGORIES = (data.categories || []).slice().sort((a, b) => (a.sort || 0) - (b.sort || 0));
    ALL_TYPES = data.types || [];

    const brandIdsUsed = new Set(ALL_BOOKS.map(b => b.brand_id).filter(Boolean));
    USED_BRANDS = (data.brands || []).filter(b => brandIdsUsed.has(b.id));

    statusEl.style.display = 'none';
    document.getElementById('pbContent').style.display = 'block';

    renderChips();
    renderGrid();
    handleHashOpen();
  } catch (err) {
    statusEl.textContent = '繪本資料載入失敗，請稍後再試 🙏';
    statusEl.classList.add('error');
    console.error('繪本載入失敗', err);
  }
}

// ===== 篩選 chips =====
function buildChipGroup(containerId, options, selectedSet, onToggle) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.type = 'button';
  allChip.className = 'chip' + (selectedSet === null ? ' active' : '');
  allChip.textContent = '全部';
  allChip.addEventListener('click', () => onToggle(null));
  el.appendChild(allChip);

  options.forEach(opt => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip' + (selectedSet && selectedSet.has(opt) ? ' active' : '');
    chip.textContent = opt;
    chip.addEventListener('click', () => onToggle(opt));
    el.appendChild(chip);
  });
}

// 組內單選互斥：點某顆＝只選它（自動取消同組其他）；再點同一顆已選中的，或點「全部」＝回到「全部」
function toggleSelection(current, value, setter) {
  // value === null -> 點「全部」，清空選擇
  if (value === null) { setter(null); renderChips(); renderGrid(); return; }
  if (current && current.has(value) && current.size === 1) {
    setter(null);
  } else {
    setter(new Set([value]));
  }
  renderChips();
  renderGrid();
}

function renderChips() {
  buildChipGroup('pbCatChips', ALL_CATEGORIES.map(c => c.name), selCats,
    v => toggleSelection(selCats, v, s => { selCats = s; }));
  buildChipGroup('pbBrandChips', USED_BRANDS.map(b => b.name), selBrands,
    v => toggleSelection(selBrands, v, s => { selBrands = s; }));
  buildChipGroup('pbTypeChips', ALL_TYPES.slice(), selTypes,
    v => toggleSelection(selTypes, v, s => { selTypes = s; }));
}

// ===== 篩選邏輯 =====
function matchesFilters(book) {
  if (searchTerm) {
    const hay = `${book.title || ''} ${book.author || ''}`.toLowerCase();
    if (!hay.includes(searchTerm)) return false;
  }
  if (selCats) {
    const cats = book.categories || [];
    if (!cats.some(c => selCats.has(c))) return false;
  }
  if (selBrands) {
    if (!book.brand_name || !selBrands.has(book.brand_name)) return false;
  }
  if (selTypes) {
    const types = book.types || [];
    if (!types.some(t => selTypes.has(t))) return false;
  }
  return true;
}

function renderGrid() {
  const grid = document.getElementById('pbGrid');
  const empty = document.getElementById('pbEmpty');
  const list = ALL_BOOKS.filter(matchesFilters);
  document.getElementById('pbCount').textContent = `共 ${list.length} 本`;
  grid.innerHTML = '';
  if (!list.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.forEach(book => {
    const card = document.createElement('div');
    card.className = 'pb-card';
    card.addEventListener('click', () => openBookModal(book));

    const coverWrap = document.createElement('div');
    coverWrap.className = 'pb-card-cover-wrap';
    if (book.cover_url) {
      const img = document.createElement('img');
      img.className = 'pb-card-cover';
      img.src = book.cover_url;
      img.alt = book.title;
      img.loading = 'lazy';
      coverWrap.appendChild(img);
    } else {
      coverWrap.classList.add('placeholder');
      coverWrap.textContent = '📖';
    }
    card.appendChild(coverWrap);

    const body = document.createElement('div');
    body.className = 'pb-card-body';
    const title = document.createElement('div');
    title.className = 'pb-card-title';
    title.textContent = book.title;
    body.appendChild(title);

    const tags = document.createElement('div');
    tags.className = 'pb-card-tags';
    (book.types || []).forEach(t => {
      const tag = document.createElement('span');
      tag.className = 'mini-tag';
      tag.textContent = t;
      tags.appendChild(tag);
    });
    body.appendChild(tags);

    card.appendChild(body);
    grid.appendChild(card);
  });
}

// ===== YouTube 網址解析 =====
function parseYoutubeId(url) {
  if (!url) return '';
  try {
    const u = new URL(String(url).trim());
    const host = u.hostname.replace(/^www\./, '');
    if (host === 'youtu.be') return u.pathname.slice(1).split('/')[0] || '';
    if (host.indexOf('youtube.com') !== -1) {
      if (u.pathname === '/watch') return u.searchParams.get('v') || '';
      const m = u.pathname.match(/^\/(shorts|embed)\/([^/?]+)/);
      if (m) return m[2];
    }
  } catch (e) { /* 網址格式不對，當作沒有影片 */ }
  return '';
}

// ===== 購買區塊 =====
function renderPurchaseSection(book) {
  const wrap = document.getElementById('pbPurchaseSection');
  wrap.innerHTML = '';
  const p = book.purchase || { status: 'none' };
  const shopeeUrl = book.shopee_url || '';

  if (p.status === 'open') {
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const btn = document.createElement('a');
    btn.className = 'action-btn';
    btn.href = p.url;
    btn.target = '_blank';
    btn.rel = 'noopener noreferrer';
    btn.textContent = '🛒 前往購買';
    actions.appendChild(btn);
    wrap.appendChild(actions);
    return;
  }

  if (p.status === 'upcoming') {
    const next = document.createElement('div');
    next.className = 'pb-next-date';
    const d = new Date(p.nextDate + 'T00:00:00');
    next.textContent = isNaN(d) ? `下次開團 ${p.nextDate}` : `📅 下次開團 ${d.getMonth() + 1}/${d.getDate()}`;
    wrap.appendChild(next);
    if (shopeeUrl) {
      const actions = document.createElement('div');
      actions.className = 'modal-actions';
      const btn = document.createElement('a');
      btn.className = 'action-btn action-btn-alt';
      btn.href = shopeeUrl;
      btn.target = '_blank';
      btn.rel = 'noopener noreferrer';
      btn.textContent = '🛍 蝦皮購買';
      actions.appendChild(btn);
      wrap.appendChild(actions);
    }
    return;
  }

  // 'ended' / 'none'：只在有蝦皮連結時顯示
  if (shopeeUrl) {
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const btn = document.createElement('a');
    btn.className = 'action-btn action-btn-alt';
    btn.href = shopeeUrl;
    btn.target = '_blank';
    btn.rel = 'noopener noreferrer';
    btn.textContent = '🛍 蝦皮購買';
    actions.appendChild(btn);
    wrap.appendChild(actions);
  }
}

// ===== 延伸教材面板 =====
function renderMaterials(book) {
  const toggle = document.getElementById('pbMaterialsToggle');
  const panel = document.getElementById('pbMaterialsPanel');
  panel.innerHTML = '';
  panel.classList.remove('show');
  toggle.onclick = null;

  const materials = book.materials || [];
  if (!materials.length) {
    toggle.style.display = 'none';
    return;
  }
  toggle.style.display = 'block';
  toggle.textContent = `📎 延伸教材（${materials.length}）`;

  materials.forEach(m => {
    const card = document.createElement('div');
    card.className = 'pb-material-card';

    const imgWrap = document.createElement('div');
    imgWrap.className = 'pb-material-card-img';
    if (m.thumb_url) {
      const img = document.createElement('img');
      img.src = m.thumb_url;
      img.alt = m.title || '';
      img.loading = 'lazy';
      img.addEventListener('click', () => openLightbox(m));
      imgWrap.appendChild(img);
    } else {
      imgWrap.classList.add('placeholder');
      imgWrap.textContent = '📄';
    }
    card.appendChild(imgWrap);

    const body = document.createElement('div');
    body.className = 'pb-material-card-body';

    const actions = document.createElement('div');
    actions.className = 'pb-mat-actions';

    const icons = document.createElement('div');
    icons.className = 'pb-mat-icons';

    const likeBtn = document.createElement('button');
    likeBtn.type = 'button';
    likeBtn.className = 'pb-mat-icon';
    likeBtn.title = '喜歡';
    likeBtn.setAttribute('aria-label', '喜歡');
    likeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';
    // 目前沒有後端可以存讚，先做成單純的畫面互動（重整就重置），之後真的要留存再接 API。
    likeBtn.addEventListener('click', () => likeBtn.classList.toggle('liked'));
    icons.appendChild(likeBtn);

    const commentBtn = document.createElement('button');
    commentBtn.type = 'button';
    commentBtn.className = 'pb-mat-icon';
    commentBtn.style.display = 'none'; // 先藏起來，之後要顯示留言功能再拿掉這行
    commentBtn.title = '留言';
    commentBtn.setAttribute('aria-label', '留言');
    commentBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
    icons.appendChild(commentBtn);

    const shareBtn = document.createElement('button');
    shareBtn.type = 'button';
    shareBtn.className = 'pb-mat-icon';
    shareBtn.title = '分享';
    shareBtn.setAttribute('aria-label', '分享');
    shareBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>';
    shareBtn.addEventListener('click', sharePbBook);
    icons.appendChild(shareBtn);

    actions.appendChild(icons);

    if (m.file_url || m.thumb_url) {
      const dl = document.createElement('a');
      dl.className = 'pb-mat-download';
      dl.href = m.file_url || m.thumb_url;
      dl.download = m.file_name || '';
      dl.target = '_blank';
      dl.rel = 'noopener noreferrer';
      dl.textContent = '下載';
      actions.appendChild(dl);
    }

    body.appendChild(actions);

    const titleRow = document.createElement('div');
    titleRow.className = 'pb-material-card-titlerow';

    const title = document.createElement('div');
    title.className = 'pb-material-card-title';
    title.textContent = m.title || '未命名教材';
    titleRow.appendChild(title);

    if (m.description) {
      const moreBtn = document.createElement('button');
      moreBtn.type = 'button';
      moreBtn.className = 'pb-mat-more';
      moreBtn.textContent = '更多';
      titleRow.appendChild(moreBtn);

      const desc = document.createElement('div');
      desc.className = 'pb-mat-desc';
      desc.textContent = m.description;

      moreBtn.addEventListener('click', () => {
        const show = desc.classList.toggle('show');
        moreBtn.textContent = show ? '收起' : '更多';
      });

      body.appendChild(titleRow);
      body.appendChild(desc);
    } else {
      body.appendChild(titleRow);
    }

    card.appendChild(body);
    panel.appendChild(card);
  });

  toggle.onclick = () => panel.classList.toggle('show');
}

// ===== Modal 開關 =====
function openBookModal(book) {
  CURRENT_BOOK = book;
  document.getElementById('pbModalTitle').textContent = book.title;

  const subParts = [];
  if (book.author) subParts.push(book.author);
  if (book.publisher) subParts.push(book.publisher);
  document.getElementById('pbModalSubline').textContent = subParts.join(' ・ ');

  const coverWrap = document.getElementById('pbModalCoverWrap');
  const coverImg = document.getElementById('pbModalCover');
  // 占位 emoji 用獨立節點，不能用 textContent 覆寫（會把 <img> 從 DOM 移除，之後每本書的 modal 都會壞）
  let coverPh = document.getElementById('pbModalCoverPh');
  if (!coverPh) {
    coverPh = document.createElement('span');
    coverPh.id = 'pbModalCoverPh';
    coverPh.textContent = '📖';
    coverPh.style.display = 'none';
    coverWrap.appendChild(coverPh);
  }
  if (book.cover_url) {
    coverWrap.classList.remove('placeholder');
    coverPh.style.display = 'none';
    coverImg.style.display = 'block';
    coverImg.src = book.cover_url;
    coverImg.alt = book.title;
  } else {
    coverWrap.classList.add('placeholder');
    coverImg.style.display = 'none';
    coverImg.removeAttribute('src');
    coverPh.style.display = 'block';
  }

  const tagsEl = document.getElementById('pbModalTags');
  tagsEl.innerHTML = '';
  (book.categories || []).forEach(c => {
    const t = document.createElement('span');
    t.className = 'pb-tag pb-tag-cat';
    t.textContent = c;
    tagsEl.appendChild(t);
  });
  (book.types || []).forEach(t => {
    const el = document.createElement('span');
    el.className = 'pb-tag pb-tag-type';
    el.textContent = t;
    tagsEl.appendChild(el);
  });

  const descBox = document.getElementById('pbModalDescBox');
  if (book.description) {
    descBox.style.display = 'block';
    document.getElementById('pbModalDesc').textContent = book.description;
  } else {
    descBox.style.display = 'none';
  }

  const ytWrap = document.getElementById('pbYtWrap');
  const ytId = parseYoutubeId(book.youtube_url);
  if (ytId) {
    ytWrap.style.display = 'block';
    ytWrap.innerHTML = `<img id="pbYtThumb" src="https://i.ytimg.com/vi/${ytId}/hqdefault.jpg" alt="YouTube 影片"><div class="pb-yt-play" id="pbYtPlayBtn"><span>▶</span></div>`;
    ytWrap.onclick = function () {
      ytWrap.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" title="YouTube 影片" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
      ytWrap.onclick = null;
    };
  } else {
    ytWrap.style.display = 'none';
    ytWrap.onclick = null;
  }

  renderPurchaseSection(book);
  renderMaterials(book);

  document.getElementById('bookModal').classList.add('show');
  history.replaceState(null, '', '#book=' + encodeURIComponent(book.id));
}

function closeBookModal() {
  document.getElementById('bookModal').classList.remove('show');
  const url = location.pathname + location.search;
  history.replaceState(null, '', url);
}

// ===== 教材大圖檢視 =====
function openLightbox(m) {
  const img = document.getElementById('pbLightboxImg');
  img.src = m.thumb_url;
  img.alt = m.title || '';
  document.getElementById('pbLightbox').classList.add('show');
}

function closeLightbox() {
  document.getElementById('pbLightbox').classList.remove('show');
}

// 分享＝分享這本繪本的介紹網址（帶 #book= 深連結，開啟時會自動跳出這本書的浮動視窗）。
function sharePbBook() {
  if (!CURRENT_BOOK) return;
  const url = location.origin + location.pathname + '#book=' + encodeURIComponent(CURRENT_BOOK.id);
  if (navigator.share) {
    navigator.share({ title: CURRENT_BOOK.title, url }).catch(() => {});
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(() => showPbToast('已複製繪本連結')).catch(() => promptShareUrl(url));
  } else {
    promptShareUrl(url);
  }
}

function promptShareUrl(url) {
  window.prompt('複製這個連結：', url);
}

let pbToastTimer = null;
function showPbToast(msg) {
  const el = document.getElementById('pbToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(pbToastTimer);
  pbToastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.getElementById('pbLightbox').classList.contains('show')) {
    closeLightbox();
  }
});

function handleHashOpen() {
  const m = /^#book=(.+)$/.exec(location.hash);
  if (!m) return;
  const id = decodeURIComponent(m[1]);
  const book = ALL_BOOKS.find(b => b.id === id);
  if (book) openBookModal(book);
}

document.getElementById('pbSearchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  renderGrid();
});

window.addEventListener('hashchange', handleHashOpen);

loadBooks();
