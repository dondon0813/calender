<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪莉與朵栗 開學用品清單</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* school-list.html 專屬樣式。
     共用的 reset / 版面 / 回首頁鈕 / 返回鈕 / 動作按鈕 / modal / 頁尾在 shared.css。 */

  .empty-state {
    text-align: center;
    color: var(--c-muted-light);
    font-size: 13px;
    padding: 40px 0;
  }
  .status-msg {
    text-align: center;
    color: var(--c-muted-light);
    font-size: 12px;
    padding: 20px 0;
  }

  /* ===== Modal：本頁內容較長，需可捲動 ===== */
  .modal-backdrop { padding: 16px; }
  .modal-box {
    padding: 22px 20px;
    max-width: 92%;
    width: 400px;
    max-height: 86vh;
    overflow-y: auto;
  }
  .modal-close { z-index: 2; }

  /* ===== 食譜卡彈窗 ===== */
  .recipe-card-modal {
    width: 380px;
    padding: 16px 18px 20px;
    background: #FFFCF7;
    border-radius: 26px;
    border: none;
    box-shadow: 0 16px 40px rgba(210,150,110,0.28);
  }
  .rc-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .rc-badge-pill {
    font-size: 12px;
    font-weight: 800;
    color: var(--c-primary);
    background: var(--c-badge-bg);
    border-radius: var(--r-pill);
    padding: 5px 12px;
  }
  .rc-close-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: var(--c-primary);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    flex: none;
  }
  .rc-photo-wrap {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .rc-title {
    text-align: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    color: var(--c-text);
    margin: 4px 0 6px;
    position: relative;
    padding-bottom: 10px;
  }
  .rc-title::after {
    content: '';
    display: block;
    width: 78%;
    height: 0;
    border-bottom: 2px dashed var(--c-title-rule);
    margin: 8px auto 0;
  }
  .rc-section { margin-bottom: 16px; }
  .rc-section-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .rc-section-title {
    font-size: 13.5px;
    font-weight: 800;
    color: var(--c-text);
    background: #FFE9CE;
    border-radius: var(--r-pill);
    padding: 5px 14px;
  }
  .rc-footer {
    text-align: center;
    font-size: 11.5px;
    color: #FFB4C2;
    font-weight: 700;
    margin-top: 14px;
  }

  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  /* 外觀在 shared.css，這裡只調尺寸與並排方式 */
  .action-btn {
    flex: 1 1 auto;
    font-size: 13.5px;
    padding: 11px 12px;
  }

  /* ===== 購買狀態列 ===== */
  .buy-status-list { margin-top: 12px; }
  .buy-status-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-radius: var(--r-sm);
    background: #FFF6EC;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .buy-status-item .bsi-brand { font-weight: 800; color: var(--c-text); }
  .buy-status-item .bsi-text { color: var(--c-muted); font-size: 12px; }
  .buy-status-item .bsi-btn {
    flex: none;
    border: none;
    border-radius: var(--r-pill);
    background: var(--c-primary);
    color: #fff;
    font-weight: 800;
    font-size: 12px;
    padding: 7px 14px;
    cursor: pointer;
    text-decoration: none;
  }

  /* 本頁頁尾比共用的緊一點 */
  .footer {
    margin-top: 22px;
    font-size: 13px;
  }

  /* ===== 開學清單本體 ===== */
  .school-header {
    text-align: center;
    margin-bottom: 18px;
  }
  .school-title-img {
    max-width: 90%;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .school-subtitle-img {
    max-width: 70%;
    height: auto;
    display: block;
    margin: 10px auto 0;
  }
  .school-category-title {
    font-size: 13.5px;
    font-weight: 800;
    color: #fff;
    background: var(--c-text);
    border-radius: var(--r-pill);
    padding: 5px 14px;
    display: inline-block;
    margin: 18px 0 12px;
  }
  .school-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .school-card {
    position: relative;
    background: #FFEDE0;
    border: 2px solid #FFD9BB;
    border-radius: var(--r-lg);
    padding: 16px 8px 10px;
    text-align: center;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .school-card:hover { transform: translateY(-2px); }
  .school-card.checked {
    border-color: var(--c-cat-2);
    background: #EBF7E6;
  }
  .school-checkbox {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    border: 2px solid #E0C9B0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #fff;
  }
  .school-card.checked .school-checkbox {
    background: var(--c-cat-2);
    border-color: var(--c-cat-2);
  }
  .school-icon-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    background: transparent;
    margin-bottom: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 11%;
  }
  .school-icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .school-icon-wrap.emoji-icon {
    font-size: 34px;
    padding: 0;
  }
  .school-card-name {
    font-size: 11.5px;
    font-weight: 800;
    color: var(--c-text-soft);
  }
  .school-card.checked .school-card-name { color: #5C9147; }
  .school-reminder-box {
    padding: 10px 20px;
    margin-top: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .school-reminder-img {
    max-width: 100%;
    height: auto;
    display: block;
  }
  .school-reminder-text {
    font-size: 12px;
    color: var(--c-text-soft);
    line-height: 1.6;
  }
  .school-reminder-text b {
    color: #FF6F91;
  }
  .school-progress {
    text-align: center;
    font-size: 12px;
    color: var(--c-muted);
    font-weight: 700;
    margin-bottom: 14px;
  }

  /* ===== 現正開團中的開學用品品牌（最上方橫向捲動列）===== */
  .ogb-bar {
    background: #FFF6F8;
    border: 1.5px solid #FFD6E0;
    border-radius: 14px;
    padding: 10px 0 12px;
    margin-bottom: 14px;
  }
  .ogb-title {
    font-size: 12.5px;
    font-weight: 900;
    color: #FF6F91;
    text-align: center;
    margin-bottom: 8px;
  }
  /* 置中排列。用 wrap 而不是橫向捲動：品牌數量少時才置得漂亮，
     數量多時自動換行，也不會有「捲動內容被切掉又沒有捲軸提示」的問題 */
  .ogb-items {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 6px;
    padding: 0 10px 2px;
  }
  .ogb-item {
    flex: 0 0 auto;
    width: 80px;
    text-decoration: none;
    text-align: center;
    color: inherit;
  }
  /* 直接用去背圖，不加白底框 */
  .ogb-thumb {
    width: 72px;
    height: 72px;
    margin: 0 auto 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ogb-thumb img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
  /* 沒有去背小圖時的替代：顯示品牌名稱第一個字 */
  .ogb-thumb-fallback {
    font-size: 24px;
    font-weight: 900;
    color: #FFAFC2;
  }
  .ogb-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--c-text-soft);
    line-height: 1.3;
    word-break: break-word;
  }
  .ogb-end {
    font-size: 10px;
    color: #b9a99a;
    margin-top: 1px;
  }

  /* ===== 移除／還原品項 ===== */
  .school-remove-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.85);
    color: #c99a3a;
    font-size: 11px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
  }
  .school-remove-btn:hover { background: var(--c-border-light); }
  .school-removed-toggle {
    display: block;
    margin: 18px auto 0;
    text-align: center;
    font-size: 12px;
    font-weight: 800;
    color: var(--c-brown);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
  .school-removed-box {
    margin-top: 10px;
    border: 2px dashed #E0C9B0;
    border-radius: var(--r-lg);
    padding: 12px 14px;
  }
  .school-removed-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 4px;
    border-bottom: 1px dotted #F0DFCB;
    font-size: 12.5px;
    color: var(--c-text-soft);
  }
  .school-removed-item:last-child { border-bottom: none; }
  .school-restore-btn {
    flex: none;
    border: none;
    border-radius: var(--r-pill);
    background: var(--c-cat-2);
    color: #fff;
    font-weight: 800;
    font-size: 11.5px;
    padding: 5px 12px;
    cursor: pointer;
  }

  .school-modal-icon-wrap {
    width: 60%;
    aspect-ratio: 1 / 1;
    margin: 0 auto 10px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .school-modal-icon-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .school-brand-block {
    margin-bottom: 8px;
  }
  .school-brand-block .buy-status-item {
    margin-bottom: 0;
    border-radius: 10px 10px 0 0;
  }
  .school-brand-note {
    font-size: 11.5px;
    color: var(--c-text-soft);
    line-height: 1.6;
    background: #FFF6EC;
    border-radius: 0 0 10px 10px;
    padding: 2px 12px 10px;
  }

  /* ===== 產生清單海報 ===== */
  .school-generate-box {
    text-align: center;
    margin: 18px 0 6px;
  }
  .school-generate-btn {
    display: inline-block;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
  }
  .school-generate-btn-img {
    display: block;
    width: 100%;
    max-width: 320px;
    height: auto;
    margin: 0 auto;
  }
  .school-generate-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  .school-generate-hint {
    font-size: 11px;
    color: var(--c-muted);
    margin-top: 8px;
  }

  /* ===== A4 海報（離畫面外渲染後截圖）===== */
  #a4PosterRoot {
    position: fixed;
    left: -99999px;
    top: 0;
    width: 794px;
    background: var(--c-surface);
  }
  .a4-poster {
    width: 794px;
    min-height: 1123px;
    background: linear-gradient(180deg, var(--c-bg-top) 0%, var(--c-bg-bottom) 100%);
    padding: 44px 46px 40px;
    font-family: var(--font-body);
    color: var(--c-text);
  }
  .a4-header {
    text-align: center;
    margin-bottom: 26px;
  }
  .a4-title-img {
    max-width: 480px;
    width: 68%;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .a4-subtitle {
    font-size: 14px;
    color: var(--c-brown);
    font-weight: 700;
    margin-top: 14px;
  }
  .a4-category-title {
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    background: var(--c-text);
    border-radius: var(--r-pill);
    padding: 7px 18px;
    display: inline-block;
    margin: 22px 0 14px;
  }
  .a4-cat-header {
    grid-column: 1 / -1;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    background: var(--c-text);
    border-radius: var(--r-pill);
    padding: 7px 18px;
    width: fit-content;
    margin: 18px 0 4px;
  }
  .a4-cat-header:first-child { margin-top: 0; }
  .a4-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }
  .a4-item {
    position: relative;
    background: var(--c-surface-2);
    border: 2px solid #FFD9BB;
    border-radius: var(--r-lg);
    padding: 14px 8px 10px;
    text-align: center;
  }
  .a4-item.checked {
    border-color: var(--c-cat-2);
    background: #EBF7E6;
  }
  .a4-item-checkbox {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid #E0C9B0;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 800;
    color: #fff;
  }
  .a4-item.checked .a4-item-checkbox {
    background: var(--c-cat-2);
    border-color: var(--c-cat-2);
  }
  .a4-item-icon-wrap {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .a4-item-icon-wrap img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .a4-item-icon-wrap.emoji { font-size: 36px; }
  .a4-item-name {
    font-size: 13px;
    font-weight: 800;
    color: var(--c-text);
  }
  .a4-footer {
    text-align: center;
    margin-top: 36px;
    color: var(--c-primary);
    font-weight: 700;
    font-size: 13px;
  }
  .a4-footer-img {
    max-width: 360px;
    width: 60%;
    height: auto;
    display: block;
    margin: 0 auto 12px;
  }
  .a4-footer .a4-date {
    display: block;
    color: var(--c-muted);
    font-weight: 700;
    font-size: 11px;
    margin-top: 4px;
  }

  /* ===== 姓名貼功能 ===== */
  .sticker-modal-icon { font-size: 34px; margin-bottom: 4px; }
  .sticker-modal-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 19px;
    color: var(--c-text);
    margin: 0 0 8px;
  }
  .sticker-modal-desc {
    font-size: 12.5px;
    color: var(--c-text-soft);
    line-height: 1.6;
    margin: 0 0 14px;
  }
  .sticker-name-input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    border-radius: var(--r-md);
    border: 2px solid #FFD9BB;
    background: #FFF6EC;
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 700;
    color: var(--c-text);
    text-align: center;
    outline: none;
  }
  .sticker-name-input:focus { border-color: var(--c-cat-4); }

  .sticker-size-select {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .sticker-size-label {
    font-size: 12.5px;
    font-weight: 800;
    color: var(--c-text-soft);
  }
  .sticker-size-btn {
    border: 2px solid #FFD9BB;
    background: #FFF6EC;
    color: var(--c-text-soft);
    font-family: var(--font-round);
    font-weight: 800;
    font-size: 12.5px;
    border-radius: var(--r-pill);
    padding: 7px 14px;
    cursor: pointer;
  }
  .sticker-size-btn.active {
    background: var(--c-cat-4);
    border-color: var(--c-cat-4);
    color: #fff;
  }

  #stickerPosterRoot {
    position: fixed;
    left: -99999px;
    top: 0;
    background: #ffffff;
  }
  .sticker-poster {
    width: 384px;
    height: 576px;
    background: #ffffff;
    padding: 16px 14px 10px;
    box-sizing: border-box;
    font-family: var(--font-body);
    display: flex;
    flex-direction: column;
  }
  .sticker-grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 6px 6px;
    width: 100%;
  }
  .sticker-poster.size-large .sticker-grid {
    gap: 10px 10px;
  }
  .sticker-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 0;
    overflow: hidden;
  }
  .sticker-icon-wrap {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
  }
  .sticker-icon-wrap img {
    display: block;
    margin: 0 auto;
  }
  .sticker-icon-wrap.emoji { font-size: 26px; }
  .sticker-poster.size-large .sticker-icon-wrap.emoji { font-size: 42px; }
  .sticker-name {
    flex: none;
    margin-top: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 11px;
    color: var(--c-text);
    text-align: center;
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sticker-poster.size-large .sticker-name { font-size: 14px; }
  .sticker-footer {
    flex: none;
    text-align: center;
    font-size: 10.5px;
    font-weight: 700;
    color: var(--c-brown);
    padding-top: 8px;
  }
</style>
</head>
<body>

<a class="site-home-btn" href="recipes.html" title="回首頁" aria-label="回首頁">🏠</a>

<div class="wrap">
  <button class="back-btn" id="backToHome">← 返回首頁</button>
  <div class="school-header">
    <img class="school-title-img" src="icons/title-header.webp" alt="開學用品清單 一起準備上學去" onerror="this.style.display='none';">
  </div>
  <div id="statusMsg" class="status-msg" style="display:none;">資料載入中…</div>
  <div class="ogb-bar" id="openGroupBuyBar" style="display:none;"></div>
  <div class="school-progress" id="schoolProgress"></div>
  <div id="schoolListContent"></div>
  <div class="empty-state" id="schoolListEmpty" style="display:none;">目前還沒有設定開學清單項目</div>
  <button class="school-removed-toggle" id="schoolRemovedToggle" style="display:none;"></button>
  <div class="school-removed-box" id="schoolRemovedBox" style="display:none;"></div>

  <div class="school-generate-box" id="schoolGenerateBox" style="display:none;">
    <button class="school-generate-btn" id="generateA4Btn"><img class="school-generate-btn-img" src="icons/btn-generate.webp" alt="產生我的專屬用品清單"></button>
    <div class="school-generate-hint">會把清單上的項目（不含已移除的）做成一張 A4 圖片，已打勾的項目圖片上也會顯示 ✓，方便下載、列印或帶去購物</div>
  </div>

  <div class="school-generate-box" id="stickerGenerateBox" style="display:none;">
    <button class="school-generate-btn" id="openStickerModalBtn"><img class="school-generate-btn-img" src="icons/btn-sticker.webp" alt="製作我的專屬姓名貼"></button>
    <div class="school-generate-hint">輸入姓名後，會把清單上的項目（不含已移除的）做成一張 4x6 姓名貼圖片，每樣用品下面都印上姓名，方便沖印後貼在每樣用品上</div>
  </div>

  <div class="school-reminder-box">
    <img class="school-reminder-img" src="icons/reminder-footer.webp" alt="所有物品都記得寫上名字，才不會弄丟喔！" onerror="this.style.display='none';">
  </div>

  <div class="footer"><a href="https://www.instagram.com/dondon0813/" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:none;">雪莉與朵栗 ♥</a></div>

<script>
// html2canvas（約 200KB）延後到使用者真的點「產生圖片」/「製作姓名貼」才載入，
// 其他只是來看清單的人不用白白多下載這包函式庫
let html2canvasLoadPromise = null;
function ensureHtml2Canvas() {
  if (typeof html2canvas === 'function') return Promise.resolve();
  if (!html2canvasLoadPromise) {
    html2canvasLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'vendor/html2canvas.min.js';
      s.onload = resolve;
      s.onerror = () => { html2canvasLoadPromise = null; reject(new Error('html2canvas 載入失敗')); };
      document.head.appendChild(s);
    });
  }
  return html2canvasLoadPromise;
}
</script>
<script>
// ===== 設定 =====
const SHEET_ID = "18DfV9xz58VvNDuKx7LD2aUewwBeN3abugK9BAl79rJk"; // 跟客人版行事曆同一份公開試算表
const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;

// 請把 Apps Script 部署後的網址貼在這裡（跟 admin.html / recipes.html 用同一組網址）
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTxoqVO1nf--Q9s-lf1eIPdgrDpJgLsuAy1mAwgydYzb7ThAuygx79oFNsEH-kWD2R/exec";

let SCHOOL_ITEMS = [];
let CALENDAR_EVENTS = [];
// 品牌名稱 → 去背小圖（品牌資料庫的預設圖；行事曆該檔 W 欄有填就優先用那張）
let BRAND_THUMBS = {};
// 這兩個 key 名稱原本漏掉宣告，導致存 localStorage 一律失敗（錯誤被下面函式的 try/catch 悄悄吞掉，
// 畫面上完全看不出來），才會出現「打勾／打叉都沒反應」的狀況。這裡補回正式宣告：
const SCHOOL_STORAGE_KEY = 'school_checked_v1';
const SCHOOL_REMOVED_KEY = 'school_removed_v1';
let schoolRemovedExpanded = false;

// ===== 載入資料 =====
async function loadAll() {
  const statusEl = document.getElementById('statusMsg');
  statusEl.style.display = 'block';
  try {
    await Promise.all([loadSchoolItems(), loadCalendar()]);
    statusEl.style.display = 'none';
    renderSchoolList();
  } catch (err) {
    statusEl.style.display = 'block';
    statusEl.textContent = '資料載入失敗，請稍後重新整理再試一次';
    console.error(err);
  }
}

async function loadSchoolItems() {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
    throw new Error('尚未設定 APPS_SCRIPT_URL');
  }
  const noCacheUrl = APPS_SCRIPT_URL + '?scope=public&t=' + Date.now();
  const res = await fetch(noCacheUrl, { cache: 'no-store' });
  const data = await res.json();
  // key 一律轉小寫，因為開學清單「品牌推薦」欄的英文大小寫跟品牌資料庫不一定一致
  // （清單裡本身就同時出現 Trixie/trixie、Wewee!/wewee! 兩種寫法）
  BRAND_THUMBS = {};
  (data.brandThumbs || []).forEach(b => {
    const name = String(b['品牌名稱'] || '').trim();
    const url = String(b['去背小圖'] || '').trim();
    if (name && url) BRAND_THUMBS[normalizeBrandKey(name)] = url;
  });
  const rawSchoolList = (data.schoolList || []).filter(s => s['編號']);
  // 「顯示」欄位是店家控制的預設隱藏（填「否」就對所有人隱藏），
  // 跟客人自己點✕移除（存在客人自己裝置）是兩回事：這裡先把店家設定隱藏的項目整個濾掉
  SCHOOL_ITEMS = rawSchoolList.filter(s => {
    const show = String(s['顯示'] || '').trim().toUpperCase();
    return show !== '否' && show !== 'FALSE' && show !== 'N' && show !== '0';
  });
  SCHOOL_ITEMS.sort((a, b) => {
    const oa = parseFloat(a['排序']); const ob = parseFloat(b['排序']);
    if (!isNaN(oa) && !isNaN(ob)) return oa - ob;
    if (!isNaN(oa)) return -1;
    if (!isNaN(ob)) return 1;
    return 0;
  });
}

function parseDateStr(s) {
  if (!s) return null;
  s = String(s).trim();
  const gvizMatch = s.match(/Date\((\d+),(\d+),(\d+)\)/);
  if (gvizMatch) {
    return new Date(parseInt(gvizMatch[1]), parseInt(gvizMatch[2]), parseInt(gvizMatch[3]));
  }
  const parts = s.split(/[\/\-]/).map(p => parseInt(p, 10));
  if (parts.length === 3) return new Date(parts[0], parts[1] - 1, parts[2]);
  return null;
}

function fmtSingleDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function startOfDay(d) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function parseExtendRaw(raw) {
  if (raw === null || raw === undefined || raw === '') return null;
  if (typeof raw === 'number') return { type: 'days', value: raw };
  const s = String(raw).trim();
  if (s === '') return null;
  if (/^\d+$/.test(s)) return { type: 'days', value: parseInt(s, 10) };
  const d = parseDateStr(s);
  if (d) return { type: 'date', value: d };
  return null;
}

function computeDisplayEnd(end, extend) {
  if (!extend) return end;
  const today = new Date();
  const todayStart = startOfDay(today);
  const endStart = startOfDay(end);
  if (todayStart <= endStart) return end;
  if (extend.type === 'days') {
    return new Date(end.getFullYear(), end.getMonth(), end.getDate() + extend.value);
  }
  return extend.value;
}

async function loadCalendar() {
  // 改走 Apps Script（scope=calendar 回傳與 gviz 相同格式），試算表就能設為私人、不必公開可讀
  const res = await fetch(APPS_SCRIPT_URL + '?scope=calendar&t=' + Date.now(), { cache: 'no-store' });
  const text = await res.text();
  const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  const data = JSON.parse(jsonStr);
  const rows = data.table.rows;
  const events = [];
  rows.forEach(row => {
    const c = row.c;
    if (!c || !c[0] || c[0].v === null || c[0].v === '') return;
    const startRaw = c[1] ? c[1].v : null;
    const endRaw = c[2] ? c[2].v : null;
    const extendRaw = c[3] ? c[3].v : null;
    const title = c[4] ? c[4].v : '';
    const url = c[7] ? c[7].v : '';
    // V欄(idx21)「對應品項」：空白=一般團（對品牌所有品項）；有填=特殊團（只對填的品項），可用｜分隔多個
    // 註：J~U(idx9~20)後台admin.js已使用（早鳥禮/食譜品牌/顏色/整日/時間/團購/顯示/社群圖示），故用admin不會碰的V欄
    const itemsRaw = c[21] ? c[21].v : '';
    const items = String(itemsRaw || '').split(/[|｜、,，]/).map(s => s.trim()).filter(Boolean);
    // W欄(idx22)「去背小圖」：這檔專用；空白就 fallback 到品牌資料庫的品牌預設小圖
    const thumb = c[22] ? String(c[22].v || '').trim() : '';
    const start = parseDateStr(startRaw);
    const end = parseDateStr(endRaw);
    if (!start || !end || !title) return;
    const extend = parseExtendRaw(extendRaw);
    const displayEnd = computeDisplayEnd(end, extend);
    events.push({ title, start, displayEnd, url, items, thumb });
  });
  CALENDAR_EVENTS = events;
}

// 品牌名比對前先正規化：轉小寫＋去掉空格。
// 因為行事曆團名跟「品牌推薦」欄的寫法不一定一致，例如
// 行事曆「B21 Pro/三麗鷗/標籤機」vs 品牌推薦「B21pro」，不正規化就永遠比對不到。
function normalizeBrandKey(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, '');
}

function getBrandStatus(brandName, itemName) {
  const today = startOfDay(new Date());
  const brandKey = normalizeBrandKey(brandName);
  const matches = CALENDAR_EVENTS.filter(ev => {
    if (!brandKey || !normalizeBrandKey(ev.title).includes(brandKey)) return false;
    // 一般團（J欄空白）：對品牌所有品項都算；特殊團（J欄有填）：只對填寫的品項算
    if (!ev.items || ev.items.length === 0) return true;
    return ev.items.includes(itemName);
  });
  const openEvent = matches.find(ev => startOfDay(ev.start) <= today && today <= startOfDay(ev.displayEnd));
  if (openEvent) return { brand: brandName, status: 'open', url: openEvent.url, thumb: openEvent.thumb, end: openEvent.displayEnd };
  const future = matches
    .filter(ev => startOfDay(ev.start) > today)
    .sort((a, b) => a.start - b.start);
  if (future.length) return { brand: brandName, status: 'upcoming', nextDate: future[0].start };
  return { brand: brandName, status: 'ended' };
}

function isValidUrl(s) {
  return typeof s === 'string' && /^https?:\/\//i.test(s.trim());
}

function getCheckedSchoolIds() {
  try {
    const raw = localStorage.getItem(SCHOOL_STORAGE_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) {
    return new Set();
  }
}

function saveCheckedSchoolIds(set) {
  try {
    localStorage.setItem(SCHOOL_STORAGE_KEY, JSON.stringify(Array.from(set)));
  } catch (e) { /* 瀏覽器不支援或被封鎖時，安靜地放棄儲存，不影響畫面操作 */ }
}

function getRemovedSchoolIds() {
  try {
    const raw = localStorage.getItem(SCHOOL_REMOVED_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) {
    return new Set();
  }
}

function saveRemovedSchoolIds(set) {
  try {
    localStorage.setItem(SCHOOL_REMOVED_KEY, JSON.stringify(Array.from(set)));
  } catch (e) { /* 同上，安靜放棄 */ }
}

function toggleSchoolItem(id) {
  const checked = getCheckedSchoolIds();
  if (checked.has(id)) checked.delete(id); else checked.add(id);
  saveCheckedSchoolIds(checked);
  renderSchoolList();
}

function removeSchoolItem(id) {
  const removed = getRemovedSchoolIds();
  removed.add(id);
  saveRemovedSchoolIds(removed);
  // 移除的項目如果原本有打勾，也順便清掉勾選狀態，避免加回來時顯示奇怪的已完成狀態
  const checked = getCheckedSchoolIds();
  if (checked.has(id)) { checked.delete(id); saveCheckedSchoolIds(checked); }
  renderSchoolList();
}

function restoreSchoolItem(id) {
  const removed = getRemovedSchoolIds();
  removed.delete(id);
  saveRemovedSchoolIds(removed);
  renderSchoolList();
}

// 最上方「現正開團中」：掃過目前顯示中的開學清單品項，收集正在開團的品牌推薦。
// 小圖優先序：行事曆該檔 W 欄 > 品牌資料庫預設 > 品牌名稱第一個字。
function getOpenSchoolBrands() {
  const removedIds = getRemovedSchoolIds();
  const seen = new Set();
  const result = [];
  SCHOOL_ITEMS.filter(it => !removedIds.has(it['編號'])).forEach(item => {
    const brands = String(item['品牌推薦'] || '').split(/[|｜]/).map(s => s.trim()).filter(Boolean);
    const itemName = String(item['項目名稱'] || '').trim();
    brands.forEach(brand => {
      if (seen.has(brand)) return;
      const status = getBrandStatus(brand, itemName);
      if (status.status !== 'open') return;
      seen.add(brand);
      result.push({
        brand: brand,
        url: status.url,
        thumb: status.thumb || BRAND_THUMBS[normalizeBrandKey(brand)] || '',
        end: status.end
      });
    });
  });
  return result;
}

function renderOpenGroupBuyBar() {
  const bar = document.getElementById('openGroupBuyBar');
  if (!bar) return;
  const open = getOpenSchoolBrands();
  bar.innerHTML = '';
  if (!open.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'block';

  const title = document.createElement('div');
  title.className = 'ogb-title';
  title.textContent = '🟢 現正開團中的開學用品';
  bar.appendChild(title);

  const scroll = document.createElement('div');
  scroll.className = 'ogb-items';
  open.forEach(o => {
    // 有團購連結才做成可點的 a，沒有就用 div，避免產生 href="undefined" 的死連結
    const canLink = isValidUrl(o.url);
    const cell = document.createElement(canLink ? 'a' : 'div');
    cell.className = 'ogb-item';
    if (canLink) {
      cell.href = o.url;
      cell.target = '_blank';
      cell.rel = 'noopener noreferrer';
    }

    const thumbBox = document.createElement('div');
    thumbBox.className = 'ogb-thumb';
    if (isValidUrl(o.thumb)) {
      const img = document.createElement('img');
      img.src = o.thumb;
      img.alt = o.brand;
      img.loading = 'lazy';
      // 圖片掛掉時退回文字，不要留一個破圖框
      img.onerror = function () {
        thumbBox.innerHTML = '';
        const fb = document.createElement('span');
        fb.className = 'ogb-thumb-fallback';
        fb.textContent = o.brand.charAt(0);
        thumbBox.appendChild(fb);
      };
      thumbBox.appendChild(img);
    } else {
      const fb = document.createElement('span');
      fb.className = 'ogb-thumb-fallback';
      fb.textContent = o.brand.charAt(0);
      thumbBox.appendChild(fb);
    }
    cell.appendChild(thumbBox);

    const name = document.createElement('div');
    name.className = 'ogb-name';
    name.textContent = o.brand;
    cell.appendChild(name);

    if (o.end) {
      const end = document.createElement('div');
      end.className = 'ogb-end';
      end.textContent = fmtSingleDate(o.end) + ' 收單';
      cell.appendChild(end);
    }

    scroll.appendChild(cell);
  });
  bar.appendChild(scroll);
}

function renderSchoolList() {
  renderOpenGroupBuyBar();
  const contentEl = document.getElementById('schoolListContent');
  const emptyEl = document.getElementById('schoolListEmpty');
  const progressEl = document.getElementById('schoolProgress');
  const removedToggleEl = document.getElementById('schoolRemovedToggle');
  const removedBoxEl = document.getElementById('schoolRemovedBox');
  const generateBoxEl = document.getElementById('schoolGenerateBox');
  const stickerGenerateBoxEl = document.getElementById('stickerGenerateBox');
  contentEl.innerHTML = '';

  if (!SCHOOL_ITEMS.length) {
    emptyEl.style.display = 'block';
    progressEl.style.display = 'none';
    removedToggleEl.style.display = 'none';
    removedBoxEl.style.display = 'none';
    generateBoxEl.style.display = 'none';
    stickerGenerateBoxEl.style.display = 'none';
    return;
  }

  const removedIds = getRemovedSchoolIds();
  const visibleItems = SCHOOL_ITEMS.filter(it => !removedIds.has(it['編號']));
  const removedItems = SCHOOL_ITEMS.filter(it => removedIds.has(it['編號']));

  if (!visibleItems.length) {
    emptyEl.style.display = 'block';
    emptyEl.textContent = '這個裝置的清單項目都被移除囉，可以到下面「已移除的項目」加回來';
  } else {
    emptyEl.style.display = 'none';
  }

  const checked = getCheckedSchoolIds();
  const totalChecked = visibleItems.filter(it => checked.has(it['編號'])).length;
  progressEl.style.display = visibleItems.length ? 'block' : 'none';
  progressEl.textContent = `已準備 ${totalChecked} / ${visibleItems.length} 項`;

  generateBoxEl.style.display = visibleItems.length ? 'block' : 'none';
  stickerGenerateBoxEl.style.display = visibleItems.length ? 'block' : 'none';

  // 有填「分類」的話依分類分組顯示，順序依第一次出現的分類為準；完全沒填分類就整批平鋪
  const hasCategory = visibleItems.some(it => String(it['分類'] || '').trim());

  if (visibleItems.length) {
    if (!hasCategory) {
      contentEl.appendChild(buildSchoolGrid(visibleItems, checked));
    } else {
      const groups = [];
      const groupIndex = {};
      visibleItems.forEach(it => {
        const cat = String(it['分類'] || '').trim() || '其他';
        if (!(cat in groupIndex)) {
          groupIndex[cat] = groups.length;
          groups.push({ cat, items: [] });
        }
        groups[groupIndex[cat]].items.push(it);
      });
      groups.forEach(g => {
        const head = document.createElement('div');
        head.className = 'school-category-title';
        head.textContent = g.cat;
        contentEl.appendChild(head);
        contentEl.appendChild(buildSchoolGrid(g.items, checked));
      });
    }
  }

  // 已移除的項目：收合區塊，展開才看得到，點「加回來」可以恢復顯示
  if (!removedItems.length) {
    removedToggleEl.style.display = 'none';
    removedBoxEl.style.display = 'none';
    return;
  }
  removedToggleEl.style.display = 'block';
  removedToggleEl.textContent = (schoolRemovedExpanded ? '▲ ' : '▼ ') + `已移除的項目（${removedItems.length}）`;
  removedToggleEl.onclick = () => {
    schoolRemovedExpanded = !schoolRemovedExpanded;
    renderSchoolList();
  };

  if (!schoolRemovedExpanded) {
    removedBoxEl.style.display = 'none';
    return;
  }
  removedBoxEl.style.display = 'block';
  removedBoxEl.innerHTML = '';
  removedItems.forEach(item => {
    const row = document.createElement('div');
    row.className = 'school-removed-item';
    const nameSpan = document.createElement('span');
    nameSpan.textContent = item['項目名稱'] || '';
    row.appendChild(nameSpan);
    const restoreBtn = document.createElement('button');
    restoreBtn.className = 'school-restore-btn';
    restoreBtn.textContent = '＋ 加回來';
    restoreBtn.addEventListener('click', () => restoreSchoolItem(item['編號']));
    row.appendChild(restoreBtn);
    removedBoxEl.appendChild(row);
  });
}

function buildSchoolGrid(items, checkedSet) {
  const grid = document.createElement('div');
  grid.className = 'school-grid';
  items.forEach(item => {
    const id = item['編號'];
    const isChecked = checkedSet.has(id);

    const card = document.createElement('div');
    card.className = 'school-card' + (isChecked ? ' checked' : '');

    const box = document.createElement('div');
    box.className = 'school-checkbox';
    box.textContent = isChecked ? '✓' : '';

    grid.appendChild(card);
  });
  return grid;
}

function openSchoolItemModal(item) {

  const brandRaw = String(item['品牌推薦'] || '').trim();

  const noBrandBox = document.getElementById('schoolModalNoBrand');

  // 跟品牌推薦照順序一一對應；如果中間某個品牌沒有蝦皮連結，要留空位佔位置，例如：
  // 品牌推薦「A｜B｜C」但B沒有連結，蝦皮連結要打成「連結A｜｜連結C」（中間兩個分隔符號中間留空），
  // 不能直接省略只打兩個連結，不然順序會全部錯位對到錯的品牌
  // 沒填或數量對不上的部分，就不會顯示蝦皮下單按鈕（除非該品牌剛好開團中，那時候一定會顯示真正的團購連結）
  const shopeeLinks = shopeeRaw.split(/[|｜]/).map(s => s.trim());
  // 品牌介紹/心得也是同樣規則：跟品牌推薦照順序對應，中間沒有的話一樣要留空位佔位置
  const brandNotes = noteRaw.split(/[|｜]/).map(s => s.trim());

  if (brands.length) {
    listEl.innerHTML = '';
    brands.forEach((brand, idx) => {
      const hasOwnShopeeLink = shopeeLinks[idx] && isValidUrl(shopeeLinks[idx]);
      const shopeeUrl = hasOwnShopeeLink ? shopeeLinks[idx] : '';
      const note = brandNotes[idx] || '';
      const status = getBrandStatus(brand, String(item['項目名稱'] || '').trim());

      const block = document.createElement('div');
      block.className = 'school-brand-block';

      const row = document.createElement('div');
      row.className = 'buy-status-item';

      let rightHtml = '';
      if (status.status === 'open') {
        // 開團中一定有真實的團購連結，不受蝦皮連結有沒有填影響，一定顯示按鈕
        rightHtml = `<div style="display:flex; align-items:center; gap:6px;"><a class="bsi-btn" href="${status.url}" target="_blank" rel="noopener noreferrer">🟢 現正開團中・前往下單</a></div>`;
      } else if (status.status === 'upcoming') {
        rightHtml = `<div style="display:flex; align-items:center; gap:6px;"><span class="bsi-text">下一團 ${fmtSingleDate(status.nextDate)} 開團</span>${hasOwnShopeeLink ? `<a class="bsi-btn" href="${shopeeUrl}" target="_blank" rel="noopener noreferrer">蝦皮下單</a>` : ''}</div>`;
      } else {
        rightHtml = `<div style="display:flex; align-items:center; gap:6px;"><span class="bsi-text">目前尚無安排開團</span>${hasOwnShopeeLink ? `<a class="bsi-btn" href="${shopeeUrl}" target="_blank" rel="noopener noreferrer">蝦皮下單</a>` : ''}</div>`;
      }
      row.innerHTML = `<span class="bsi-brand">${brand}</span>` + rightHtml;
      block.appendChild(row);

      // 品牌介紹/心得：有填才顯示，沒填就不會多出空白區塊
      if (note) {
        const noteEl = document.createElement('div');
        noteEl.className = 'school-brand-note';
        noteEl.textContent = note;
        block.appendChild(noteEl);
      }

      listEl.appendChild(block);
    });

    noBrandBox.style.display = 'none';
  } else {

    const altUrl = shopeeLinks[0] && isValidUrl(shopeeLinks[0]) ? shopeeLinks[0] : '';
    const altBtn = document.getElementById('schoolModalBuyBtnAlt');
    if (altUrl) {
      altBtn.href = altUrl;
      altBtn.style.display = 'block';
    } else {
      altBtn.style.display = 'none';
    }
    brandBox.style.display = 'none';
    noBrandBox.style.display = 'block';
  }

  document.getElementById('schoolItemModal').classList.add('show');
}

function preloadImage(src) {
  return new Promise((resolve) => {
    if (!src) { resolve({ ok: false }); return; }
    let done = false;
    const finish = (result) => {
      if (done) return;
      done = true;
      resolve(result);
    };
    // 有些圖片網址在手機網路或被擋盜連時，img 的 onload/onerror 可能永遠不會觸發，
    // 導致 Promise.all 卡死、整個「產生中」按鈕永遠沒反應。加上 timeout 保底，逾時就當作失敗。
    const timer = setTimeout(() => finish({ ok: false }), 8000);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { clearTimeout(timer); finish({ ok: true, w: img.naturalWidth, h: img.naturalHeight }); };
    img.onerror = () => { clearTimeout(timer); finish({ ok: false }); };
    img.src = src;
  });
}

async function buildA4Poster() {
  const checked = getCheckedSchoolIds();
  const removedIds = getRemovedSchoolIds();
  // 產生的圖片是「挑選好的清單」：把打叉移除的項目排除掉，其餘全部列出（不管有沒有打勾）
  const items = SCHOOL_ITEMS.filter(it => !removedIds.has(it['編號']));
  const checkedCount = items.filter(it => checked.has(it['編號'])).length;

  document.getElementById('a4Subtitle').textContent = `共 ${items.length} 項 ・ 已準備 ${checkedCount} 項 ・ 一起準備上學去 🎒`;
  const now = new Date();
  document.getElementById('a4Date').textContent = `製作日期：${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;

  const bodyEl = document.getElementById('a4Body');
  bodyEl.innerHTML = '';

  if (!items.length) return false;

  const imgChecks = [];

  const gridEl = document.createElement('div');
  gridEl.className = 'a4-grid';
  // 項目不多的話維持一排 5 個比較好看；項目超過 25 個改成一排 6 個，減少行數、比較不容易超出一張 A4 的高度
  const COLS = items.length > 25 ? 6 : 5;
  gridEl.style.gridTemplateColumns = `repeat(${COLS}, 1fr)`;
  bodyEl.appendChild(gridEl);

  {
    items.forEach(item => {
      const id = item['編號'];
      const isChecked = checked.has(id);
      const cell = document.createElement('div');
      cell.className = 'a4-item' + (isChecked ? ' checked' : '');

      const box = document.createElement('div');
      box.className = 'a4-item-checkbox';
      box.textContent = isChecked ? '✓' : '';
      cell.appendChild(box);

      const iconRaw = String(item['圖示'] || '').trim();
      const iconWrap = document.createElement('div');
      if (isValidUrl(iconRaw)) {
        iconWrap.className = 'a4-item-icon-wrap';
        const img = document.createElement('img');
        img.src = iconRaw;
        iconWrap.appendChild(img);
        imgChecks.push(preloadImage(iconRaw).then(res => {
          if (!res.ok) {
            iconWrap.className = 'a4-item-icon-wrap emoji';
            iconWrap.textContent = '🎒';
            return;
          }
          // 手動依容器實際尺寸＋圖片原始長寬比算出縮小後的寬高（依長邊為主等比縮放），
          // 不依賴 object-fit / aspect-ratio 百分比，因為截圖工具對這兩個 CSS 屬性支援不穩定，
          // 遇到長條圖會直接抓不到高度、上下被裁掉
          const boxSize = iconWrap.getBoundingClientRect().width || iconWrap.offsetWidth || 0;
          if (boxSize && res.w && res.h) {
            iconWrap.style.height = boxSize + 'px';
            const ratio = res.w / res.h;
            let drawW, drawH;
            if (ratio >= 1) { drawW = boxSize; drawH = boxSize / ratio; }
            else { drawH = boxSize; drawW = boxSize * ratio; }
            img.style.width = drawW + 'px';
            img.style.height = drawH + 'px';
          }
        }));
      } else {
        iconWrap.className = 'a4-item-icon-wrap emoji';
        iconWrap.textContent = iconRaw || '🎒';
      }
      cell.appendChild(iconWrap);

      const name = document.createElement('div');
      name.className = 'a4-item-name';
      name.textContent = item['項目名稱'] || '';
      cell.appendChild(name);

      gridEl.appendChild(cell);
    });
  }

  await Promise.all(imgChecks);
  return true;
}

function canvasToBlobAsync(canvas) {
  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), 'image/png');
  });
}

// 整個流程的看門狗：不管卡在哪一步（圖片載入、html2canvas 截圖、toBlob 轉檔…），
// 超過時間都強制結束並跳出錯誤訊息，不再讓按鈕永遠停在「產生中」不會動
function withWatchdog(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('WATCHDOG_TIMEOUT')), ms))
  ]);
}

// 逾時當下沒辦法連線除錯，先把裝置/網路資訊蒐集進錯誤訊息裡，方便使用者截圖回報
function collectDiagnostics(cloneMs) {
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const parts = [
    `UA: ${navigator.userAgent}`,
    `記憶體: ${navigator.deviceMemory ? navigator.deviceMemory + 'GB' : '未知'}`,
    `網路類型: ${conn ? (conn.effectiveType || '未知') + (conn.saveData ? '（省流量模式開啟）' : '') : '未知'}`,
    `html2canvas: ${typeof html2canvas === 'function' ? '已載入' : '未載入或載入失敗'}`,
    `複製畫面階段: ${cloneMs != null ? `已完成，用了 ${cloneMs}ms` : '卡在複製畫面這一步，還沒完成'}`
  ];
  return parts.join(' / ');
}

// html2canvas 截圖時會把「整個頁面」複製一份到暗處理（不是只複製目標元素），
// 這個頁面項目多、DOM 大，複製起來對效能較弱的裝置負擔很大；改成把要截圖的樣板
// 複製進一個乾淨、幾乎空白的 iframe 裡再截圖，讓 html2canvas 只需要複製一個很小的頁面，
// 跟獨立測試頁（test-html2canvas.html）用的是同一招，那邊已確認在卡住的手機上能正常跑
async function captureInIsolatedFrame(sourceEl, options) {
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed; left:-99999px; top:0; border:0;';
  iframe.width = String(options.width || sourceEl.offsetWidth || 400);
  iframe.height = String(options.height || sourceEl.offsetHeight || 400);
  document.body.appendChild(iframe);

  try {
    const doc = iframe.contentDocument;
    doc.open();
    doc.write(`<!DOCTYPE html><html><head><base href="${location.href}"></head><body style="margin:0;"></body></html>`);
    doc.close();

    // 樣板的排版樣式（grid/flex 等）是寫在主頁面的 <style> 裡，不是外部檔案，
    // 這裡把主頁面 <head> 裡所有的 <style> 內容和 <link rel="stylesheet"> 都複製一份過去，
    // 這個 iframe 才會有跟主頁面一樣的樣式可以用
    document.querySelectorAll('head style').forEach(styleEl => {
      const s = doc.createElement('style');
      s.textContent = styleEl.textContent;
      doc.head.appendChild(s);
    });
    document.querySelectorAll('head link[rel="stylesheet"]').forEach(linkEl => {
      const l = doc.createElement('link');
      l.rel = 'stylesheet';
      l.href = linkEl.href;
      doc.head.appendChild(l);
    });

    const clone = sourceEl.cloneNode(true);
    doc.body.appendChild(clone);

    // 等 iframe 裡的字型 / 圖片都載入完成，避免截到空白或缺字
    const fontsReady = doc.fonts && doc.fonts.ready ? doc.fonts.ready : Promise.resolve();
    const imgs = Array.from(clone.querySelectorAll('img'));
    const imgsReady = Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(resolve => {
      img.addEventListener('load', resolve);
      img.addEventListener('error', resolve);
    })));
    await Promise.race([
      Promise.all([fontsReady, imgsReady]),
      new Promise(resolve => setTimeout(resolve, 3000))
    ]);

    return await html2canvas(clone, options);
  } finally {
    document.body.removeChild(iframe);
  }
}

async function generateA4Image() {
  const btn = document.getElementById('generateA4Btn');
  btn.disabled = true;
  let step = '準備清單';
  let cloneMs = null;

  try {
    await withWatchdog((async () => {
      step = '載入截圖工具';
      await ensureHtml2Canvas();

      const hasItems = await buildA4Poster();
      if (!hasItems) {
        alert('目前清單上沒有項目可以產生圖片唷（可能都被移除了），可以到「已移除的項目」加回來看看 🎒');
        return;
      }

      // 等字體 / 版面穩定
      await new Promise(r => setTimeout(r, 150));

      step = '截圖排版 - 複製畫面（html2canvas clone）';
      const posterEl = document.getElementById('a4Poster');
      // 卡住的 bug 已經用「複製到獨立乾淨 iframe 再截圖」解決了，不再需要為了排錯
      // 把 scale 壓到 1（那樣列印出來解析度太低、連文字都會糊），調回正常列印品質
      const outputScale = 2;
      // 明確指定寬高，不要讓 html2canvas 自己去量測 DOM 尺寸——
      // 後台食譜貼文產生器同樣用 html2canvas 但一律傳明確寬高，測試下來很穩定；
      // school-list 這裡原本沒傳，讓 html2canvas 自己量測，懷疑就是卡住的原因
      const measuredW = posterEl.offsetWidth;
      const measuredH = posterEl.scrollHeight;
      const cloneStartedAt = Date.now();
      const capturedCanvas = await captureInIsolatedFrame(posterEl, {
        width: measuredW,
        height: measuredH,
        scale: outputScale,
        backgroundColor: '#FFFBF5',
        useCORS: true,
        imageTimeout: 8000,
        onclone: () => {
          cloneMs = Date.now() - cloneStartedAt;
          step = '截圖排版 - 畫面繪製（html2canvas render）';
        }
      });

      // A4 比例（794 x 1123，跟樣板寬度一致）＊輸出倍率
      const a4W = 794 * outputScale;
      const a4H = 1123 * outputScale;

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = a4W;
      finalCanvas.height = a4H;
      const ctx = finalCanvas.getContext('2d');
      ctx.fillStyle = '#FFFBF5';
      ctx.fillRect(0, 0, a4W, a4H);

      // 項目太多、內容比一張A4還高的話，整張等比例縮小塞進A4裡；
      // 內容沒那麼高的話就置中貼上，維持輸出永遠是標準A4尺寸
      const fitScale = Math.min(1, a4H / capturedCanvas.height, a4W / capturedCanvas.width);
      const drawW = capturedCanvas.width * fitScale;
      const drawH = capturedCanvas.height * fitScale;
      const dx = (a4W - drawW) / 2;
      const dy = (a4H - drawH) / 2;
      ctx.drawImage(capturedCanvas, dx, dy, drawW, drawH);

      step = '轉檔（canvas.toBlob）';
      const blob = await canvasToBlobAsync(finalCanvas);
      if (!blob) {
        alert('圖片產生失敗，請再試一次');
        return;
      }
      step = '下載圖片';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const now = new Date();
      const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
      a.href = url;
      a.download = `開學用品清單_${stamp}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
    })(), 40000);
  } catch (err) {
    console.error(err);
    if (err && err.message === 'WATCHDOG_TIMEOUT') {
      alert(`圖片產生逾時了（卡在「${step}」這一步），可能是網路不穩或這台裝置暫時卡住，請再試一次；如果一直發生，麻煩把這個訊息截圖給我們 🙏\n\n${collectDiagnostics(cloneMs)}`);
    } else {
      alert('圖片產生失敗，請再試一次');
    }
  } finally {
    btn.disabled = false;
  }
}

function closeModal(id) {

// ===== 姓名貼（4x6 明信片，白底；小＝橫4x直6=24格；大＝橫3x直5=15格，每格約3x3公分，不足就輪迴填滿） =====
let stickerSize = 'small'; // 'small' | 'large'
const STICKER_GRID_CONFIG = {
  small: { cols: 4, rows: 6 },
  large: { cols: 3, rows: 5 }
};

function buildStickerItemSlots(items, slotCount) {
  if (!items.length) return [];
  const slots = [];
  for (let i = 0; i < slotCount; i++) {
    slots.push(items[i % items.length]);
  }
  return slots;
}

async function buildStickerPoster(name) {
  const removedIds = getRemovedSchoolIds();
  // 跟 A4 清單一樣：只排除打叉移除的項目
  const items = SCHOOL_ITEMS.filter(it => !removedIds.has(it['編號']));

  const posterEl = document.getElementById('stickerPoster');
  const gridEl = document.getElementById('stickerGrid');
  gridEl.innerHTML = '';
  if (!items.length) return false;

  const cfg = STICKER_GRID_CONFIG[stickerSize] || STICKER_GRID_CONFIG.small;
  const slotCount = cfg.cols * cfg.rows;

  // 依尺寸切換版面：大尺寸格子變少變大，套上 size-large 讓圖示/姓名字級跟著放大
  posterEl.classList.toggle('size-large', stickerSize === 'large');
  gridEl.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
  gridEl.style.gridTemplateRows = `repeat(${cfg.rows}, 1fr)`;

  // 固定填滿格數；選擇的品項不足格數就從頭輪迴重複，直到填滿
  const slots = buildStickerItemSlots(items, slotCount);

  const imgChecks = [];

  slots.forEach(item => {
    const cell = document.createElement('div');
    cell.className = 'sticker-cell';

    const iconRaw = String(item['圖示'] || '').trim();
    const iconWrap = document.createElement('div');
    if (isValidUrl(iconRaw)) {
      iconWrap.className = 'sticker-icon-wrap';
      const img = document.createElement('img');
      img.src = iconRaw;
      iconWrap.appendChild(img);
      imgChecks.push(preloadImage(iconRaw).then(res => {
        if (!res.ok) {
          iconWrap.className = 'sticker-icon-wrap emoji';
          iconWrap.textContent = '🎒';
          return;
        }
        // 依格子實際「寬 x 高」（不是假設正方形）+ 圖片原始長寬比，手動算出等比縮放後的寬高，
        // 避免截圖工具對 object-fit / aspect-ratio 支援不穩定造成圖片被裁掉或跑版
        const boxW = iconWrap.getBoundingClientRect().width || iconWrap.offsetWidth || 0;
        const boxH = iconWrap.getBoundingClientRect().height || iconWrap.offsetHeight || 0;
        if (boxW && boxH && res.w && res.h) {
          const fitScale = Math.min(boxW / res.w, boxH / res.h);
          img.style.width = (res.w * fitScale) + 'px';
          img.style.height = (res.h * fitScale) + 'px';
        }
      }));
    } else {
      iconWrap.className = 'sticker-icon-wrap emoji';
      iconWrap.textContent = iconRaw || '🎒';
    }
    cell.appendChild(iconWrap);

    const nameEl = document.createElement('div');
    nameEl.className = 'sticker-name';
    nameEl.textContent = name;
    cell.appendChild(nameEl);

    gridEl.appendChild(cell);
  });

  await Promise.all(imgChecks);
  return true;
}

async function generateNameStickerImage() {
  const nameInput = document.getElementById('stickerNameInput');
  const name = nameInput.value.trim();
  if (!name) {
    alert('請先輸入姓名喔');
    nameInput.focus();
    return;
  }

  const btn = document.getElementById('stickerGenerateConfirmBtn');
  const originalBtnText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '圖片產生中…';
  let step = '準備清單';
  let cloneMs = null;

  try {
    await withWatchdog((async () => {
      step = '載入截圖工具';
      await ensureHtml2Canvas();

      const hasItems = await buildStickerPoster(name);
      if (!hasItems) {
        alert('目前清單上沒有項目可以產生圖片唷（可能都被移除了），可以到「已移除的項目」加回來看看 🎒');
        return;
      }

      // 等字體 / 版面穩定
      await new Promise(r => setTimeout(r, 150));

      step = '截圖排版 - 複製畫面（html2canvas clone）';
      const posterEl = document.getElementById('stickerPoster');
      // 卡住的 bug 已經用「複製到獨立乾淨 iframe 再截圖」解決了，不再需要為了排錯
      // 把 scale 壓到 1（那樣列印出來解析度太低、連文字都會糊），調回正常列印品質
      const outputScale = 3;
      // 明確指定寬高（樣板本身就是固定 384x576），不要讓 html2canvas 自己去量測 DOM 尺寸——
      // 後台食譜貼文產生器同樣用 html2canvas 但一律傳明確寬高，測試下來很穩定
      const cloneStartedAt = Date.now();
      const capturedCanvas = await captureInIsolatedFrame(posterEl, {
        width: 384,
        height: 576,
        scale: outputScale,
        backgroundColor: '#ffffff',
        useCORS: true,
        imageTimeout: 8000,
        onclone: () => {
          cloneMs = Date.now() - cloneStartedAt;
          step = '截圖排版 - 畫面繪製（html2canvas render）';
        }
      });

      // 4x6 明信片尺寸（384 x 576，跟樣板寬度一致）＊輸出倍率，白底（大小尺寸的實際成品紙張大小相同，只是格數不同）
      const targetW = 384 * outputScale;
      const targetH = 576 * outputScale;

      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = targetW;
      finalCanvas.height = targetH;
      const ctx = finalCanvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, targetW, targetH);

      // 項目太多、內容比 4x6 還高的話，整張等比例縮小塞進畫布裡；
      // 內容沒那麼高的話就置中貼上，維持輸出永遠是標準 4x6 尺寸
      const fitScale = Math.min(1, targetH / capturedCanvas.height, targetW / capturedCanvas.width);
      const drawW = capturedCanvas.width * fitScale;
      const drawH = capturedCanvas.height * fitScale;
      const dx = (targetW - drawW) / 2;
      const dy = (targetH - drawH) / 2;
      ctx.drawImage(capturedCanvas, dx, dy, drawW, drawH);

      step = '轉檔（canvas.toBlob）';
      const blob = await canvasToBlobAsync(finalCanvas);
      if (!blob) {
        alert('圖片產生失敗，請再試一次');
        return;
      }
      step = '下載圖片';
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const now = new Date();
      const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
      const sizeLabel = stickerSize === 'large' ? '大' : '小';
      a.href = url;
      a.download = `姓名貼_${sizeLabel}_${name}_${stamp}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      closeModal('stickerNameModal');
    })(), 40000);
  } catch (err) {
    console.error(err);
    if (err && err.message === 'WATCHDOG_TIMEOUT') {
      alert(`圖片產生逾時了（卡在「${step}」這一步），可能是網路不穩或這台裝置暫時卡住，請再試一次；如果一直發生，麻煩把這個訊息截圖給我們 🙏\n\n${collectDiagnostics(cloneMs)}`);
    } else {
      alert('圖片產生失敗，請再試一次');
    }
  } finally {
    btn.disabled = false;
    btn.textContent = originalBtnText;
  }
}

document.getElementById('generateA4Btn').addEventListener('click', generateA4Image);
document.getElementById('openStickerModalBtn').addEventListener('click', () => {
  const nameInput = document.getElementById('stickerNameInput');
  nameInput.value = '';
  stickerSize = 'small';
  document.querySelectorAll('#stickerSizeSelect .sticker-size-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.size === 'small');
  });
  document.getElementById('stickerNameModal').classList.add('show');
  setTimeout(() => nameInput.focus(), 100);
});
document.querySelectorAll('#stickerSizeSelect .sticker-size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    stickerSize = btn.dataset.size;
    document.querySelectorAll('#stickerSizeSelect .sticker-size-btn').forEach(b => {
      b.classList.toggle('active', b === btn);
    });
  });
});
document.getElementById('stickerGenerateConfirmBtn').addEventListener('click', generateNameStickerImage);
document.getElementById('stickerNameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') generateNameStickerImage();
});
document.getElementById('backToHome').addEventListener('click', () => { window.location.href = 'recipes.html'; });

loadAll();
</script>
