<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBF6F0">
<title>旅遊行程｜雪莉與朵栗</title>
<link rel="apple-touch-icon" href="icons/site-apple-touch-v2.png">
<link rel="icon" type="image/png" href="icons/site-192-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<style>
  /* 員工旅遊「成品頁」（2026-10-14）：行程資料＝trip-expense.html 排行程那份（只讀）；
     航班＋準備清單另存 trip_extra_<trip>（航班在編輯頁改、準備清單在這頁打勾／新增）。
     版面參考雪莉交件匣「旅遊網站參考」：頂列 航班｜行程｜準備，往下滑依序出現。
     色系 2026-10-14 雪莉選 A（藕粉奶茶・柔線），?palette=b|c|d 仍可預覽其他三款。
     2026-10-22 起這頁可直接編輯：頂列「編輯」→ 每區塊鉛筆＋小視窗（行程點／標題日期／頁首插畫→trip_ledger_<trip>，航班／住宿／準備→trip_extra_<trip>）；
     頁首插畫 12 款來自 trip-hero.js（新 repo scripts/gen-trip-heroes.mjs 產生，勿手改）；雲端合併存檔函式與 trip-expense.html 逐字相同，兩份要一起改。 */
  :root {
    --bg: #FBF6F0; --ink: #6E5852; --soft: #8A766E; --muted: #B3A49B;
    --card: #FFFFFF; --pink: #D7A9A8; --pink-bg: #F4E4E1; --yellow: #E9D3A6; --yellow-bg: #F7EEDC;
    --green: #C7CFB4; --green-bg: #ECEFE2; --blue: #C0CDD3; --blue-bg: #E8EEF0; --accent: #B5485A; --link: #A0767A; --line: 3px;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); -webkit-tap-highlight-color: transparent;
    font-family: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  body { padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  a { color: inherit; }
  svg { display: block; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  /* 頂列 */
  .nav { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: var(--line) solid var(--ink); }
  .nav .wrap { display: flex; align-items: center; justify-content: space-between; height: var(--nav-h); gap: 8px; }
  .navl { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .nav .logo { width: 52px; height: 34px; flex: 0 0 auto; }
  .back { display: inline-flex; align-items: center; gap: 1px; text-decoration: none; font-size: .9rem; padding: 5px 11px 5px 5px; border: var(--line) solid var(--ink); border-radius: 999px; background: var(--card); white-space: nowrap; }
  .back svg { width: 17px; height: 17px; }
  .nav .links { display: flex; gap: 2px; }
  .nav .links a { text-decoration: none; font-size: .98rem; padding: 6px 10px; border-radius: 999px; border: var(--line) solid transparent; white-space: nowrap; }
  .nav .links a.on { background: var(--pink); border-color: var(--ink); }

  /* 主視覺 */
  .hero { border: var(--line) solid var(--ink); border-top: none; border-radius: 0 0 34px 34px; overflow: hidden; background: var(--card); margin: 0 -16px; }
  .hero svg { width: 100%; height: auto; }
  .title { text-align: center; margin: 22px 0 6px; font-size: clamp(2rem, 10vw, 2.8rem); letter-spacing: .12em; font-weight: 400; }
  .range { text-align: center; color: var(--soft); font-size: 1.05rem; letter-spacing: .04em; }
  .count { display: flex; justify-content: center; margin: 18px 0 8px; }
  .count span { background: var(--yellow); border: var(--line) solid var(--ink); border-radius: 999px; padding: 8px 26px; font-size: 1rem; }
  .count b { font-size: 1.7rem; font-weight: 400; margin: 0 6px; vertical-align: -2px; }

  section { scroll-margin-top: calc(var(--nav-h) + 8px); }
  .sec-h { display: flex; align-items: center; gap: 14px; margin: 44px 0 20px; font-size: 1.6rem; }
  .sec-h .ic { width: 52px; height: 52px; border-radius: 50%; border: var(--line) solid var(--ink); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .sec-h .ic svg { width: 28px; height: 28px; }
  .sub-h { font-size: 1.15rem; margin: 26px 0 12px; }

  /* 航班 */
  .flight { border: var(--line) solid var(--ink); border-radius: 24px; overflow: hidden; background: var(--card); margin-bottom: 16px; }
  .flight .fh { display: flex; justify-content: space-between; gap: 10px; padding: 10px 18px; border-bottom: var(--line) solid var(--ink); font-size: 1.02rem; }
  .flight .fb { padding: 16px 18px 14px; }
  .flight .row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
  .flight .t { font-size: 2.1rem; letter-spacing: .02em; line-height: 1.1; }
  .flight .mid { text-align: center; color: var(--soft); font-size: .85rem; position: relative; padding-top: 10px; }
  .flight .mid::before { content: ''; position: absolute; left: 0; right: 0; top: 0; border-top: 4px dotted var(--ink); }
  .flight .ap { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; font-size: .95rem; }
  .flight .ap span:last-child { text-align: right; }
  .flight .air { color: var(--soft); font-size: .85rem; margin-top: 10px; }
  .tix { margin-top: 12px; border-top: 3px dotted var(--ink); padding-top: 10px; }
  .tix .tl2 { font-size: .92rem; color: var(--soft); cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; padding: 2px 0; }
  .tix .tl2::-webkit-details-marker { display: none; }
  .tix .chev { width: 9px; height: 9px; border-right: 2.4px solid var(--soft); border-bottom: 2.4px solid var(--soft); transform: rotate(45deg); transition: transform .2s; margin: 0 6px 4px 0; }
  .tix[open] .chev { transform: rotate(-135deg); margin-bottom: -4px; }
  .tix[open] .tl2 { margin-bottom: 6px; }
  .tk { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
  .tk .nm { flex: 1; min-width: 0; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tk button { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 11px; font-size: .82rem; cursor: pointer; white-space: nowrap; }
  .tk button.pri { background: var(--pink); }
  .tk button svg { width: 14px; height: 14px; }
  .tk button:disabled { opacity: .5; }
  .hotel .fh { background: var(--pink); }
  .hotel .hn { font-size: 1.4rem; line-height: 1.3; }
  .hotel .hj { color: var(--soft); font-size: .85rem; margin-top: 2px; }
  .hotel .io { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 4px; }
  .hotel .io div { background: var(--bg); border-radius: 14px; padding: 8px 12px; }
  .hotel .io small { display: block; color: var(--soft); font-size: .78rem; }
  .hotel .io b { font-weight: 400; font-size: 1.25rem; }
  .qrbox { text-align: center; margin: 14px 0 6px; }
  .qrbox img { width: 190px; height: 190px; border: var(--line) solid var(--ink); border-radius: 16px; padding: 8px; background: #fff; cursor: zoom-in; display: block; margin: 0 auto; }
  .qrbox small { display: block; color: var(--soft); font-size: .8rem; margin-top: 6px; }
  .hotel .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 2px dotted var(--muted); font-size: .92rem; }
  .hotel .kv:last-of-type { border-bottom: none; }
  .hotel .kv span:first-child { color: var(--soft); white-space: nowrap; }
  .hotel .kv span:last-child { text-align: right; word-break: break-all; }
  .hotel .code { font-size: 1.15rem; letter-spacing: .06em; }
  .copy { background: none; border: none; color: var(--link); font: inherit; font-size: .78rem; padding: 0 0 0 6px; cursor: pointer; }
  .flight .fn { color: var(--accent); font-size: .92rem; margin-top: 8px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }

  /* 日期軌道（電車沿軌道開到選中的那天；捲動時黏在頂列下方） */
  .stepper { position: sticky; top: calc(var(--nav-h) + var(--line)); z-index: 20; background: var(--bg); margin: 0 -16px; padding: 6px 16px 8px; }
  .track { position: relative; height: 46px; }
  .rail { position: absolute; top: 40px; height: var(--line); background: var(--ink); }
  .sleepers { position: absolute; top: calc(40px + var(--line)); height: 5px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 12px); opacity: .45; }
  .train { position: absolute; top: 2px; left: 0; width: 64px; height: 40px; transform: translateX(-50%); transition: left .9s cubic-bezier(.45,.05,.3,1); z-index: 2; pointer-events: none; }
  .train svg { width: 64px; height: 40px; transition: transform .2s; }
  .train.flip svg { transform: scaleX(-1); }
  .train.moving svg { animation: bob .18s ease-in-out infinite alternate; }
  .train.flip.moving svg { animation-name: bobflip; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2px); } }
  @keyframes bobflip { from { transform: scaleX(-1) translateY(0); } to { transform: scaleX(-1) translateY(-2px); } }
  .steps { display: grid; position: relative; margin-top: -14px; }
  .step { background: none; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .step .dot { width: 22px; height: 22px; border-radius: 50%; border: var(--line) solid var(--ink); background: var(--card); position: relative; z-index: 1; }
  .step .md { font-size: 1.1rem; padding: 1px 9px; border-radius: 999px; white-space: nowrap; margin-top: 6px; transition: background .3s; }
  .step.on .md { background: var(--pink); }
  .step .wd { font-size: .8rem; color: var(--soft); margin-top: 1px; }
  .steps.dense .step .md { font-size: .92rem; padding: 1px 5px; }

  /* 當日卡 */
  #day { touch-action: pan-y; }
  .daycard { display: flex; gap: 16px; align-items: center; border: var(--line) solid var(--ink); border-radius: 26px; padding: 16px; margin: 16px 0 24px; }
  .daycard .pic { flex: 0 0 96px; height: 74px; border: var(--line) solid var(--ink); border-radius: 16px; overflow: hidden; background: var(--card); }
  .daycard .pic svg { width: 100%; height: 100%; }
  .daycard > div:last-child { min-width: 0; }
  .daycard .dn { color: var(--soft); font-size: .95rem; }
  .daycard .dt { font-size: 1.25rem; line-height: 1.35; margin: 2px 0 4px; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .daycard .ds { color: var(--soft); font-size: .92rem; }

  /* 時間軸 */
  .ev { display: grid; grid-template-columns: 54px 22px 1fr; column-gap: 8px; position: relative; padding-bottom: 18px; }
  .ev::before { content: ''; position: absolute; left: 70px; top: 22px; bottom: -4px; border-left: 3px dotted var(--ink); }
  .ev:last-child::before { display: none; }
  .ev .tm { text-align: right; font-size: 1rem; padding-top: 12px; white-space: nowrap; }
  .ev .nd { width: 20px; height: 20px; border-radius: 50%; border: var(--line) solid var(--ink); background: var(--bg); margin-top: 12px; position: relative; z-index: 1; }
  .ev .bd { min-width: 0; }
  .move { padding-top: 8px; font-size: 1.02rem; line-height: 1.5; }
  .pill { display: inline-flex; align-items: center; gap: 5px; border: var(--line) solid var(--ink); border-radius: 999px; padding: 1px 12px; margin-right: 8px; font-size: .92rem; vertical-align: 1px; }
  .pill svg { width: 16px; height: 16px; }
  .box { background: var(--card); border: var(--line) solid var(--ink); border-radius: 20px; padding: 13px 16px; }
  .box .n { font-size: 1.15rem; line-height: 1.4; display: inline; background: linear-gradient(transparent 86%, var(--blue) 86%); word-break: break-word; }
  .box .tag { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; border-radius: 999px; padding: 1px 9px; margin-left: 6px; border: 2px solid var(--ink); vertical-align: 3px; }
  .box .tag svg { width: 12px; height: 12px; }
  .sub { color: var(--soft); font-size: .92rem; margin-top: 6px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .sub a { color: var(--link); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .acts a { display: inline-flex; align-items: center; gap: 5px; text-decoration: none; font-size: .85rem; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; background: var(--bg); max-width: 100%; }
  .acts a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts a svg { width: 15px; height: 15px; flex: 0 0 auto; }
  .who { color: var(--muted); font-size: .78rem; margin-top: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .swipehint { text-align: center; color: var(--muted); font-size: .8rem; margin: 6px 0 0; }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .pager button { flex: 1; background: var(--card); border: var(--line) solid var(--ink); border-radius: 999px; padding: 10px; cursor: pointer; }
  .pager button:disabled { opacity: .3; cursor: default; }

  /* 準備 */
  .panel { background: var(--card); border: var(--line) solid var(--ink); border-radius: 24px; padding: 16px 18px; margin-bottom: 16px; }
  .cat-tabs { display: flex; gap: 6px; margin: 0 0 8px; padding: 4px; background: var(--bg); border-radius: 999px; }
  .cat-tabs button { flex: 1; background: none; border: 2px solid transparent; border-radius: 999px; padding: 6px 4px; font-size: .92rem; cursor: pointer; white-space: nowrap; }
  .cat-tabs button.on { background: var(--pink); border-color: var(--ink); }
  .cat-tabs small { margin-left: 3px; color: var(--soft); font-size: .72rem; }
  .cat-list { touch-action: pan-y; min-height: 40px; }
  .who-seg { display: flex; gap: 10px; justify-content: center; margin: 0 0 16px; }
  .who-seg button { flex: 1; max-width: 180px; background: var(--card); border: var(--line) solid var(--ink); border-radius: 999px; padding: 9px 12px; font-size: 1.05rem; cursor: pointer; }
  .who-seg button.on { background: var(--pink); }
  .who-seg small { margin-left: 6px; color: var(--soft); font-size: .78rem; }
  .panel h3 { margin: 0 0 10px; font-weight: 400; font-size: 1.15rem; display: flex; justify-content: space-between; align-items: baseline; }
  .panel h3 small { color: var(--muted); font-size: .82rem; }
  .ck { display: flex; align-items: flex-start; gap: 12px; padding: 7px 0; }
  .ck input { position: absolute; opacity: 0; pointer-events: none; }
  .ck .box2 { flex: 0 0 auto; width: 24px; height: 24px; border: var(--line) solid var(--ink); border-radius: 7px; background: var(--card); display: flex; align-items: center; justify-content: center; margin-top: 1px; cursor: pointer; }
  .ck .box2 svg { width: 16px; height: 16px; opacity: 0; color: var(--card); }
  .ck.done .box2 { background: var(--green); }
  .ck.done .box2 svg { opacity: 1; color: var(--ink); }
  .ck .tx { flex: 1; min-width: 0; font-size: 1.02rem; line-height: 1.5; word-break: break-word; cursor: pointer; }
  .ck.done .tx { text-decoration: line-through; color: var(--muted); }
  .ck .by { display: block; font-size: .75rem; color: var(--muted); text-decoration: none; }
  /* 綁品牌選擇器（bp*，與 trip-expense.html 同一份邏輯） */
  .bp-box { position: relative; }
  .bp-cur { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .bp-cur:empty { display: none; }
  .bp-in { width: 100%; font: inherit; font-size: 16px; padding: 9px 11px; border: 2px solid var(--ink); border-radius: 12px; background: var(--card); color: var(--ink); -webkit-appearance: none; appearance: none; }
  .bp-in::-webkit-search-cancel-button { -webkit-appearance: none; }
  .bp-list { position: absolute; left: 0; right: 0; z-index: 6; margin-top: 4px; max-height: 220px; overflow-y: auto; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; }
  .bp-list[hidden] { display: none; }
  #bpOverlay .bp-list { position: static; max-height: 38vh; }   /* 小視窗本身會捲動，清單改成跟著內容走才不會被裁掉 */
  .bp-opt { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: none; background: none; font: inherit; font-size: .92rem; color: var(--ink); text-align: left; cursor: pointer; }
  .bp-opt:hover { background: var(--pink-bg); }
  .bp-opt img, .bp-ph { width: 24px; height: 24px; object-fit: contain; flex: none; }
  .bp-empty { padding: 10px 12px; font-size: .85rem; color: var(--soft); }
  .bp-tag { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; color: var(--soft); background: var(--pink-bg); border-radius: 999px; padding: 2px 9px 2px 3px; margin-top: 3px; max-width: 100%; vertical-align: middle; }
  .bp-tag img { width: 18px; height: 18px; object-fit: contain; flex: none; }
  .bp-tag span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bp-cur .bp-tag { margin-top: 0; }
  .bp-clear { display: inline-flex; align-items: center; gap: 3px; border: none; background: none; color: var(--muted); font: inherit; font-size: .8rem; cursor: pointer; padding: 2px 4px; }
  .bp-clear svg { width: 12px; height: 12px; }
  .bp-open { color: var(--muted); }
  .bp-open svg { width: 17px; height: 17px; }
  .bp-open.on { color: var(--accent); }
  .bp-sheet-hint { font-size: .8rem; color: var(--soft); margin: 4px 0 10px; line-height: 1.5; }
  .x-btn { background: none; border: none; color: var(--muted); padding: 2px 4px; cursor: pointer; flex: 0 0 auto; }
  .x-btn svg { width: 16px; height: 16px; }
  .addrow { display: flex; gap: 8px; margin-top: 10px; }
  .addrow input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 12px; background: var(--bg); color: var(--ink); }
  .addrow button { background: var(--pink); border: var(--line) solid var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer; white-space: nowrap; }
  .stay { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 3px dotted var(--ink); }
  .stay:last-child { border-bottom: none; }
  .stay .sd { color: var(--soft); white-space: nowrap; font-size: .92rem; }
  .stay .sp { display: block; color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .savemsg { text-align: center; color: var(--muted); font-size: .8rem; min-height: 1.2em; }
  .savemsg.err { color: var(--accent); }

  /* 相簿 */
  .pgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pgrid img { width: 100%; aspect-ratio: 1; object-fit: cover; border: var(--line) solid var(--ink); border-radius: 14px; display: block; background: var(--card); cursor: zoom-in; }
  .lb { position: fixed; inset: 0; background: rgba(30,25,22,.92); z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
  .lb.on { display: flex; }
  .lb img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
  .lb .cap { color: #fff; margin-top: 12px; font-size: .95rem; text-align: center; }

  .foot { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 40px; }
  .foot a { color: var(--soft); }

  /* 登入 */
  .login { max-width: 360px; margin: 60px auto; padding: 24px; background: var(--card); border: var(--line) solid var(--ink); border-radius: 24px; display: none; }
  .login h2 { margin: 0 0 6px; font-weight: 400; }
  .login p { color: var(--soft); font-size: .9rem; margin: 0 0 16px; }
  .login input { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 12px; margin-bottom: 10px; background: var(--bg); }
  .login button { width: 100%; padding: 11px; border-radius: 999px; border: var(--line) solid var(--ink); background: var(--pink); cursor: pointer; }
  .login .err { color: var(--accent); font-size: .85rem; min-height: 1.2em; margin-top: 6px; }
  .status { text-align: center; color: var(--muted); padding: 60px 0; }

  /* 日幣計算機 */
  /* 計算機按鈕放頂列最右邊（2026-10-15 雪莉：放下面會擋） */
  .calc-fab { flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--ink); background: var(--yellow); color: var(--ink); font-size: 1.05rem; line-height: 1; cursor: pointer; padding: 0; margin-left: 2px; }
  .nav-r { display: flex; align-items: center; gap: 4px; }
  .navl { flex-shrink: 0; }
  .calc-sheet { position: fixed; inset: 0; z-index: 60; background: rgba(40,30,26,.35); display: none; align-items: flex-end; justify-content: center; }
  .calc-sheet.on { display: flex; }
  .calc-panel { width: 100%; max-width: 480px; background: var(--bg); border: var(--line) solid var(--ink); border-bottom: none; border-radius: 26px 26px 0 0; padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }

  return String(text == null ? '' : text)
    .replace(/[⬇⬆➡⬅↗↘↙↖🔽🔼]\uFE0F?/gu, m => EMOJI_ARROWS[m.replace(/\uFE0F/g, '')] || '')
    .replace(/[\p{Extended_Pictographic}\u{1F1E6}-\u{1F1FF}\u{1F3FB}-\u{1F3FF}]/gu, '')
    .replace(/[\uFE0F\u200D\u20E3]/g, '')
    .replace(/[ \t]{2,}/g, ' ').replace(/^[ \t]+/gm, '');
}
function linkify(text) {
  return esc(noEmoji(text)).replace(/https?:\/\/[^\s<]+/g, u => '<a href="' + u + '" target="_blank" rel="noopener">' + (u.length > 38 ? u.slice(0, 36) + '…' : u) + '</a>');
}
function planSort(a, b) {
  if (a.time && b.time && a.time !== b.time) return a.time < b.time ? -1 : 1;
  if (a.time && !b.time) return -1;
  if (!a.time && b.time) return 1;
  return (a.at || 0) - (b.at || 0);
}
function thumbUrl(path, w) { return RENDER_BASE + path + '?width=' + (w || 360) + '&resize=contain&quality=70'; }
async function apiPost(type, payload) {
  const res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ type, token: getToken() }, payload || {})) });
  return res.json();
}

/* ---------- 綁品牌選擇器 bp*（trip.html 與 trip-expense.html 各放一份逐字相同的複本，改一處要兩處一起改） ----------
   存的值＝品牌 uuid（brandId）；範本發布後粉絲版行程頁會自動帶該品牌的開團狀態。
   品牌清單：POST trip-brand-choices（僅需登入；id／name／thumbUrl），開站載一次、記在記憶體。 */
const BP_UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const BP_TAG_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg>';
const BP_X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const BP = { brands: [], map: new Map(), state: 'idle', cbs: [] };   // state: idle | loading | ok | fail
function bpUuidOrNull(v) { v = typeof v === 'string' ? v.trim() : ''; return BP_UUID_RE.test(v) ? v.toLowerCase() : null; }
function bpLoad(cb, retry) {
  if (cb) BP.cbs.push(cb);
  if (BP.state === 'loading' || BP.state === 'ok') return;
  if (BP.state === 'fail' && !retry) return;
  const tk = getToken();
  if (!tk) { BP.state = 'idle'; return; }
  BP.state = 'loading';
  fetch(API, { method: 'POST', body: JSON.stringify({ type: 'trip-brand-choices', token: tk }) }).then(r => r.json()).then(r => {
    if (r && r.success === true && Array.isArray(r.brands)) {
      BP.brands = r.brands.map(b => ({ id: bpUuidOrNull(b && b.id), name: String((b && b.name) || '').slice(0, 60), thumbUrl: /^https?:\/\//i.test(String((b && b.thumbUrl) || '')) ? String(b.thumbUrl) : '' })).filter(b => b.id && b.name);
      BP.map = new Map(BP.brands.map(b => [b.id, b]));
      BP.state = 'ok';
    } else BP.state = 'fail';
  }).catch(() => { BP.state = 'fail'; }).then(() => { BP.cbs.splice(0).forEach(fn => { try { fn(); } catch (e) {} }); });
}
// 清單列上的小標：品牌小圖＋名稱；沒綁或品牌清單還沒載入回空字串
function bpTagHtml(id) {
  const b = id ? BP.map.get(id) : null;
  if (!b) return '';
  return '<span class="bp-tag">' + (b.thumbUrl ? '<img src="' + esc(b.thumbUrl) + '" alt="" loading="lazy">' : '') + '<span>' + esc(b.name) + '</span></span>';
}
function bpRenderCur(host) {
  const v = host._bp.value, cur = host.querySelector('.bp-cur');
  if (!v) { cur.innerHTML = ''; return; }
  const b = BP.map.get(v);
  cur.innerHTML = (b ? bpTagHtml(v) : '<span class="bp-tag"><span>（已綁定的品牌）</span></span>') +
    '<button type="button" class="bp-clear" aria-label="清除品牌">' + BP_X_ICON + '清除</button>';
}
function bpRenderList(host) {
  const list = host.querySelector('.bp-list'), q = host.querySelector('.bp-in').value.trim().toLowerCase();
  if (BP.state === 'loading' || BP.state === 'idle') { list.innerHTML = '<div class="bp-empty">品牌清單載入中…</div>'; return; }
  if (BP.state === 'fail') { list.innerHTML = '<div class="bp-empty">品牌清單載入失敗，請重新整理或重新登入</div>'; return; }
  const hit = (q ? BP.brands.filter(b => b.name.toLowerCase().includes(q)) : BP.brands).slice(0, 60);
  list.innerHTML = hit.length ? hit.map(b => '<button type="button" class="bp-opt" data-bid="' + esc(b.id) + '">' + (b.thumbUrl ? '<img src="' + esc(b.thumbUrl) + '" alt="" loading="lazy">' : '<span class="bp-ph"></span>') + '<span>' + esc(b.name) + '</span></button>').join('') : '<div class="bp-empty">沒有符合的品牌</div>';
}
// 在 host 元素裡建選擇器：input(type=search) 打字過濾、點選取用、已選顯示小圖＋名稱＋✕ 清除
function bpMount(host, value, onChange) {
  host._bp = { value: bpUuidOrNull(value) };
  host.classList.add('bp-box');
  const inId = (host.id || ('bp' + Math.random().toString(36).slice(2, 7))) + 'In';
  host.innerHTML = '<div class="bp-cur"></div><input type="search" class="bp-in" id="' + inId + '" placeholder="搜尋品牌名稱…" autocomplete="off" maxlength="40"><div class="bp-list" hidden></div>';
  const inp = host.querySelector('.bp-in'), list = host.querySelector('.bp-list');
  const pick = id => {
    host._bp.value = id; inp.value = ''; list.hidden = true;
    bpRenderCur(host);
    if (onChange) onChange(id);
  };
  const show = () => { bpRenderList(host); list.hidden = false; };
  inp.addEventListener('focus', () => { if (BP.state === 'fail') bpLoad(() => { if (!list.hidden) bpRenderList(host); }, true); show(); });
  inp.addEventListener('input', show);
  inp.addEventListener('blur', () => { list.hidden = true; });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Escape') { list.hidden = true; return; }
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); const first = list.querySelector('[data-bid]'); if (first) pick(first.dataset.bid); }
  });
  list.addEventListener('mousedown', e => e.preventDefault());   // 點選項時不要先觸發 input blur 把清單收掉
  list.addEventListener('click', e => { const o = e.target.closest('[data-bid]'); if (o) pick(o.dataset.bid); });
  host.querySelector('.bp-cur').addEventListener('click', e => { if (e.target.closest('.bp-clear')) pick(null); });
  bpRenderCur(host);
  bpLoad(() => { if (host.isConnected) { bpRenderCur(host); if (!list.hidden) bpRenderList(host); } });
}
function bpGet(host) { return host && host._bp ? host._bp.value : null; }

/* ---------- 資料 ---------- */
let DATA = null, DAYS = [], CUR = 0;
let EXTRA = { v: 1, flights: [], hotels: [], prep: [] };
let EXTRA_DIRTY = false;   // 本機有還沒存上去的航班／住宿／準備清單變更
function clean(raw) {
  const s = raw || {};
  const plan = (Array.isArray(s.plan) ? s.plan : []).filter(p => p && p.id && !p.del).map(p => ({
    id: String(p.id), date: isoOk(p.date) ? p.date : '', time: /^\d{2}:\d{2}$/.test(p.time || '') ? p.time : '',
    cat: CAT[p.cat] ? p.cat : 'other', title: String(p.title || ''), place: String(p.place || ''),
    url: safeUrl(p.url), note: String(p.note || ''), brandId: bpUuidOrNull(p.brandId), by: String(p.by || ''), at: Number(p.at) || 0,
  }));
  const photos = [];
  for (const p of (Array.isArray(s.photos) ? s.photos : [])) if (p && !p.del && PATH_RE.test(p.path || '')) photos.push({ date: p.date || '', path: p.path, caption: p.caption || '', at: p.at || 0 });
  photos.sort((a, b) => (a.date + String(a.at).padStart(15, '0')).localeCompare(b.date + String(b.at).padStart(15, '0')));
  return { title: String(s.title || '我們的旅行'), hero: typeof s.hero === 'string' ? s.hero : '', start: isoOk(s.start) ? s.start : '', end: isoOk(s.end) ? s.end : '', plan, photos };
}
function cleanExtra(raw) {
  const s = raw && typeof raw === 'object' ? raw : {};
  return {
    v: 1,
    flights: (Array.isArray(s.flights) ? s.flights : []).filter(f => f && f.id),
    hotels: (Array.isArray(s.hotels) ? s.hotels : []).filter(h => h && h.id),
    prep: (Array.isArray(s.prep) ? s.prep : []).filter(p => p && p.id).map(p => ({
      id: String(p.id), group: p.group === 'buy' ? 'buy' : 'todo', owner: String(p.owner || '').slice(0, 20), cat: PREP_CAT_MAP[p.cat] ? p.cat : 'key', ord: Number.isFinite(p.ord) ? p.ord : null, text: String(p.text || '').slice(0, 80),
      brandId: bpUuidOrNull(p.brandId),
      done: !!p.done, by: String(p.by || '').slice(0, 20), at: Number(p.at) || 0, del: !!p.del,
    })),
  };
}
function buildDays(d) {
  // 有設定出發～回程就用；沒設定就用行程與航班裡出現的日期範圍
  const dated = d.plan.map(p => p.date).concat(liveFlights().map(f => f.date)).filter(isoOk).sort();
  let start = d.start || dated[0] || '', end = d.end && d.end >= start ? d.end : (dated[dated.length - 1] || start);
  if (dated.length && dated[dated.length - 1] > end) end = dated[dated.length - 1];
  if (!start) return [];
  const out = [];
  for (let t = toDate(start); isoOf(t) <= end && out.length < 31; t.setDate(t.getDate() + 1)) out.push(isoOf(t));
  return out;
}
function liveFlights() {
  return EXTRA.flights.filter(f => !f.del).sort((a, b) => ((a.date || '') + (a.dep || '')).localeCompare((b.date || '') + (b.dep || '')));
}

/* ---------- 行程雲端合併存檔（編輯模式用，key＝trip_ledger_<trip>） ----------
   下面 COMPANY…loadRemote 的同名函式與 trip-expense.html 逐字相同（兩份要一起改）：
   先 setting-get 最新 → 依 id 合併（同 id 取 at 較新）→ 刪除留墓碑 → setting-set。
   航班／住宿／準備清單存另一把 trip_extra_<trip>（見 queueSave）。 */
const COMPANY = '公司';
const MAX_ITEM_PHOTOS = 12;
const CAT_MAP = { food: 1, transport: 1, fun: 1, shop: 1, stay: 1, other: 1 };   // 記帳分類 id（normalize 只用到鍵名）
const PCAT_MAP = CAT;                                                            // 行程類型 id（交通／景點／美食／住宿／購物／其他）
// 分攤設定 {mode:'even'|'custom'|'none', among:[名字], amounts:{名字:金額}}；舊資料沒這欄＝全員均分
function cleanSplit(raw) {
  const sp = raw && typeof raw === 'object' ? raw : {};
  const mode = sp.mode === 'custom' || sp.mode === 'none' ? sp.mode : 'even';
  const among = (Array.isArray(sp.among) ? sp.among : []).map(n => String(n || '').trim().slice(0, 20)).filter(Boolean).slice(0, 30);
  const amounts = {};
  for (const [k, v] of Object.entries(sp.amounts && typeof sp.amounts === 'object' ? sp.amounts : {})) {
    const n = String(k).trim().slice(0, 20); const a = Number(v);
    if (n && a > 0) amounts[n] = a;
  }
  return { mode, among, amounts };
}
function cleanPaths(arr) {
  return (Array.isArray(arr) ? arr : []).map(p => String(p || '')).filter(p => PATH_RE.test(p)).slice(0, MAX_ITEM_PHOTOS);
}
function normalize(raw) {
  const s = Object.assign({ v: 1, title: '日本員工旅遊', start: '', end: '', rate: 0.22, metaAt: 0, items: [], photos: [], plan: [], members: [], rates: {}, autoRate: true }, raw || {});
  if (!Array.isArray(s.items)) s.items = [];
  s.members = (Array.isArray(s.members) ? s.members : []).map(m => String(m || '').trim().slice(0, 20)).filter(m => m && m !== COMPANY).filter((m, i, a) => a.indexOf(m) === i).slice(0, 30);
  s.autoRate = s.autoRate !== false;
  const rates = {};
  for (const [k, v] of Object.entries(s.rates && typeof s.rates === 'object' ? s.rates : {})) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Number(v) > 0) rates[k] = Number(v);
  s.rates = rates;
  if (!Array.isArray(s.photos)) s.photos = [];
  if (!Array.isArray(s.plan)) s.plan = [];
  // 行程：{id, date, time 'HH:MM' 或空, cat, title, place, url, note, brandId(品牌 uuid 或 null), by, at, del}
  s.plan = s.plan.filter(p => p && p.id).map(p => ({
    id: String(p.id), date: String(p.date || ''), time: /^\d{2}:\d{2}$/.test(String(p.time || '')) ? String(p.time) : '',
    cat: PCAT_MAP[p.cat] ? p.cat : 'other', title: String(p.title || '').slice(0, 60),
    place: String(p.place || '').slice(0, 100), url: safeUrl(String(p.url || '')), note: String(p.note || '').slice(0, 300), brandId: bpUuidOrNull(p.brandId),
    by: String(p.by || '').slice(0, 20), at: Number(p.at) || 0, del: !!p.del,
  }));
  s.items = s.items.filter(i => i && i.id).map(i => ({
    id: String(i.id), date: String(i.date || ''), cat: CAT_MAP[i.cat] ? i.cat : 'other',
    name: String(i.name || '').slice(0, 60), amount: Number(i.amount) || 0, cur: i.cur === 'TWD' ? 'TWD' : 'JPY',
    payer: String(i.payer || '').slice(0, 20), note: String(i.note || '').slice(0, 100),
    company: Math.max(0, Number(i.company) || 0),
    split: cleanSplit(i.split),
    photos: cleanPaths(i.photos),
    by: String(i.by || '').slice(0, 20), at: Number(i.at) || 0, del: !!i.del,
  }));
  // 隨手拍：一張一筆 {id, date, path, caption, by, at, del}
  s.photos = s.photos.filter(p => p && p.id && (p.del || PATH_RE.test(String(p.path || '')))).map(p => ({
    id: String(p.id), date: String(p.date || ''), path: String(p.path || ''),
    caption: String(p.caption || '').slice(0, 60),
    by: String(p.by || '').slice(0, 20), at: Number(p.at) || 0, del: !!p.del,
  }));
  s.rate = Number(s.rate) || 0;
  s.metaAt = Number(s.metaAt) || 0;
  // 頁首插畫鍵（trip.html 編輯、這頁不改）：根層未知欄位要原封保留，格式不對才丟掉
  if (typeof s.hero !== 'string' || !/^[a-z]{2,20}$/.test(s.hero)) delete s.hero;
  return s;
}
// 依 id 合併兩份清單：同 id 取 at 較大者、只在一邊的都保留、墓碑留 30 天
function mergeList(localList, remoteList) {
  const byId = new Map(remoteList.map(i => [i.id, i]));
  for (const li of localList) {
    const ri = byId.get(li.id);
    if (!ri || (li.at || 0) > (ri.at || 0)) byId.set(li.id, li);
  }
  const cutoff = Date.now() - 30 * 86400000;
  return [...byId.values()].filter(i => !(i.del && i.at < cutoff));
}
function merge(local, remote) {
  const out = normalize(remote);
  // 旅遊名稱／日期／匯率：誰改得晚就用誰的
  if ((local.metaAt || 0) > (out.metaAt || 0)) {
    out.title = local.title; out.start = local.start; out.end = local.end; out.rate = local.rate; out.metaAt = local.metaAt;
    out.members = local.members; out.autoRate = local.autoRate;
    if (local.hero) out.hero = local.hero;
  }
  // 每日匯率：兩邊聯集，同一天雲端那份優先（先抓到的為準，大家算出來一致）
  out.rates = Object.assign({}, local.rates || {}, out.rates || {});
  out.items = mergeList(local.items, out.items);
  out.photos = mergeList(local.photos || [], out.photos);
  out.plan = mergeList(local.plan || [], out.plan);
  return out;
}
async function loadRemote() {
  const res = await apiPost('setting-get', { key: KEY });
  if (res && res.needLogin) return { needLogin: true };
  if (!res || res.success !== true) throw new Error((res && res.error) || '讀取失敗');
  let remote = null;
  if (res.value) { try { remote = JSON.parse(res.value); } catch (e) { remote = null; } }
  return { remote };
}

let LEDGER = null;   // 完整行程資料（與 trip-expense.html 的 STATE 同形狀）；DATA 由它整理出來給畫面用
const LSYNC = { busy: false, dirty: false, unsynced: false, timer: null, retry: null };
function ledgerCacheSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(LEDGER)); } catch (e) {} }
// LEDGER 變動後：重算畫面用的 DATA 與天數，停在原本那天（jumpIso 有值就跳到那天）
function ledgerAdopt(jumpIso) {
  const keep = jumpIso || DAYS[CUR];
  DATA = clean(LEDGER); DAYS = buildDays(DATA);
  CUR = keep && DAYS.includes(keep) ? DAYS.indexOf(keep) : Math.min(CUR, Math.max(DAYS.length - 1, 0));
}
function ledgerCommit(jumpIso) { ledgerAdopt(jumpIso); render(); scheduleLedgerSync(); }
function ledgerSetMeta(patch) { Object.assign(LEDGER, patch, { metaAt: Date.now() }); ledgerCommit(); }
function scheduleLedgerSync() {
  LSYNC.dirty = true; LSYNC.unsynced = true; ledgerCacheSave();
  clearTimeout(LSYNC.timer); clearTimeout(LSYNC.retry);
  LSYNC.timer = setTimeout(runLedgerSync, 400);
}
async function runLedgerSync() {
  if (LSYNC.busy) { LSYNC.dirty = true; return; }
  LSYNC.busy = true; LSYNC.dirty = false;
  edToast('儲存中…');
  try {
    const got = await loadRemote();
    if (got.needLogin) { edToast('登入過期，請重新整理後登入（改的內容先留在這支手機）'); return; }
    LEDGER = merge(LEDGER, got.remote);
    const res = await apiPost('setting-set', { key: KEY, value: JSON.stringify(LEDGER) });
    if (!res || res.success !== true) throw new Error((res && res.error) || '寫入失敗');
    ledgerCacheSave();
    if (!LSYNC.dirty) LSYNC.unsynced = false;
    const before = JSON.stringify(DATA);
    ledgerAdopt();
    if (JSON.stringify(DATA) !== before) render();
    edToast('已儲存');
  } catch (err) {
    edToast('沒存成功（已先存在這支手機，稍後會再試）：' + err.message);
    LSYNC.retry = setTimeout(() => { if (LSYNC.unsynced && !LSYNC.busy) runLedgerSync(); }, 15000);
  } finally {
    LSYNC.busy = false;
    if (LSYNC.dirty) { clearTimeout(LSYNC.timer); LSYNC.timer = setTimeout(runLedgerSync, 400); }
  }
}

/* ---------- 編輯模式的鉛筆與「＋ 新增」鈕（只在 EDIT 時輸出；表單與存檔在檔案最後面的 ed* 函式） ---------- */
let EDIT = false;
const ED_ICON = {
  pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
};
function edPencil(kind, id, cls, label) {
  return EDIT ? '<button type="button" class="ed-pencil' + (cls ? ' ' + cls : '') + '" data-ed="' + kind + '" data-id="' + esc(id || '') + '" aria-label="' + esc(label) + '">' + ED_ICON.pencil + '</button>' : '';
}
function edAddBtn(kind, label, attrs) {
  return EDIT ? '<button type="button" class="ed-add" data-ed-add="' + kind + '"' + (attrs || '') + '>' + ED_ICON.plus + '<span>' + esc(label) + '</span></button>' : '';
}
function heroKey() { const k = DATA && DATA.hero; return window.TRIP_HEROES && window.TRIP_HEROES[k] ? k : 'tokyo'; }


/* ---------- 畫面 ---------- */
function render() {
  const d = DATA;
  document.getElementById('top').innerHTML = (window.TRIP_HEROES ? window.TRIP_HEROES[heroKey()].svg : '') + edPencil('hero', '', 'at-hero', '選擇頁首插畫');
  const tb = document.getElementById('titleBox'); tb.querySelectorAll(':scope > .ed-pencil').forEach(n => n.remove());
  if (EDIT) tb.insertAdjacentHTML('afterbegin', edPencil('meta', '', 'at-title', '編輯標題與日期'));
  document.title = d.title + '｜雪莉與朵栗';
  document.getElementById('tTitle').textContent = d.title;
  const first = DAYS[0], last = DAYS[DAYS.length - 1];
  if (first) {
    document.getElementById('tRange').textContent = toDate(first).getFullYear() + '・' + mdw(first) + ' － ' + mdw(last);
    const today = isoOf(new Date());
    const diff = Math.round((toDate(first) - toDate(today)) / 86400000);
    let html = '';
    if (diff > 0) html = '出發倒數<b>' + diff + '</b>天';
    else if (today <= last) html = '旅程第<b>' + (DAYS.indexOf(today) + 1) + '</b>天';
    else html = '平安回家，旅程完成';
    document.getElementById('tCount').innerHTML = '<span>' + html + '</span>';
  } else {
    document.getElementById('tRange').textContent = '還沒排日期';
    document.getElementById('tCount').innerHTML = '';
  }

// 航班：時區（同一班機起降時間是各自當地時間，算飛行時間要換算）
const TZ = { TPE: 8, TSA: 8, KHH: 8, RMQ: 8, HKG: 8, MFM: 8, NRT: 9, HND: 9, KIX: 9, NGO: 9, FUK: 9, CTS: 9, OKA: 9, SDJ: 9, KMJ: 9, ICN: 9, GMP: 9, PUS: 9, CJU: 9, BKK: 7, DMK: 7, SGN: 7, HAN: 7, SIN: 8, KUL: 8, MNL: 8 };
function apCode(s) { const m = /\b([A-Z]{3})\b/.exec(String(s || '')); return m && TZ[m[1]] != null ? m[1] : ''; }
function flightDuration(f) {
  const a = apCode(f.from), b = apCode(f.to);
  if (!a || !b || !/^\d{2}:\d{2}$/.test(f.dep || '') || !/^\d{2}:\d{2}$/.test(f.arr || '')) return '';
  const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3);
  let m = (toMin(f.arr) - TZ[b] * 60) - (toMin(f.dep) - TZ[a] * 60);
  while (m <= 0) m += 1440;
  return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}
function renderFlights() {
  const list = liveFlights();
  const box = document.getElementById('flightList');
  if (!list.length) { box.innerHTML = '<div class="panel"><div class="empty" style="padding:8px 0">還沒有航班</div></div>' + edAddBtn('flight', '新增航班'); return; }
  const DIR = { out: ['去程', 'var(--blue)'], back: ['回程', 'var(--green)'], other: ['航班', 'var(--yellow)'] };
  box.innerHTML = list.map(f => {
    const dir = DIR[f.dir] || DIR.other;
    const term = (ap, t) => esc([ap, t].filter(Boolean).join(' '));
    const dur = flightDuration(f);
    return '<div class="flight">' + edPencil('flight', f.id, '', '編輯航班') + '<div class="fh" style="background:' + dir[1] + '"><span>' + (isoOk(f.date) ? esc(mdw(f.date)) + ' ' : '') + dir[0] + '</span><span>' + esc(f.flightNo || '') + '</span></div>' +
      '<div class="fb"><div class="row"><span class="t">' + esc(f.dep || '--:--') + '</span><span class="mid">' + esc(dur) + '</span><span class="t">' + esc(f.arr || '--:--') + '</span></div>' +
      '<div class="ap"><span>' + term(f.from, f.fromTerm) + '</span><span>' + term(f.to, f.toTerm) + '</span></div>' +
      (f.airline ? '<div class="air">' + esc(f.airline) + '</div>' : '') +

  }).join('') + edAddBtn('flight', '新增航班');
}

const TICKET_RE = /^trip\/[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+\.(pdf|jpg|jpeg|png|webp)$/;
function ticketsHtml(f) {

async function ticketUrl(path, name) {
  const res = await apiPost('trip-file-url', name ? { path, name } : { path });
  if (res && res.needLogin) throw new Error('登入過期，請重新整理後登入');
  if (!res || res.success !== true || !res.url) throw new Error((res && res.error) || '拿不到檔案');
  return res.url;
}
document.addEventListener('click', async e => {

let MOVE_TIMER = null;
function goDay(i, scroll) {
  if (i < 0 || i >= DAYS.length || i === CUR) return;
  const dir = i > CUR ? 1 : -1;
  CUR = i;
  document.querySelectorAll('#steps .step').forEach((b, k) => b.classList.toggle('on', k === CUR));
  // 電車慢慢開到下一站：往回開時車頭轉向

  train.classList.toggle('flip', dir < 0);
  train.classList.add('moving');
  train.style.left = ((CUR + 0.5) / DAYS.length * 100) + '%';
  clearTimeout(MOVE_TIMER);
  MOVE_TIMER = setTimeout(() => train.classList.remove('moving'), 900);
  renderDay(dir);
  try { history.replaceState(null, '', '#day' + (CUR + 1)); } catch (e) {}
  if (scroll) {
    // 讓當日卡停在黏住的日期軌道正下方
    const st = document.getElementById('stepper');

function mergeById(remote, local) {

}
const SAVE = { busy: false, again: false };
function setSaveMsg(t, err) { const el = document.getElementById('saveMsg'); el.textContent = t || ''; el.className = 'savemsg' + (err ? ' err' : ''); }
async function queueSave() {
  if (SAVE.busy) { SAVE.again = true; return; }
  SAVE.busy = true; setSaveMsg('儲存中…');
  try {
    // 先抓最新版再合併：別人剛勾的、編輯頁剛改的航班都不會被蓋掉
    const got = await apiPost('setting-get', { key: EXTRA_KEY });
    if (got && got.needLogin) { setSaveMsg('登入過期，請重新整理後登入', true); return; }
    if (!got || got.success !== true) throw new Error((got && got.error) || '讀取失敗');
    const raw = got.value ? JSON.parse(got.value) : {};
    const remote = cleanExtra(raw);
    // 以伺服器那份為底只換 prep：航班、住宿與之後加的欄位原封保留
    const merged = Object.assign({}, raw && typeof raw === 'object' ? raw : {}, { v: 1, prep: mergeById(remote.prep, EXTRA.prep), flights: mergeById(remote.flights, EXTRA.flights), hotels: mergeById(remote.hotels, EXTRA.hotels) });
    const res = await apiPost('setting-set', { key: EXTRA_KEY, value: JSON.stringify(merged) });
    if (!res || res.success !== true) throw new Error((res && res.error) || '儲存失敗');
    EXTRA = cleanExtra(merged);
    if (!SAVE.again) EXTRA_DIRTY = false;
    try { localStorage.setItem(LS_EXTRA, JSON.stringify(EXTRA)); } catch (e) {}
    setSaveMsg('已儲存');
    if (EDIT) edToast('已儲存');
    setTimeout(() => { if (!SAVE.busy) setSaveMsg(''); }, 1500);
    renderPrep(); renderFlights(); renderHotels();
  } catch (err) {
    setSaveMsg('沒存成功：' + err.message + '（稍後會再試）', true);
    setTimeout(queueSave, 15000);
  } finally {
    SAVE.busy = false;
    if (SAVE.again) { SAVE.again = false; queueSave(); }
  }
}

/* ---------- 日幣計算機（2026-10-14 雪莉）：右下角「¥」開啟；可連加、加 10% 稅、日圓台幣互換 ----------
   匯率優先用記帳頁每天自動抓的匯率（ledger.rates，最新一天），沒有就即時抓一次市場匯率，再沒有用記帳頁的備用匯率 */
const CALC = { dir: 'jpy', terms: [], cur: '', tax: false, rate: 0, rateNote: '', rateDay: '', live: false };
// 存的匯率不是今天的（今天還沒人開記帳頁）＝開計算機時改抓今日即時匯率（2026-10-16 雪莉：匯率要更新到今天）
function calcToday() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function calcPickRate(raw) {
  if (CALC.live && CALC.rateDay === calcToday()) return;   // 已抓到今日即時匯率就不被舊的蓋回去
  const rates = raw && raw.rates && typeof raw.rates === 'object' ? raw.rates : {};
  const days = Object.keys(rates).filter(k => isoOk(k) && Number(rates[k]) > 0).sort();
  if (days.length) { const d = days[days.length - 1]; CALC.rate = Number(rates[d]); CALC.rateDay = d; CALC.rateNote = (d === calcToday() ? '今日' : md(d)) + ' 匯率'; return; }
  if (raw && Number(raw.rate) > 0 && !CALC.rate) { CALC.rate = Number(raw.rate); CALC.rateNote = '備用匯率'; }
}
async function calcLiveRate() {
  try {
    const j = await fetch('https://open.er-api.com/v6/latest/JPY', { cache: 'no-store' }).then(r => r.json());
    const v = j && j.rates && Number(j.rates.TWD);
    if (v > 0 && v < 1) { CALC.rate = v; CALC.rateDay = calcToday(); CALC.live = true; CALC.rateNote = '今日即時匯率'; renderCalc(); }
  } catch (e) {}
}
function calcFmt(n, cur) { const v = Math.round(n); return (cur === 'TWD' ? 'NT$ ' : '¥ ') + v.toLocaleString('en-US'); }
function calcTotal() {
  const nums = CALC.terms.concat(CALC.cur ? [Number(CALC.cur)] : []);
  const sum = nums.reduce((a, b) => a + b, 0);
  return CALC.tax ? sum * 1.1 : sum;
}
function renderCalc() {
  const from = CALC.dir === 'jpy' ? 'JPY' : 'TWD', to = from === 'JPY' ? 'TWD' : 'JPY';
  const total = calcTotal();
  const r = CALC.rate || 0;
  const conv = !r ? 0 : (from === 'JPY' ? total * r : total / r);
  const expr = CALC.terms.map(n => Math.round(n).toLocaleString('en-US')).concat(CALC.cur ? [Number(CALC.cur).toLocaleString('en-US')] : []).join(' + ');
  document.getElementById('calcExpr').textContent = (expr || '0') + (CALC.tax ? '　＋10% 稅' : '');
  document.getElementById('calcFrom').textContent = calcFmt(total, from);
  document.getElementById('calcTo').textContent = r ? '≈ ' + calcFmt(conv, to) : '匯率讀取中…';
  document.getElementById('calcRate').textContent = r ? '1 日圓 ≈ ' + r.toFixed(4) + ' 台幣（' + CALC.rateNote + '）' : '';
  document.querySelectorAll('#calcSheet [data-dir]').forEach(b => b.classList.toggle('on', b.dataset.dir === CALC.dir));
  document.getElementById('calcTax').classList.toggle('on', CALC.tax);
}
function calcKey(k) {
  if (/^\d+$/.test(k)) { if ((CALC.cur + k).replace(/^0+/, '').length <= 9) CALC.cur = (CALC.cur + k).replace(/^0+(?=\d)/, ''); }
  else if (k === 'back') CALC.cur = CALC.cur.slice(0, -1);
  else if (k === 'clear') { CALC.terms = []; CALC.cur = ''; }
  else if (k === 'plus') { if (CALC.cur) { CALC.terms.push(Number(CALC.cur)); CALC.cur = ''; } }
  renderCalc();
}
function openCalc() {
  if (!CALC.rate || CALC.rateDay !== calcToday()) calcLiveRate();
  renderCalc();
  document.getElementById('calcSheet').classList.add('on');
}
(function initCalc() {
  const keys = [['7', '7'], ['8', '8'], ['9', '9'], ['back', '⌫'], ['4', '4'], ['5', '5'], ['6', '6'], ['clear', 'C'], ['1', '1'], ['2', '2'], ['3', '3'], ['plus', '+'], ['0', '0'], ['00', '00'], ['000', '000'], ['done', '完成']];
  const wrap = document.createElement('div');
  wrap.innerHTML = '' +
    '<div class="calc-sheet" id="calcSheet"><div class="calc-panel">' +
    '<div class="calc-top"><div class="calc-seg"><button type="button" data-dir="jpy">日圓 → 台幣</button><button type="button" data-dir="twd">台幣 → 日圓</button></div>' +
    '<button type="button" class="x-btn" id="calcClose" aria-label="關閉">' + ICON.x + '</button></div>' +
    '<div class="calc-screen"><div class="calc-expr" id="calcExpr"></div><div class="calc-from" id="calcFrom"></div><div class="calc-to" id="calcTo"></div></div>' +
    '<div class="calc-opts"><button type="button" class="calc-tax" id="calcTax">加 10% 消費稅</button><span class="calc-rate" id="calcRate"></span></div>' +
    '<div class="calc-keys">' + keys.map(([k, t]) => '<button type="button" data-k="' + k + '" class="' + (/^\d+$/.test(k) ? '' : 'op') + (k === 'done' ? ' done' : '') + '">' + t + '</button>').join('') + '</div>' +
    '</div></div>';
  document.body.appendChild(wrap);
  document.getElementById('calcFab').onclick = openCalc;
  document.getElementById('calcClose').onclick = () => document.getElementById('calcSheet').classList.remove('on');
  document.getElementById('calcSheet').addEventListener('click', e => {
    if (e.target.id === 'calcSheet') { e.currentTarget.classList.remove('on'); return; }
    const k = e.target.closest('[data-k]'); if (k) { if (k.dataset.k === 'done') document.getElementById('calcSheet').classList.remove('on'); else calcKey(k.dataset.k); return; }
    const d = e.target.closest('[data-dir]'); if (d) { CALC.dir = d.dataset.dir; renderCalc(); return; }
    if (e.target.closest('#calcTax')) { CALC.tax = !CALC.tax; renderCalc(); }
  });
})();

/* ---------- 發布成範本（2026-10-21）：把這趟行程公開成旅遊範本，粉絲可複製成自己的行程 ----------
   後端 trip-template-publish / get / unpublish（calendarEdit 權限）；公開的只有航班／住宿名稱與地址／每日行程／準備清單，
   Check-in 代碼、PIN、記帳、照片後端會剝掉。函式一律 tpl 前綴。 */
const TPL = { template: null, tableReady: true, loaded: false, busy: false, lastFetch: 0 };
const TPL_SLUG_RE = /^[a-z0-9-]{3,40}$/;

function tplErrMsg(r, fallback) {

  return (r && r.error) || fallback;
}
function tplToast(msg) {

function tplDefaultSlug() { return TRIP.toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); }
function tplSlugProblem(s) {

function tplCoverProblem(s) { return !s || safeUrl(s) ? '' : '封面圖網址要以 http:// 或 https:// 開頭'; }

// 登入後、行程載入成功才呼叫；失敗不影響頁面其他功能
async function tplRefresh() {
  if (!getToken() || Date.now() - TPL.lastFetch < 15000) { tplRenderFab(); return; }
  TPL.lastFetch = Date.now();
  try {
    const r = await apiPost('trip-template-get', { sourceKey: KEY });
    if (r && r.tableReady === false) { TPL.template = null; TPL.tableReady = false; }
    else if (tplOk(r)) { TPL.template = r.template || null; TPL.tableReady = true; }
  } catch (e) { /* 讀不到狀態仍顯示按鈕，點開後由後端回應決定 */ }

  h1.textContent = p1 || '範本網址：…/trips/t/' + sl.value.trim(); h1.classList.toggle('bad', !!p1);

async function tplCopyUrl() {

  try { await navigator.clipboard.writeText(url); tplToast('已複製連結'); return; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); tplToast('已複製連結');
  } catch (e) { tplToast('複製失敗，請手動選取網址'); }
}
async function tplPublish(publish) {
  if (TPL.busy) return;
  const errEl = document.getElementById('tplErr'); errEl.textContent = '';
  if (!tplValidate()) { errEl.textContent = document.getElementById('tplTitle').value.trim() ? '請先修正標示紅字的欄位' : '請填標題'; return; }
  const sections = {};
  document.querySelectorAll('#tplSecs input').forEach(i => { sections[i.dataset.sec] = i.checked; });
  const payload = {
    sourceKey: KEY, slug: document.getElementById('tplSlug').value.trim(), title: document.getElementById('tplTitle').value.trim(),
    intro: document.getElementById('tplIntro').value.trim(), coverUrl: document.getElementById('tplCover').value.trim(),
    sections, publish: !!publish,
  };
  tplSetBusy(true);
  try {
    const r = await apiPost('trip-template-publish', payload);
    if (!tplOk(r)) { errEl.textContent = tplErrMsg(r, '儲存失敗'); return; }
    TPL.template = r.template || TPL.template; TPL.tableReady = true; TPL.lastFetch = Date.now();
    tplRenderFab(); tplSyncState();
    const url = (TPL.template && TPL.template.url) || r.url || '';
    tplShowResult(url, publish ? '已發布，範本網址：' : '已更新（未發布），範本網址：');
  } catch (e) { errEl.textContent = '連線失敗：' + e.message; }
  finally { tplSetBusy(false); }
}
async function tplUnpublish() {
  if (TPL.busy || !TPL.template || !TPL.template.id) return;
  if (!confirm('確定要下架這個範本嗎？下架後粉絲看不到，已複製的行程不受影響。')) return;
  const errEl = document.getElementById('tplErr'); errEl.textContent = '';
  tplSetBusy(true);
  try {
    const r = await apiPost('trip-template-unpublish', { id: TPL.template.id });
    if (!tplOk(r)) { errEl.textContent = tplErrMsg(r, '下架失敗'); return; }
    TPL.template = Object.assign({}, TPL.template, r.template || {}, { isPublished: false }); TPL.lastFetch = Date.now();
    tplRenderFab(); tplSyncState();
    document.getElementById('tplOk').classList.remove('on');
    tplToast('已下架');
  } catch (e) { errEl.textContent = '連線失敗：' + e.message; }
  finally { tplSetBusy(false); }
}

/* ---------- 編輯模式（2026-10-22 雪莉定）：畫面維持成品頁長相，每區塊鉛筆 → 小視窗 ----------
   欄位＝trip-expense.html 該區塊的全部欄位（含員工專用私密欄：Check-in 代碼／PIN／訂房編號／線上 Check-in 連結／QR／電子機票）。
   行程點／標題日期／頁首插畫 → trip_ledger_<trip>（ledgerCommit → runLedgerSync，與 trip-expense.html 同一套合併）；

const TICKET_PATH_RE = TICKET_RE;
const FL_DIR_NAME = { out: '去程', back: '回程', other: '其他' };

function cleanFlights(arr) {

    id: String(f.id), dir: FL_DIR_NAME[f.dir] ? f.dir : 'other', date: String(f.date || ''),
    flightNo: String(f.flightNo || '').slice(0, 20), airline: String(f.airline || '').slice(0, 30),
    from: String(f.from || '').slice(0, 30), fromTerm: String(f.fromTerm || '').slice(0, 10),
    to: String(f.to || '').slice(0, 30), toTerm: String(f.toTerm || '').slice(0, 10),
    dep: /^\d{2}:\d{2}$/.test(String(f.dep || '')) ? String(f.dep) : '', arr: /^\d{2}:\d{2}$/.test(String(f.arr || '')) ? String(f.arr) : '',

async function edUploadFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const init = await apiPost('trip-file-upload-url', { trip: TRIP, ext, size: file.size });
  if (init && init.needLogin) throw new Error('請重新整理後登入');
  if (!init || init.success !== true) throw new Error((init && init.error) || '取得上傳網址失敗');

        edTa('備註（選填）', 'edNote', f.note, 'rows="2" maxlength="300" placeholder="例：出發前 2 天網路報到"') +
        '<div class="ed-priv">電子機票存在私有儲存區，登入的人點了才看得到，不會公開。</div>' +
        '<span class="tpl-lb">電子機票</span><div class="ed-files" id="edFiles"></div>' +
        '<button type="button" class="ed-upbtn" id="edUpBtn">上傳電子機票</button><input type="file" id="edFile" accept="application/pdf,image/*" multiple hidden>';
    },
    after() { edRenderTickets(); },
    collect() {
      if (!edVal('edDate')) return { error: '請填日期' };
      if (!edVal('edNo') && !edVal('edFrom') && !edVal('edTo')) return { error: '請至少填航班號或機場' };
      const rec = cleanFlights([Object.assign({}, ED.rec || {}, {
        id: ED.id || uid(), dir: ED.seg.dir, date: edVal('edDate'), flightNo: edVal('edNo'), airline: edVal('edAirline'),
        from: edVal('edFrom'), fromTerm: edVal('edFromTerm'), to: edVal('edTo'), toTerm: edVal('edToTerm'),
        dep: edVal('edDep'), arr: edVal('edArr'), note: edVal('edNote'), at: Date.now(), del: false, tickets: ED.tickets,
      })])[0];
      const origTickets = ED.ticketsOrig;
      return { apply() {
        const i = EXTRA.flights.findIndex(x => x.id === rec.id);
        if (i >= 0) EXTRA.flights[i] = rec; else EXTRA.flights.push(rec);
        const keep = new Set(rec.tickets.map(t => t.path));
        for (const p of origTickets) if (!keep.has(p)) apiPost('trip-file-delete', { path: p }).catch(() => {});
        extraCommit();
      } };
    },
    remove(id) {
      const i = EXTRA.flights.findIndex(x => x.id === id);
      if (i >= 0) EXTRA.flights[i] = Object.assign({}, EXTRA.flights[i], { del: true, at: Date.now() });
      extraCommit();
    },
    confirmText: '確定刪除這個航班？',
  },
  hotel: {
    title: rec => rec ? '編輯住宿' : '新增住宿',
    find: id => (EXTRA.hotels || []).find(x => x.id === id && !x.del),
    canDelete: true,
    html(rec) {
      const h = rec || { name: '', nameJa: '', checkin: '', checkout: '', checkinTime: '', checkoutTime: '', code: '', pin: '', booking: '', room: '', guests: '', address: '', url: '', note: '', qr: '' };
      ED.qr = TICKET_RE.test(h.qr || '') ? h.qr : ''; ED.qrOrig = ED.qr;
      return edIn('住宿名稱', 'edName', 'text', h.name, 'maxlength="60"') +
        edIn('日文／別名（選填）', 'edNameJa', 'text', h.nameJa, 'maxlength="80"') +
        ed2(edIn('入住日', 'edIn', 'date', h.checkin), edIn('退房日', 'edOut', 'date', h.checkout)) +
        ed2(edIn('入住時間（以後）', 'edInT', 'time', h.checkinTime), edIn('退房時間（以前）', 'edOutT', 'time', h.checkoutTime)) +
        edIn('地址（選填）', 'edAddr', 'text', h.address, 'maxlength="150" placeholder="會變成 Google 地圖連結"') +
        edIn('房型（選填）', 'edRoom', 'text', h.room, 'maxlength="60"') +
        edIn('人數（選填）', 'edGuests', 'text', h.guests, 'maxlength="30" placeholder="例：2 位大人"') +
        '<div class="ed-priv">以下是員工專用私密欄，發布成範本時不會帶出去。</div>' +
        edIn('線上 Check-in 連結', 'edUrl', 'url', h.url, 'maxlength="500" inputmode="url" placeholder="https://"') +
        ed2(edIn('Check-in Code', 'edCode', 'text', h.code, 'maxlength="40"'), edIn('PIN Code', 'edPin', 'text', h.pin, 'maxlength="40"')) +
        edIn('訂房編號', 'edBooking', 'text', h.booking, 'maxlength="60"') +
        edTa('備註（選填）', 'edNote', h.note, 'rows="2" maxlength="300"') +
        '<span class="tpl-lb">Check-in QR code</span><div class="ed-files" id="edFiles"></div>' +
        '<button type="button" class="ed-upbtn" id="edUpBtn">上傳 QR code 圖片</button><input type="file" id="edFile" accept="image/*" hidden>';
    },
    after() { edRenderQr(); },
    collect() {
      const name = edVal('edName');
      if (!name) return { error: '請填住宿名稱' };
      const urlRaw = edVal('edUrl'), url = safeUrl(urlRaw);
      if (urlRaw && !url) return { error: '線上 Check-in 連結要以 http:// 或 https:// 開頭' };
      const ci = edVal('edIn'), co = edVal('edOut');
      if (ci && co && co < ci) return { error: '退房日不能早於入住日' };
      const rec = Object.assign({}, ED.rec || {}, {
        id: ED.id || uid(), name, nameJa: edVal('edNameJa'), checkin: ci, checkout: co, checkinTime: edVal('edInT'), checkoutTime: edVal('edOutT'),
        address: edVal('edAddr'), room: edVal('edRoom'), guests: edVal('edGuests'), url, code: edVal('edCode'), pin: edVal('edPin'),
        booking: edVal('edBooking'), note: edVal('edNote'), qr: ED.qr || '', at: Date.now(), del: false,
      });
      const qrOrig = ED.qrOrig;
      return { apply() {
        const i = EXTRA.hotels.findIndex(x => x.id === rec.id);
        if (i >= 0) EXTRA.hotels[i] = rec; else EXTRA.hotels.push(rec);
        if (qrOrig && qrOrig !== rec.qr) apiPost('trip-file-delete', { path: qrOrig }).catch(() => {});
        extraCommit();
      } };
    },
    remove(id) {
      const i = EXTRA.hotels.findIndex(x => x.id === id);
      if (i >= 0) EXTRA.hotels[i] = Object.assign({}, EXTRA.hotels[i], { del: true, at: Date.now() });
      extraCommit();
    },
    confirmText: '確定刪除這個住宿？',
  },
  prep: {
    title: rec => rec ? '編輯準備項目' : '新增準備項目',
    find: id => EXTRA.prep.find(x => x.id === id && !x.del),
    canDelete: true,
    html(rec, ctx) {
      const group = rec ? rec.group : (ctx.group === 'buy' ? 'buy' : 'todo');
      const p = rec || { group, cat: group === 'todo' ? PREP_CAT : 'key', owner: PREP_WHO, text: '', brandId: null };
      ED.seg.group = p.group; ED.seg.cat = PREP_CAT_MAP[p.cat] ? p.cat : 'key'; ED.seg.owner = p.owner || '';
      return edIn('項目', 'edText', 'text', p.text, 'maxlength="80" placeholder="例：護照、網卡"') +
        '<span class="tpl-lb">清單</span>' + edSegHtml('group', PREP_GROUPS.map(g => [g.id, g.name]), ED.seg.group) +
        '<div id="edCatWrap"' + (ED.seg.group === 'todo' ? '' : ' hidden') + '><span class="tpl-lb">分類</span>' + edSegHtml('cat', PREP_CATS.map(c => [c.id, c.name]), ED.seg.cat) + '</div>' +
        '<span class="tpl-lb">誰要準備</span>' + edSegHtml('owner', [['', '兩人共用']].concat(PREP_PEOPLE.map(n => [n, n])), ED.seg.owner) +
        '<span class="tpl-lb">綁定品牌（選填）</span><div id="edBrand"></div>';
    },
    after(rec) { bpMount(document.getElementById('edBrand'), rec ? rec.brandId : null); },
    onSeg(name, v) { if (name === 'group') document.getElementById('edCatWrap').hidden = v !== 'todo'; },
    collect() {
      const text = edVal('edText').slice(0, 80);
      if (!text) return { error: '請填項目' };
      const group = ED.seg.group;
      const rec = Object.assign({ id: uid(), done: false, ord: null, by: getUser() }, ED.rec || {}, {
        group, owner: ED.seg.owner, cat: group === 'todo' ? ED.seg.cat : 'key', text,
        brandId: bpGet(document.getElementById('edBrand')), at: Date.now(), del: false,
      });
      return { apply() {
        const i = EXTRA.prep.findIndex(x => x.id === rec.id);
        if (i >= 0) EXTRA.prep[i] = rec; else EXTRA.prep.push(rec);
        if (rec.group === 'todo' && PREP_CAT_MAP[rec.cat]) { PREP_CAT = rec.cat; try { localStorage.setItem(LS_PREP_CAT, PREP_CAT); } catch (e) {} }
        if (rec.owner && PREP_PEOPLE.includes(rec.owner)) { PREP_WHO = rec.owner; try { localStorage.setItem(LS_PREP_WHO, PREP_WHO); } catch (e) {} }
        extraCommit();
      } };
    },
    remove(id) {
      const i = EXTRA.prep.findIndex(x => x.id === id);
      if (i >= 0) EXTRA.prep[i] = Object.assign({}, EXTRA.prep[i], { del: true, at: Date.now() });
      extraCommit();
    },
    confirmText: '確定刪除這個項目？',
  },
};
let ED = null;
function rebuildDays() {
  const keep = DAYS[CUR];
  DAYS = buildDays(DATA);
  CUR = keep && DAYS.includes(keep) ? DAYS.indexOf(keep) : Math.min(CUR, Math.max(DAYS.length - 1, 0));
}
function extraCommit() {
  try { localStorage.setItem(LS_EXTRA, JSON.stringify(EXTRA)); } catch (e) {}
  EXTRA_DIRTY = true;
  rebuildDays(); render(); queueSave();
}
function edOpen(kind, id, ctx) {
  const form = ED_FORMS[kind];
  if (!EDIT || !LEDGER || !form) return;
  const rec = id && form.find ? form.find(id) : null;
  if (id && !rec) return;
  ED = { kind, id: id || null, rec, seg: {}, up: 0, tickets: [], ticketsOrig: [], qr: '', qrOrig: '', hero: '' };
  document.getElementById('edTitleT').textContent = form.title(rec);
  document.getElementById('edBody').innerHTML = form.html(rec, ctx || {});
  document.getElementById('edErr').textContent = '';
  document.getElementById('edDel').hidden = !(rec && form.canDelete);
  document.getElementById('edSave').hidden = kind === 'hero';
  document.getElementById('edCancel').textContent = kind === 'hero' ? '關閉' : '取消';
  document.getElementById('edOverlay').classList.add('on');
  document.getElementById('edPanel').scrollTop = 0;
  if (form.after) form.after(rec);
}
function edClose() { document.getElementById('edOverlay').classList.remove('on'); ED = null; }
function edSave() {
  if (!ED) return;
  if (ED.up > 0) { document.getElementById('edErr').textContent = '檔案上傳中，請稍等一下'; return; }
  const r = ED_FORMS[ED.kind].collect();
  if (r.error) { document.getElementById('edErr').textContent = r.error; return; }
  const apply = r.apply; edClose(); apply();
}
function edDelete() {
  if (!ED || !ED.id) return;
  const form = ED_FORMS[ED.kind];
  if (!confirm(form.confirmText || '確定刪除？')) return;
  const id = ED.id; edClose(); form.remove(id);
}
function edSetMode(on) {
  EDIT = !!on && !!getToken() && !!LEDGER;
  document.body.classList.toggle('editing', EDIT);
  const b = document.getElementById('edToggle');
  b.classList.toggle('on', EDIT); b.setAttribute('aria-pressed', EDIT ? 'true' : 'false');
  document.getElementById('edToggleT').textContent = EDIT ? '完成' : '編輯';
  if (DATA) render();
}
function edSyncToggle() { document.getElementById('edToggle').hidden = !(getToken() && LEDGER); }
(function edInit() {
  const wrap = document.createElement('div');
  wrap.innerHTML = '' +
    '<div class="tpl-overlay" id="edOverlay"><div class="tpl-panel ed-panel" id="edPanel" role="dialog" aria-label="編輯">' +
    '<div class="tpl-h"><h3 id="edTitleT"></h3><button type="button" class="x-btn" id="edClose" aria-label="關閉">' + ICON.x + '</button></div>' +
    '<div id="edBody"></div><div class="tpl-err" id="edErr"></div>' +
    '<div class="tpl-btns"><button type="button" class="main" id="edSave">儲存</button><button type="button" id="edCancel">取消</button><button type="button" class="danger" id="edDel" hidden>刪除</button></div>' +
    '</div></div>';
  document.body.appendChild(wrap);
  const ov = document.getElementById('edOverlay'); let downOnOv = false;
  ov.addEventListener('pointerdown', e => { downOnOv = e.target === ov; });
  ov.addEventListener('click', e => { if (e.target === ov && downOnOv) edClose(); downOnOv = false; });
  document.getElementById('edClose').onclick = edClose;
  document.getElementById('edCancel').onclick = edClose;
  document.getElementById('edSave').onclick = edSave;
  document.getElementById('edDel').onclick = edDelete;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ED) edClose(); });
  document.getElementById('edToggle').onclick = () => edSetMode(!EDIT);
  // 表單裡的點擊：分段按鈕、頁首插畫、機票／QR 上傳與移除
  document.getElementById('edBody').addEventListener('click', e => {
    const sg = e.target.closest('.ed-seg button');
    if (sg && ED) {
      const name = sg.parentNode.dataset.seg; ED.seg[name] = sg.dataset.v;
      sg.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === sg));
      const f = ED_FORMS[ED.kind]; if (f.onSeg) f.onSeg(name, sg.dataset.v);
      return;
    }
    const h = e.target.closest('[data-hero]');
    if (h && ED) {
      ED.hero = h.dataset.hero;
      document.querySelectorAll('#edHeroPicker .hero-opt').forEach(b => b.classList.toggle('on', b === h));
      if (ED.kind === 'hero') { const hero = ED.hero; edClose(); ledgerSetMeta({ hero }); }
      return;
    }
    if (e.target.closest('#edUpBtn')) { document.getElementById('edFile').click(); return; }
    const td = e.target.closest('[data-tkdel]');
    if (td && ED) { ED.tickets.splice(+td.dataset.tkdel, 1); edRenderTickets(); return; }
    if (e.target.closest('[data-qrdel]') && ED) { ED.qr = ''; edRenderQr(); }
  });
  document.getElementById('edBody').addEventListener('input', e => {
    const n = e.target.closest('[data-tkname]');
    if (n && ED) ED.tickets[+n.dataset.tkname].name = n.value.trim().slice(0, 40);
  });
  document.getElementById('edBody').addEventListener('change', async e => {
    if (e.target.id !== 'edFile' || !ED) return;
    const files = [...e.target.files]; e.target.value = '';
    const cur = ED, kind = ED.kind, btn = document.getElementById('edUpBtn'), errEl = document.getElementById('edErr');
    const label = btn.textContent;
    btn.disabled = true; errEl.textContent = ''; cur.up++;
    for (const file of (kind === 'hotel' ? files.slice(0, 1) : files)) {
      btn.textContent = '上傳中…（' + file.name + '）';
      try {
        const path = await edUploadFile(file);
        if (ED !== cur) { apiPost('trip-file-delete', { path }).catch(() => {}); continue; }   // 視窗已關：上傳的檔不留孤兒
        if (kind === 'hotel') { if (cur.qr && cur.qr !== cur.qrOrig) apiPost('trip-file-delete', { path: cur.qr }).catch(() => {}); cur.qr = path; edRenderQr(); }
        else { cur.tickets.push({ name: file.name.replace(/\.[^.]+$/, '').slice(0, 40), path }); edRenderTickets(); }
      } catch (err) { if (ED === cur) errEl.textContent = file.name + '：' + err.message; }
    }
    cur.up--;
    if (ED === cur) { btn.textContent = label; btn.disabled = false; }
  });
  // 頁面上的鉛筆與「＋ 新增」
  document.addEventListener('click', e => {
    const p = e.target.closest('[data-ed]');
    if (p) { e.preventDefault(); e.stopPropagation(); edOpen(p.dataset.ed, p.dataset.id || null, {}); return; }
    const a = e.target.closest('[data-ed-add]');
    if (a) { e.preventDefault(); edOpen(a.dataset.edAdd, null, { date: a.dataset.date || '', group: a.dataset.group || '' }); }
  });
})();

load();
</script>
