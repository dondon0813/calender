  .home-subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--c-brown);
    font-weight: 700;
    margin-bottom: 22px;

  .home-cards {

  .home-card-icon { font-size: 34px; margin-bottom: 8px; }
  .home-card-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 17px;
  }
  .home-card-title-divider {
    width: 60%;
    height: 0;
    border-bottom: 2px dashed;
    margin: 8px auto;
    opacity: .5;
  }
  .home-card-desc { font-size: 11.5px; color: var(--c-text-soft); }

  .footer {
    margin-top: 22px;
    font-size: 13px;
  }
</style>
</head>
