<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的集點卡・雪莉與朵栗</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* star-card.html 專屬樣式。共用的 reset / 版面 / 返回鈕 / 標題 / modal / 頁尾在 shared.css。 */

  :root {
    --wrap-max:     640px;
    --title-size:   26px;
    --title-rule-w: 110px;

    /* star-card 專屬色碼（與 shared.css 近似值不同，不可合併） */
    --stc-cream-bg:   #FFFDF6; /* 新增小朋友按鈕背景 */
    --stc-pink-badge: #FFD3E0; /* 星星集點徽章粉底 */
    --stc-gold-star:  #F0A93C; /* 金色星星 */
    --stc-coral:      #E0644A; /* 珊瑚色重點文字/邊框 */
    --stc-coral-bg:   #FFCFC2; /* 珊瑚色淺底 */
  }

  .back-btn { margin-bottom: 10px; }
  .page-title-wrap { margin: 4px 0 16px; }

  /* ===== 模式切換 ===== */
  .mode-switch-row {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-btn {
    font-family: var(--font-round);
    font-weight: 800;
    font-size: 13px;
    border-radius: var(--r-pill);
    border: 1px solid var(--c-border);
    background: #fff;
    color: var(--c-brown);
    padding: 9px 18px;
    cursor: pointer;
  }
  .mode-btn.active {
    background: var(--c-primary);
    border-color: var(--c-primary);
    color: #fff;
    box-shadow: 0 4px 10px rgba(255,143,163,0.4);
  }

  /* ===== 小朋友選擇列 ===== */
  .profile-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 18px;
  }
  .profile-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 800;
    border-radius: var(--r-pill);
    border: 1px solid var(--c-border);
    background: #fff;
    color: var(--c-text-soft);
    padding: 7px 14px;
    cursor: pointer;
  }
  .profile-chip .emoji { font-size: 16px; }
  .profile-chip.active {
    background: var(--c-pink-bg);
    border-color: var(--c-primary);
    color: var(--c-pink-deep);
  }
  .profile-chip-add {
    border-style: dashed;
    color: var(--c-gold-text);
    border-color: var(--c-gold-border);
    background: var(--stc-cream-bg);
  }

  .empty-state {
    text-align: center;
    color: var(--c-muted-light);
    font-size: 13px;
    padding: 34px 10px;
    border: 1px dashed var(--c-orange-dash);
    border-radius: var(--r-modal);
  }

  /* ===== 集點卡本體 ===== */
  .card-nav-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 10px;
  }
  .nav-arrow {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--c-border);
    background: #fff;
    color: var(--c-brown);
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    flex: none;
  }
  .nav-arrow:disabled { opacity: .35; cursor: default; }
  .card-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 16px;
    color: var(--c-text);
    text-align: center;
    min-width: 160px;
  }
  .card-title small {
    display: block;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 12px;
    color: var(--c-primary);
    margin-top: 2px;
  }

  .star-card-box {
    background: linear-gradient(135deg, var(--c-gold-gradient) 0%, var(--c-pink-bg-2) 100%);
    border: 3px dashed var(--c-orange-dash-2);
    border-radius: 24px;
    padding: 22px 14px;
    margin-bottom: 16px;
  }
  .star-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
  }
  .star-slot {
    aspect-ratio: 1/1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    background: var(--c-surface);
    border: 2.5px dashed var(--c-title-rule);
    color: var(--stc-pink-badge);
    user-select: none;
  }
  .star-slot.filled {
    background: var(--c-gold-badge-bg);
    border: 2.5px solid var(--c-cat-6);
    color: var(--stc-gold-star);
    animation: pop .35s ease;
  }
  .star-slot.clickable { cursor: pointer; }
  @keyframes pop {
    0% { transform: scale(0.3); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* ===== 家長操作按鈕 ===== */
  .parent-actions {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  /* 外觀在 shared.css，這裡只調尺寸與並排方式 */
  .action-btn {
    flex: 1 1 auto;
    font-size: 13.5px;
    padding: 11px 12px;
  }
  .action-btn-ghost {
    background: #fff;
    color: var(--c-brown);
    border: 1px solid var(--c-border);
  }

  .settings-link-row {
    text-align: center;
    margin-top: 6px;
  }
  .settings-link {
    font-size: 11.5px;
    color: var(--c-muted);
    font-weight: 700;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }

  /* 本頁頁尾比共用的緊一點 */
  .footer {
    margin-top: 22px;
    font-size: 13px;
  }

  /* ===== Modal：本頁內容較長，需可捲動 ===== */
  .modal-backdrop { padding: 16px; }
  .modal-box {
    border-radius: 20px;
    padding: 22px 20px;
    max-width: 92%;
    max-height: 86vh;
    overflow-y: auto;
  }
  .modal-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 18px;
    color: var(--c-primary);
    margin: 0 0 14px;
    text-align: center;
  }
  .field-label {
    font-size: 12px;
    font-weight: 800;
    color: var(--c-muted);
    margin: 10px 0 6px;
  }
  .field-input {
    width: 100%;
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    color: var(--c-text);
    border: 1px solid var(--c-border);
    border-radius: var(--r-md);
    padding: 10px 14px;
    background: #fff;
    outline: none;
  }
  .field-input:focus { border-color: var(--c-primary); }

  .avatar-pick-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 4px;
  }
  .avatar-pick {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--c-border);
    background: #fff;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .avatar-pick.active { border-color: var(--c-primary); background: var(--c-pink-bg); }

  .modal-hint {
    font-size: 11.5px;
    color: var(--c-muted-light);
    line-height: 1.6;
    margin-top: 6px;
  }
  .modal-error {
    font-size: 12px;
    color: var(--stc-coral);
    font-weight: 800;
    margin-top: 8px;
    min-height: 16px;
  }
  .modal-divider {
    text-align: center;
    font-size: 11px;
    color: var(--c-placeholder);
    margin: 14px 0;
  }

  .celebrate-emoji { font-size: 46px; text-align: center; margin-bottom: 6px; }
  .celebrate-text { text-align: center; font-size: 14px; color: var(--c-text); line-height: 1.7; margin-bottom: 16px; }

  /* ===== 集滿慶祝動畫 ===== */
  #celebrateModal.show .modal-box {
    animation: celebratePop .55s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes celebratePop {
    0%   { transform: scale(.4); opacity: 0; }
    100% { transform: scale(1);  opacity: 1; }
  }
  #celebrateModal.show .celebrate-emoji {
    display: inline-block;
    width: 100%;
    animation: celebrateWiggle .8s ease-in-out infinite;
  }
  @keyframes celebrateWiggle {
    0%, 100% { transform: rotate(-10deg) scale(1); }
    50%      { transform: rotate(10deg) scale(1.2); }
  }
  .confetti-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 2000;
  }
  .confetti-piece {
    position: absolute;
    top: -50px;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .danger-btn {
    background: #fff;
    color: var(--stc-coral);
    border: 1px solid var(--stc-coral-bg);
  }
</style>
</head>
<body>

<div class="wrap">

<!-- 新增/編輯小朋友 -->
<div class="modal-backdrop" id="addChildModal">

<!-- 家長驗證：輸入密碼 -->

</div>

<script>
// ===================== 資料儲存 =====================
const STORAGE_KEY = 'dondon_kidsStarApp_v1';
const STARS_PER_CARD = 10;
const AVATAR_OPTIONS = ['🐻','🐰','🦊','🐱','🐶','🦁','🐼','🐨','🐸','🦄','🐷','🐤'];

function loadApp() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { profiles: [], activeProfileId: null, parentAuth: null };
    const parsed = JSON.parse(raw);
    if (!parsed.profiles) parsed.profiles = [];
    return parsed;
  } catch (e) {
    console.error(e);
    return { profiles: [], activeProfileId: null, parentAuth: null };
  }
}
function saveApp() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(APP));
}

let APP = loadApp();
let isParentMode = false;
let parentUnlocked = false;
let viewCardIndex = {}; // profileId -> which card index is currently being viewed
let pendingAvatar = AVATAR_OPTIONS[0];

// ===================== 工具 =====================
function getActiveProfile() {
  return APP.profiles.find(p => p.id === APP.activeProfileId) || null;
}
function newProfileId() {
  return 'child_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
}
function ensureViewIndex(profile) {
  if (viewCardIndex[profile.id] === undefined) {
    viewCardIndex[profile.id] = profile.cards.length - 1;
  }
  // 不能超過現有卡片範圍
  if (viewCardIndex[profile.id] > profile.cards.length - 1) {
    viewCardIndex[profile.id] = profile.cards.length - 1;
  }
  if (viewCardIndex[profile.id] < 0) viewCardIndex[profile.id] = 0;
}

async function sha256Hex(str) {
  if (!window.isSecureContext || !window.crypto || !window.crypto.subtle) {
    throw new Error('此網址目前不是安全連線（https），瀏覽器不允許設定密碼。請確認網址列有🔒鎖頭符號後再試一次。');
  }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function randomSalt() {
  const arr = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}
function arrayBufferToBase64(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}
function base64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
async function isPlatformAuthAvailable() {
  if (!window.PublicKeyCredential || !PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) return false;
  try { return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch (e) { return false; }
}

// ===================== 渲染：小朋友選擇列 =====================
function renderProfileRow() {
  const row = document.getElementById('profileRow');
  row.innerHTML = '';

  APP.profiles.forEach(p => {
    const chip = document.createElement('button');
    chip.className = 'profile-chip' + (p.id === APP.activeProfileId ? ' active' : '');
    chip.innerHTML = `<span class="emoji">${p.avatar || '🐻'}</span><span>${p.name}</span>`;
    chip.addEventListener('click', () => {
      APP.activeProfileId = p.id;
      saveApp();
      renderAll();
    });
    row.appendChild(chip);
  });

  const addChip = document.createElement('button');
  addChip.className = 'profile-chip profile-chip-add';
  addChip.textContent = '＋ 新增小朋友';
  addChip.addEventListener('click', openAddChildModal);
  row.appendChild(addChip);
}

// ===================== 渲染：集點卡 =====================
function renderCardStage() {
  const profile = getActiveProfile();
  const stage = document.getElementById('cardStage');
  const emptyState = document.getElementById('noProfileState');

  if (!profile) {
    stage.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';
  stage.style.display = 'block';

  ensureViewIndex(profile);
  const idx = viewCardIndex[profile.id];
  const card = profile.cards[idx];
  const isLatest = idx === profile.cards.length - 1;
  const filledCount = card.filter(Boolean).length;

  document.getElementById('cardTitleLabel').innerHTML =
    `${profile.name} 的第 ${idx + 1} 張集點卡<small>${filledCount} ／ ${STARS_PER_CARD} ⭐</small>`;

  document.getElementById('prevCardBtn').disabled = idx <= 0;
  document.getElementById('nextCardBtn').disabled = idx >= profile.cards.length - 1;

  const grid = document.getElementById('starGrid');
  grid.innerHTML = '';
  card.forEach((filled, i) => {
    const slot = document.createElement('div');
    slot.className = 'star-slot' + (filled ? ' filled' : '') + (isParentMode && parentUnlocked && isLatest && filled ? ' clickable' : '');
    slot.textContent = filled ? '⭐' : '☆';
    if (isParentMode && parentUnlocked && isLatest && filled) {
      slot.title = '點擊移除這顆星星';
      slot.addEventListener('click', () => removeSpecificStar(profile, i));
    }
    grid.appendChild(slot);
  });

  const showParentActions = isParentMode && parentUnlocked;
  document.getElementById('parentActions').style.display = showParentActions ? 'flex' : 'none';
  document.getElementById('parentSettingsRow').style.display = showParentActions ? 'block' : 'none';
}

function renderAll() {
  renderProfileRow();
  renderCardStage();
}

// ===================== 集點卡動作 =====================
function addStar() {
  const profile = getActiveProfile();
  if (!profile) return;
  // 一律加到最新一張卡片
  const latestIdx = profile.cards.length - 1;
  const card = profile.cards[latestIdx];
  const emptyIdx = card.findIndex(v => !v);
  if (emptyIdx === -1) return; // 理論上不會發生，滿了會自動開新卡
  card[emptyIdx] = true;
  viewCardIndex[profile.id] = latestIdx;

  const nowFull = card.every(Boolean);
  if (nowFull) {
    profile.cards.push(new Array(STARS_PER_CARD).fill(false));
  }
  saveApp();
  renderCardStage();
  if (nowFull) {
    launchConfetti();
    setTimeout(() => document.getElementById('celebrateModal').classList.add('show'), 500);
  }
}

// 集滿一張卡的慶祝：emoji 彩帶從畫面上方灑下來
function launchConfetti() {
  const CONFETTI_EMOJIS = ['🎉', '🎊', '⭐', '🌟', '✨', '💖'];
  const layer = document.createElement('div');
  layer.className = 'confetti-layer';
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('span');
    piece.className = 'confetti-piece';
    piece.textContent = CONFETTI_EMOJIS[Math.floor(Math.random() * CONFETTI_EMOJIS.length)];
    piece.style.left = (Math.random() * 100) + 'vw';
    piece.style.fontSize = (16 + Math.random() * 18) + 'px';
    piece.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
    piece.style.animationDelay = (Math.random() * 0.8) + 's';
    layer.appendChild(piece);
  }
  document.body.appendChild(layer);
  setTimeout(() => layer.remove(), 4800);
}

function undoStar() {
  const profile = getActiveProfile();
  if (!profile) return;
  const latestIdx = profile.cards.length - 1;
  const card = profile.cards[latestIdx];
  let lastFilled = -1;
  for (let i = 0; i < card.length; i++) if (card[i]) lastFilled = i;

  if (lastFilled === -1) {
    // 這張卡是空的，如果前面還有卡片就往前一張移除最後一顆
    if (profile.cards.length > 1) {
      profile.cards.pop();
      const prevCard = profile.cards[profile.cards.length - 1];
      let prevLast = -1;
      for (let i = 0; i < prevCard.length; i++) if (prevCard[i]) prevLast = i;
      if (prevLast !== -1) prevCard[prevLast] = false;
      viewCardIndex[profile.id] = profile.cards.length - 1;
      saveApp();
      renderCardStage();
    }
    return;
  }
  if (!confirm('確定要移除最後蓋上的一顆星星嗎？')) return;
  card[lastFilled] = false;
  viewCardIndex[profile.id] = latestIdx;
  saveApp();
  renderCardStage();
}

function removeSpecificStar(profile, index) {
  const latestIdx = profile.cards.length - 1;
  const card = profile.cards[latestIdx];
  if (!confirm('確定要移除這顆星星嗎？')) return;
  card[index] = false;
  saveApp();
  renderCardStage();
}

document.getElementById('prevCardBtn').addEventListener('click', () => {
  const profile = getActiveProfile();
  if (!profile) return;
  ensureViewIndex(profile);
  if (viewCardIndex[profile.id] > 0) viewCardIndex[profile.id]--;
  renderCardStage();
});
document.getElementById('nextCardBtn').addEventListener('click', () => {
  const profile = getActiveProfile();
  if (!profile) return;
  ensureViewIndex(profile);
  if (viewCardIndex[profile.id] < profile.cards.length - 1) viewCardIndex[profile.id]++;
  renderCardStage();
});
document.getElementById('addStarBtn').addEventListener('click', addStar);
document.getElementById('undoStarBtn').addEventListener('click', undoStar);

// ===================== 新增小朋友 =====================
function openAddChildModal() {
  document.getElementById('childNameInput').value = '';
  document.getElementById('childAgeInput').value = '';
  document.getElementById('addChildError').textContent = '';
  pendingAvatar = AVATAR_OPTIONS[Math.floor(Math.random() * AVATAR_OPTIONS.length)];
  renderAvatarPickRow();
  document.getElementById('addChildModal').classList.add('show');
}
function renderAvatarPickRow() {
  const row = document.getElementById('avatarPickRow');
  row.innerHTML = '';
  AVATAR_OPTIONS.forEach(emoji => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'avatar-pick' + (emoji === pendingAvatar ? ' active' : '');
    btn.textContent = emoji;
    btn.addEventListener('click', () => {
      pendingAvatar = emoji;
      renderAvatarPickRow();
    });
    row.appendChild(btn);
  });
}
document.getElementById('saveChildBtn').addEventListener('click', () => {
  const name = document.getElementById('childNameInput').value.trim();
  const age = document.getElementById('childAgeInput').value.trim();
  const errEl = document.getElementById('addChildError');
  if (!name) { errEl.textContent = '請輸入小朋友的名字'; return; }
  const profile = {
    id: newProfileId(),
    name,
    age: age || '',
    avatar: pendingAvatar,
    cards: [new Array(STARS_PER_CARD).fill(false)],
    createdAt: Date.now()
  };
  APP.profiles.push(profile);
  APP.activeProfileId = profile.id;
  saveApp();
  closeModal('addChildModal');
  renderAll();
});

// ===================== 模式切換 =====================
document.getElementById('modeChildBtn').addEventListener('click', () => {
  isParentMode = false;
  parentUnlocked = false;
  document.getElementById('modeChildBtn').classList.add('active');
  document.getElementById('modeParentBtn').classList.remove('active');
  renderCardStage();
});
document.getElementById('modeParentBtn').addEventListener('click', async () => {
  if (parentUnlocked) {
    isParentMode = true;
    document.getElementById('modeParentBtn').classList.add('active');
    document.getElementById('modeChildBtn').classList.remove('active');
    renderCardStage();
    return;
  }
  if (!APP.parentAuth) {
    await openSetPasswordModal();
  } else {
    await openParentAuthModal();
  }
});

// ===================== 家長密碼：設定 =====================
async function openSetPasswordModal() {
  document.getElementById('newPasswordInput').value = '';
  document.getElementById('newPasswordConfirmInput').value = '';
  document.getElementById('setPasswordError').textContent = '';
  const available = await isPlatformAuthAvailable();
  document.getElementById('biometricSetupDivider').style.display = available ? 'block' : 'none';
  document.getElementById('biometricSetupRow').style.display = available ? 'flex' : 'none';
  document.getElementById('setPasswordModal').classList.add('show');
}
document.getElementById('confirmSetPasswordBtn').addEventListener('click', async () => {
  const pw = document.getElementById('newPasswordInput').value;
  const pw2 = document.getElementById('newPasswordConfirmInput').value;
  const errEl = document.getElementById('setPasswordError');
  if (pw.length < 4) { errEl.textContent = '密碼至少需要 4 位數'; return; }
  if (pw !== pw2) { errEl.textContent = '兩次輸入的密碼不一致'; return; }
  try {
    const salt = randomSalt();
    const hash = await sha256Hex(salt + ':' + pw);
    APP.parentAuth = { passwordHash: hash, salt, webauthnCredentialId: null };
    saveApp();
    closeModal('setPasswordModal');
    unlockParentMode();
  } catch (e) {
    console.error(e);
    errEl.textContent = e.message || '儲存失敗，請重新整理頁面後再試一次。';
  }
});
document.getElementById('registerBiometricBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('setPasswordError');
  try {
    // 密碼要先存在才能設定生物辨識（生物辨識作為密碼之外的快速解鎖方式）
    if (!APP.parentAuth) {
      const pw = document.getElementById('newPasswordInput').value;
      const pw2 = document.getElementById('newPasswordConfirmInput').value;
      if (pw.length < 4 || pw !== pw2) {
        errEl.textContent = '請先在上方設定好密碼（兩次一致、至少4位數），再設定 Face ID／指紋';
        return;
      }
      const salt = randomSalt();
      const hash = await sha256Hex(salt + ':' + pw);
      APP.parentAuth = { passwordHash: hash, salt, webauthnCredentialId: null };
    }
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: '雪莉與朵栗 免費資源' },
        user: { id: userId, name: 'parent', displayName: '家長' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000,
        attestation: 'none'
      }
    });
    APP.parentAuth.webauthnCredentialId = arrayBufferToBase64(cred.rawId);
    saveApp();
    closeModal('setPasswordModal');
    unlockParentMode();
  } catch (e) {
    console.error(e);
    errEl.textContent = '無法設定 Face ID／指紋，這台裝置可能不支援，或已取消';
  }
});

// ===================== 家長密碼：驗證 =====================
async function openParentAuthModal() {
  document.getElementById('parentPasswordInput').value = '';
  document.getElementById('parentAuthError').textContent = '';
  const available = await isPlatformAuthAvailable();
  const hasCred = !!(APP.parentAuth && APP.parentAuth.webauthnCredentialId);
  const showBiometric = available && hasCred;
  document.getElementById('biometricAuthDivider').style.display = showBiometric ? 'block' : 'none';
  document.getElementById('biometricAuthRow').style.display = showBiometric ? 'flex' : 'none';
  document.getElementById('parentAuthModal').classList.add('show');
}
document.getElementById('confirmParentAuthBtn').addEventListener('click', async () => {
  const pw = document.getElementById('parentPasswordInput').value;
  const errEl = document.getElementById('parentAuthError');
  try {
    const hash = await sha256Hex(APP.parentAuth.salt + ':' + pw);
    if (hash === APP.parentAuth.passwordHash) {
      closeModal('parentAuthModal');
      unlockParentMode();
    } else {
      errEl.textContent = '密碼不正確，請再試一次';
    }
  } catch (e) {
    console.error(e);
    errEl.textContent = e.message || '驗證失敗，請重新整理頁面後再試一次。';
  }
});
document.getElementById('useBiometricBtn').addEventListener('click', async () => {
  const errEl = document.getElementById('parentAuthError');
  try {
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const credId = base64ToArrayBuffer(APP.parentAuth.webauthnCredentialId);
    await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ id: credId, type: 'public-key', transports: ['internal'] }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    closeModal('parentAuthModal');
    unlockParentMode();
  } catch (e) {
    console.error(e);
    errEl.textContent = '驗證失敗或已取消，請改用密碼解鎖';
  }
});

function unlockParentMode() {
  parentUnlocked = true;
  isParentMode = true;
  document.getElementById('modeParentBtn').classList.add('active');
  document.getElementById('modeChildBtn').classList.remove('active');
  renderCardStage();
}

// ===================== 家長設定 =====================
document.getElementById('openSettingsBtn').addEventListener('click', () => {
  const profile = getActiveProfile();
  document.getElementById('settingsChildName').textContent = profile ? profile.name : '';
  document.getElementById('settingsNewPassword').value = '';
  document.getElementById('settingsNewPasswordConfirm').value = '';
  document.getElementById('settingsError').textContent = '';
  document.getElementById('settingsModal').classList.add('show');
});
document.getElementById('saveNewPasswordBtn').addEventListener('click', async () => {
  const pw = document.getElementById('settingsNewPassword').value;
  const pw2 = document.getElementById('settingsNewPasswordConfirm').value;
  const errEl = document.getElementById('settingsError');
  if (pw.length < 4) { errEl.textContent = '密碼至少需要 4 位數'; return; }
  if (pw !== pw2) { errEl.textContent = '兩次輸入的密碼不一致'; return; }
  try {
    const salt = randomSalt();
    const hash = await sha256Hex(salt + ':' + pw);
    APP.parentAuth.passwordHash = hash;
    APP.parentAuth.salt = salt;
    saveApp();
    errEl.style.color = 'var(--c-mint-text)';
    errEl.textContent = '密碼已更新！';
  } catch (e) {
    console.error(e);
    errEl.style.color = '';
    errEl.textContent = e.message || '更新失敗，請重新整理頁面後再試一次。';
  }
});
document.getElementById('deleteChildBtn').addEventListener('click', () => {
  const profile = getActiveProfile();
  if (!profile) return;
  if (!confirm(`確定要刪除「${profile.name}」的所有集點紀錄嗎？這個動作無法復原。`)) return;
  APP.profiles = APP.profiles.filter(p => p.id !== profile.id);
  APP.activeProfileId = APP.profiles.length ? APP.profiles[0].id : null;
  delete viewCardIndex[profile.id];
  saveApp();
  closeModal('settingsModal');
  renderAll();
});

// ===================== Modal 通用 =====================
function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}
document.querySelectorAll('.modal-backdrop').forEach(backdrop => {
  backdrop.addEventListener('click', (e) => {
    if (e.target === backdrop) backdrop.classList.remove('show');
  });
});

// ===================== 初始化 =====================
if (!APP.activeProfileId && APP.profiles.length) {
  APP.activeProfileId = APP.profiles[0].id;
}
renderAll();
</script>

<!-- 頁面瀏覽量統計：獨立區塊，不依賴本頁其他程式碼。key 白名單見 Code.gs STAT_KEY_WHITELIST_RE（頁面代號只能小寫英數，不能有 - 或 _） -->
<script>
(function sendStarCardPageview() {
  const STATS_BACKEND_URL = 'https://dondon-platform.vercel.app/api/legacy'; // 灰度切換 2026-08-17：計數改打新後端，回退＝revert 本 commit
  const d = new Date();
  const key = `page_starcard_${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const payload = JSON.stringify({ type: 'stat-view', key });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(STATS_BACKEND_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    } else {
      fetch(STATS_BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }
  } catch (e) { /* 統計失敗不影響使用者瀏覽，安靜忽略 */ }
})();
</script>
