<style>
  /* name-sticker-generator.html 專屬樣式。共用的 reset / 版面 / 返回鈕 / 標題 / 頁尾 / modal 在 shared.css。 */

  .ns-subtitle {

    font-size: 13px;
    color: var(--c-brown);
    font-weight: 700;
    margin-bottom: 20px;
  }

  .ns-section-title {

  /* ===== 款式選擇 ===== */

    display: flex;
    justify-content: center;
    gap: 14px;
    margin-bottom: 22px;

  }
  .ns-style-card {

    background: var(--c-surface-3);
    padding: 18px 10px 14px;
    text-align: center;
    cursor: pointer;
    font-family: var(--font-body);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .ns-style-card:hover { transform: translateY(-2px); }
  .ns-style-card.active {
    border-color: var(--c-primary);
    background: var(--c-pink-bg);
    box-shadow: var(--sh-float);
  }
  .ns-style-icon { font-size: 32px; margin-bottom: 6px; }
  .ns-style-icon img {

    width: 56px;
    height: 56px;
    margin: 0 auto;

  }
  .ns-style-title {

    left: -99999px;
    top: 0;
    background: #ffffff;
  }

  .ns-grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 4px 10px;
    width: 100%;

  .ns-cell {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    gap: 2px;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    padding: 0 1px;

  .ns-cell-icon {
    flex: none;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .ns-cell-icon img { display: block; margin: 0 auto; }
  .ns-cell-icon.emoji { font-size: 32px; }
  .ns-cell-textstack {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    /* 刻意不設 overflow:hidden：這個容器的高度是「自動」依內容算出來的
       （nameEl／engEl 的版面框高度加總），不是固定值——如果設 overflow:hidden，
       它自己的框就會剛好卡在最後一行版面框的下緣，跟那一行自己設
       overflow:hidden 是一樣的裁法，等於裁切只是往上移了一層，換湯不換藥。
       真正安全的裁切邊界是外層 .ns-cell——它是 CSS Grid 格子，高度是固定的
       54px（不是依內容算的），版面框加總遠小於這個高度，裁在那一層才不會
       真的切到任何東西 */
  }
  /* 有英文姓名時：中英文兩行彼此置中對齊，不再各自靠左。
     刻意不改 align-items（維持預設 stretch），這兩行才會保持撐滿格子寬度，
     量測可用寬度時才準——只用 text-align:center 讓文字在滿版寬度裡置中 */
  .ns-cell-textstack.dual .ns-cell-name,
  .ns-cell-textstack.dual .ns-cell-name-en {
    text-align: center;

  /* 只有中文單行（沒有英文）時，文字看起來會偏上，往下微調一點點 */
  .ns-cell-textstack:not(.dual) .ns-cell-name {

  }

<script>
// html2canvas（約 200KB）延後到使用者真的點「產生圖片」才載入，其他人不用白白多下載這包函式庫
let html2canvasLoadPromise = null;
function ensureHtml2Canvas() {
  if (typeof html2canvas === 'function') return Promise.resolve();
  if (!html2canvasLoadPromise) {
    html2canvasLoadPromise = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'vendor/html2canvas.min.js';
      s.onload = resolve;
      s.onerror = () => { html2canvasLoadPromise = null; reject(new Error('html2canvas 載入失敗')); };
      document.head.appendChild(s);
    });
  }
  return html2canvasLoadPromise;
}

// ===== 姓名貼款式資料 =====
// 兩種產生方式（mode）：
//   grid （預設，喵星人／可愛動物）：白底 4x6 網格，每格「去背小圖＋姓名」，用 html2canvas 截圖。
//   sheet（交通工具）：整張已排版好的底圖直接當成品，只把姓名畫到每台車的車身上。
//     這款用 canvas 2D 直接畫，不經 html2canvas——白色字＋外框要靠 strokeText 才畫得出來
//     （html2canvas 不支援 -webkit-text-stroke，text-shadow 模擬出來的外框也毛毛的），
//     而且底圖本身已含品牌落款，不需要 DOM 樣板，順便省下 200KB 函式庫。
const STICKER_STYLES = {
  cat: {

    emoji: '🐱',
    images: [

      'images/name-stickers/cat-05.webp',
      'images/name-stickers/cat-06.webp',
      'images/name-stickers/cat-07.webp',
      'images/name-stickers/cat-08.webp'
    ]
  },
  animal: {
    label: '可愛動物',
    emoji: '🐾',
    images: [
      'images/name-stickers/animal-01.webp',
      'images/name-stickers/animal-02.webp',
      'images/name-stickers/animal-03.webp',
      'images/name-stickers/animal-04.webp'
    ]
  },
  cat2: {
    label: '大肥貓',
    emoji: '🐱',
    mode: 'bodygrid',
    singleNameOnly: true,   // 名字要疊畫在貓咪身體裡，位置窄，兩行會擠不下 → 只收中文姓名
    images: [
      'images/name-stickers/cat2-01.webp',
      'images/name-stickers/cat2-02.webp',
      'images/name-stickers/cat2-03.webp',
      'images/name-stickers/cat2-04.webp',
      'images/name-stickers/cat2-05.webp',
      'images/name-stickers/cat2-06.webp',
      'images/name-stickers/cat2-07.webp',
      'images/name-stickers/cat2-08.webp'
    ],
    // 8 隻貓是同一套姿勢範本畫的（面向左、身體在右側），身體中段這塊比例
    // 在全部 8 張圖上都落在軀幹上（不會切到臉/腳/尾巴），所以共用同一組比例，
    // 不用像交通工具那樣每張圖各自訂位置
    bodySlot: { x: 0.2, y: 0.5, w: 0.5, h: 0.32 },
    textStroke: '#5a4a3f',  // 站上的深棕文字色（--c-text），白字＋這個外框在全部貓色上都看得清楚
    // 明信片底圖是橫式（576x384），4x6（直向較多格）比例跟底圖不搭、每隻貓被擠得瘦長；
    // 改成 5x4（橫向較多格）才貼近底圖的橫式比例，貓也比較不會被壓扁
    gridCols: 5,
    gridRows: 4
  },
  vehicle: {

    emoji: '🚒',
    mode: 'sheet',
    singleNameOnly: true,   // 車身只有一條位置，兩行會小到看不清楚 → 只收中文姓名

      { x: 0.4322, y: 0.4526, w: 0.1159, h: 0.0528, stroke: '#4d5539' }, // 挖土機引擎室
      { x: 0.6161, y: 0.4104, w: 0.1272, h: 0.0471, stroke: '#2e4e52' }, // 藍綠小轎車
      { x: 0.8235, y: 0.4132, w: 0.1301, h: 0.0525, stroke: '#806125' }, // 黃色轎車（右）
      { x: 0.0465, y: 0.6175, w: 0.1538, h: 0.0579, stroke: '#806125' }, // 黃色轎車（左）
      { x: 0.5679, y: 0.6963, w: 0.1379, h: 0.0466, stroke: '#17253d' }, // 警車（中右）
      { x: 0.2766, y: 0.7496, w: 0.1550, h: 0.0525, stroke: '#792d21' }, // 飛機（中下）
      { x: 0.0697, y: 0.8682, w: 0.1440, h: 0.0493, stroke: '#17253d' }, // 警車（左下）
      { x: 0.7952, y: 0.8318, w: 0.1416, h: 0.0525, stroke: '#813f32' }  // 飛機（右下）
    ]

};

const NS_GRID_COLS = 4;
const NS_GRID_ROWS = 6;

let nsSelectedStyle = null;

document.querySelectorAll('#nsStyleSelect .ns-style-card').forEach(card => {
  card.addEventListener('click', () => {
    nsSelectedStyle = card.dataset.style;
    document.querySelectorAll('#nsStyleSelect .ns-style-card').forEach(c => {
      c.classList.toggle('active', c === card);
    });
    applySingleNameOnly(nsSelectedStyle);
  });
});

// 只收一個姓名的款式（交通工具）要把英文欄位收起來並清空，
// 不然使用者填了卻不會出現在成品上，會以為是壞掉
function applySingleNameOnly(styleKey) {
  const input = document.getElementById('nsEnglishNameInput');
  if (!input) return;
  const single = !!(STICKER_STYLES[styleKey] && STICKER_STYLES[styleKey].singleNameOnly);
  input.style.display = single ? 'none' : '';
  if (single) input.value = '';
}

function buildStickerImageSlots(images, slotCount) {
  // 洗牌後再輪迴填滿：格數少於圖案總數時，每次產生都能看到不同的組合
  const shuffled = images.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const slots = [];
  for (let i = 0; i < slotCount; i++) {
    slots.push(shuffled[i % shuffled.length]);
  }
  return slots;
}

function preloadImage(src) {
  return new Promise((resolve) => {
    let done = false;
    const finish = (result) => { if (done) return; done = true; resolve(result); };
    // img 的 onload/onerror 極少數情況不會觸發，加上 timeout 保底，避免 Promise.all 卡死
    const timer = setTimeout(() => finish({ ok: false }), 8000);
    const img = new Image();
    img.onload = () => { clearTimeout(timer); finish({ ok: true, w: img.naturalWidth, h: img.naturalHeight }); };
    img.onerror = () => { clearTimeout(timer); finish({ ok: false }); };
    img.src = src;
  });
}

// ===== sheet 款（交通工具）：整張底圖 + 車身上字，canvas 2D 直接畫 =====

const NS_SHEET_FONT = '"Baloo 2", "Huninn", "Noto Sans TC", sans-serif'; // 與 --font-display 同一組
const NS_SHEET_FONT_WEIGHT = 800;
const NS_SHEET_TEXT_FILL = '#ffffff';
const NS_SHEET_STROKE_RATIO = 0.17;  // 外框粗細 ÷ 字級
const NS_SHEET_WIDTH_SAFETY = 0.94;  // 字寬留一點邊，不要頂到車身邊緣
const NS_SHEET_MIN_FONT = 8;

function loadImageElement(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('底圖載入失敗：' + src));
    img.src = src;
  });
}

// 自訂字體是照 unicode-range 切成很多小包的，只有「頁面上真的出現過的字」才會被下載。
// 使用者輸入的姓名多半不在已下載的那幾包裡，canvas 又不像 DOM 會在字體到齊後自動重繪
// ——不先把這幾個字要用到的字體包載進來就直接畫，會用系統預設字體畫上去且無聲無息。
async function ensureFontsForText(text) {
  if (!document.fonts || !document.fonts.load) return;
  const families = ['"Baloo 2"', '"Huninn"', '"Noto Sans TC"'];
  try {
    await Promise.all(families.map(f =>
      document.fonts.load(`${NS_SHEET_FONT_WEIGHT} 100px ${f}`, text).catch(() => {})
    ));
    await document.fonts.ready;
  } catch (e) { /* 字體載入失敗就照現況畫，不擋住整個流程 */ }
}

function nsSheetFont(size) {
  return `${NS_SHEET_FONT_WEIGHT} ${size}px ${NS_SHEET_FONT}`;
}

// 從 maxSize 開始往下縮，直到這行字塞得進 maxWidth
function fitCanvasFontSize(ctx, text, maxSize, maxWidth) {
  let size = Math.max(NS_SHEET_MIN_FONT, Math.round(maxSize));
  while (size > NS_SHEET_MIN_FONT) {
    ctx.font = nsSheetFont(size);
    if (ctx.measureText(text).width <= maxWidth) break;
    size -= 1;
  }
  return size;
}

function drawStrokedText(ctx, text, cx, cy, size, strokeColor) {
  ctx.font = nsSheetFont(size);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.miterLimit = 2;
  ctx.lineWidth = Math.max(2, size * NS_SHEET_STROKE_RATIO);
  ctx.strokeStyle = strokeColor;
  // textBaseline='middle' 對齊的是字體的 em 方框中線，不是筆畫的視覺中心——
  // 圓體的中文字實際筆畫落在 em 方框偏下，直接照 em 中線畫，字會比框中心高約 18%
  // （在 1800px 的圖上是 15px，肉眼看得出來）。改用實際筆畫上下緣重新置中。
  const y = cy - inkCenterOffset(ctx, text);
  ctx.strokeText(text, cx, y);   // 外框先畫，字身後蓋，筆畫才不會被外框吃掉一半
  ctx.fillStyle = NS_SHEET_TEXT_FILL;
  ctx.fillText(text, cx, y);
}

// 筆畫中心相對於基準點的位移（字體要先設好）。舊瀏覽器沒有這兩個量測值就回 0，
// 頂多回到修正前的樣子，不會畫錯位置。
function inkCenterOffset(ctx, text) {
  const m = ctx.measureText(text);
  if (typeof m.actualBoundingBoxAscent !== 'number' || typeof m.actualBoundingBoxDescent !== 'number') return 0;
  return (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
}

// 一格車身寫一行姓名：字級先照車身高度給，再依寬度往下縮到塞得進去
function drawNameInSlot(ctx, slot, name, sheetW, sheetH) {
  const boxX = slot.x * sheetW;
  const boxY = slot.y * sheetH;
  const boxW = slot.w * sheetW;
  const boxH = slot.h * sheetH;
  const size = fitCanvasFontSize(ctx, name, boxH * 0.88, boxW * NS_SHEET_WIDTH_SAFETY);
  drawStrokedText(ctx, name, boxX + boxW / 2, boxY + boxH / 2, size, slot.stroke);
}

async function buildSheetStickerCanvas(styleKey, name) {
  const style = STICKER_STYLES[styleKey];
  const sheet = await loadImageElement(style.sheet);
  await ensureFontsForText(name);

  // 直接用底圖原尺寸輸出（1800x1200＝6x4 明信片比例），不重新縮放，畫質不打折
  const canvas = document.createElement('canvas');
  canvas.width = sheet.naturalWidth || 1800;
  canvas.height = sheet.naturalHeight || 1200;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(sheet, 0, 0, canvas.width, canvas.height);
  style.slots.forEach(slot => {
    drawNameInSlot(ctx, slot, name, canvas.width, canvas.height);
  });
  return canvas;
}

// ===== bodygrid 款（喵星人Ⅱ）：白底 4x6 網格，但姓名疊畫在每隻貓身體裡，
// 不是圖旁邊另起一行 —— 跟 sheet 款一樣用 canvas 2D 直接畫，才有白字＋外框
// 可以在任何貓色上都看得清楚（html2canvas 畫不出這種外框效果，見 sheet 款註解）=====

const NS_BODYGRID_W = 1728;   // 576 * 3，跟 grid 款輸出解析度一致
const NS_BODYGRID_H = 1152;   // 384 * 3
const NS_BODYGRID_MARGIN = 48;
const NS_BODYGRID_FOOTER_H = 42;
const NS_BODYGRID_CELL_PAD = 10;
const NS_BODYGRID_VALIGN_TOP = 0.08;  // 0=貼齊格頂，0.5=置中；貓要往上移，取接近0的值

function drawBodyGridFooter(ctx) {
  ctx.font = `700 27px "Noto Sans TC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#b5755a'; // --c-brown
  ctx.fillText('雪莉與朵栗免費分享製作 IG @dondon0813', NS_BODYGRID_W / 2, NS_BODYGRID_H - 18);
}

async function buildBodyGridStickerCanvas(styleKey, name) {
  const style = STICKER_STYLES[styleKey];
  await ensureFontsForText(name);

  const uniqueSrcs = Array.from(new Set(style.images));
  const loadedList = await Promise.all(uniqueSrcs.map(src => loadImageElement(src)));
  const imageMap = new Map(uniqueSrcs.map((src, i) => [src, loadedList[i]]));

  // 這款底圖是橫式明信片，格數也要照橫式比例排（預設仍是共用的 NS_GRID_COLS/ROWS，
  // 但 cat2 用自己的 gridCols/gridRows，讓貓不會被直向的窄格壓扁）
  const cols = style.gridCols || NS_GRID_COLS;
  const rows = style.gridRows || NS_GRID_ROWS;
  const slotOrder = buildStickerImageSlots(style.images, cols * rows);

  const canvas = document.createElement('canvas');
  canvas.width = NS_BODYGRID_W;
  canvas.height = NS_BODYGRID_H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const gridX0 = NS_BODYGRID_MARGIN;
  const gridY0 = NS_BODYGRID_MARGIN;
  const gridW = NS_BODYGRID_W - NS_BODYGRID_MARGIN * 2;
  const gridH = NS_BODYGRID_H - NS_BODYGRID_MARGIN - NS_BODYGRID_FOOTER_H;
  const cellW = gridW / cols;
  const cellH = gridH / rows;

  slotOrder.forEach((src, i) => {
    const img = imageMap.get(src);
    if (!img) return; // 單張圖片載入失敗就跳過那一格，不讓整張成品開天窗
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cellX = gridX0 + col * cellW;
    const cellY = gridY0 + row * cellH;
    const boxX = cellX + NS_BODYGRID_CELL_PAD;
    const boxY = cellY + NS_BODYGRID_CELL_PAD;
    const boxW = cellW - NS_BODYGRID_CELL_PAD * 2;
    const boxH = cellH - NS_BODYGRID_CELL_PAD * 2;

    const imgAspect = img.naturalWidth / img.naturalHeight;
    const boxAspect = boxW / boxH;
    let drawW, drawH;
    if (imgAspect > boxAspect) {
      drawW = boxW;
      drawH = boxW / imgAspect;
    } else {
      drawH = boxH;
      drawW = boxH * imgAspect;
    }
    const drawX = boxX + (boxW - drawW) / 2;
    // 貓的長寬比比格子扁，contain 縮放後上下都會留白；不要置中，把貓貼齊格子上緣，
    // 讓多出來的留白集中到下面，貓才不會看起來一直懸在格子中間偏上留一大截空白
    const drawY = boxY + (boxH - drawH) * NS_BODYGRID_VALIGN_TOP;
    ctx.drawImage(img, drawX, drawY, drawW, drawH);

    const slot = style.bodySlot;
    const fakeSlot = {
      x: drawX / NS_BODYGRID_W,
      y: drawY / NS_BODYGRID_H,
      w: drawW / NS_BODYGRID_W,
      h: drawH / NS_BODYGRID_H
    };
    // bodySlot 是相對「這張貓圖自己」的比例，換算成相對「整張成品畫布」的比例，
    // 才能沿用 drawNameInSlot（它本來是給 sheet 款、以整張底圖為基準設計的）
    const absSlot = {
      x: fakeSlot.x + slot.x * fakeSlot.w,
      y: fakeSlot.y + slot.y * fakeSlot.h,
      w: slot.w * fakeSlot.w,
      h: slot.h * fakeSlot.h,
      stroke: style.textStroke
    };
    drawNameInSlot(ctx, absSlot, name, NS_BODYGRID_W, NS_BODYGRID_H);
  });

  drawBodyGridFooter(ctx);
  return canvas;
}

async function buildNameStickerPoster(styleKey, name, englishName) {
  const style = STICKER_STYLES[styleKey];
  const gridEl = document.getElementById('nsGrid');
  gridEl.innerHTML = '';

  const hasEnglish = !!(englishName && englishName.trim());

  const slotCount = NS_GRID_COLS * NS_GRID_ROWS;
  const slots = buildStickerImageSlots(style.images, slotCount);
  const imgChecks = [];

  slots.forEach(src => {
    const cell = document.createElement('div');
    cell.className = 'ns-cell';

    const iconWrap = document.createElement('div');
    iconWrap.className = 'ns-cell-icon';
    const img = document.createElement('img');
    img.src = src;
    iconWrap.appendChild(img);
    cell.appendChild(iconWrap);

    imgChecks.push(preloadImage(src).then(res => {
      if (!res.ok) {
        iconWrap.className = 'ns-cell-icon emoji';
        iconWrap.textContent = style.emoji;
        return;
      }
      // 明確依格子實際尺寸＋圖片原始長寬比算出縮放後的寬高，不要依賴瀏覽器的
      // flex 自動縮放替代元素這個隱性行為——html2canvas 對這個行為支援不穩定，
      // 圖片來源如果是 base64 dataURI 更容易整個抓錯尺寸，變成放大裁切一小角
      const boxW = iconWrap.getBoundingClientRect().width || iconWrap.offsetWidth || 0;
      const boxH = iconWrap.getBoundingClientRect().height || iconWrap.offsetHeight || 0;
      if (boxW && boxH && res.w && res.h) {
        const fitScale = Math.min(boxW / res.w, boxH / res.h);
        img.style.width = (res.w * fitScale) + 'px';
        img.style.height = (res.h * fitScale) + 'px';
      }
    }));

    const textStack = document.createElement('div');
    textStack.className = hasEnglish ? 'ns-cell-textstack dual' : 'ns-cell-textstack';

    const nameEl = document.createElement('div');
    nameEl.className = 'ns-cell-name';
    nameEl.textContent = name;
    textStack.appendChild(nameEl);

    if (hasEnglish) {
      const engEl = document.createElement('div');
      engEl.className = 'ns-cell-name-en';
      engEl.textContent = englishName.trim();
      textStack.appendChild(engEl);
    }

    cell.appendChild(textStack);
    gridEl.appendChild(cell);
  });

  // 自訂字體（Baloo 2／Huninn）第一次造訪時可能還沒下載完成，這時候量測寬度
  // 會用瀏覽器暫時的替代字體去算，字級就會算錯；等字體真的載入完成之後
  // 換成正確字體重繪，文字可能變寬而超出格子，被 overflow 裁掉（中文只顯示
  // 兩個字的成因）。這裡先等字體真的就緒，才用「量出來的」字體去決定字級
  if (document.fonts && document.fonts.ready) {
    try { await document.fonts.ready; } catch (e) { /* 忽略，仍照現況量測 */ }
  }

  if (hasEnglish) {
    fitStickerNameFontSizeDual(gridEl);
  } else {
    fitStickerNameFontSize(gridEl);
  }

  await Promise.all(imgChecks);
}

// 姓名字級自動縮放：長度不同的姓名都從「盡量接近圖示高度」開始試，
// 塞不下單行就一路縮小，直到剛好塞得進格子寬度，避免長姓名把版面撐爆
//
// 陷阱：量測用的 .ns-cell-name 本身是 flex:1 1 auto 撐滿格子的元素，
// scrollWidth 一旦文字寬度縮小到低於容器寬度就會「卡住」＝直接回報成
// clientWidth（容器本身的寬度），不會再繼續下降反映文字真正需要的寬度
// （這是 scrollWidth 的標準定義：scrollWidth 不會小於 clientWidth）。
// 之前拿這個「卡住」的值去跟 available 比較，會誤判成「還是塞不下」，
// 導致字級一路縮到 NS_NAME_MIN_FONT 的下限，跟 NS_NAME_MAX_FONT 設多大
// 完全無關。改成另外做一個不受 flex 版面限制的量測用元素，量出文字
// 真正的自然寬度，才能正確判斷剛好塞得下的字級。
const NS_NAME_MAX_FONT = 56;
const NS_NAME_MIN_FONT = 16;
// 安全係數：手機端有使用者反映中文姓名會被截斷（例如「陳星宇」只顯示「陳星」），
// 但同一個姓名在這裡（桌機 Chromium）怎麼測都正常，判斷是不同瀏覽器/裝置
// 對這段文字的實際渲染寬度跟這裡量到的有落差（推測跟 iOS Safari 相關，但
// 沒有 Safari 可以實測驗證）。抓寬度時先打個折，留出緩衝，才不會在測量
// 準確但實際渲染稍寬的裝置上被裁字
const NS_WIDTH_SAFETY_FACTOR = 0.85;
function fitStickerNameFontSize(gridEl) {
  const sample = gridEl.querySelector('.ns-cell-name');
  if (!sample) return;
  const name = sample.textContent;
  const available = sample.clientWidth * NS_WIDTH_SAFETY_FACTOR;

  const probe = document.createElement('div');
  probe.style.cssText = 'position:absolute; visibility:hidden; left:-99999px; top:0; white-space:nowrap; font-family:' + getComputedStyle(sample).fontFamily + '; font-weight:800;';
  probe.textContent = name;
  document.body.appendChild(probe);

  let fontSize = NS_NAME_MAX_FONT;
  probe.style.fontSize = fontSize + 'px';
  // 用 1px 為單位縮，才不會跳過剛好塞得下的那個字級
  while (fontSize > NS_NAME_MIN_FONT && probe.getBoundingClientRect().width > available) {
    fontSize -= 1;
    probe.style.fontSize = fontSize + 'px';
  }
  document.body.removeChild(probe);

  gridEl.querySelectorAll('.ns-cell-name').forEach(el => {
    el.style.fontSize = fontSize + 'px';
  });
}

// 有填英文姓名時：中文姓名／英文姓名疊成兩行，字級維持 6:4 比例一起縮放，
// 兩行分別檢查寬度塞不塞得下（原理跟單行版一樣，用獨立量測元素避免
// scrollWidth 卡住的陷阱）
const NS_NAME2_UNIT_MAX = 6; // 中文 3 單位（上限18px）、英文 2 單位（上限12px）
const NS_NAME2_UNIT_MIN = 5;
function fitStickerNameFontSizeDual(gridEl) {
  const sampleZh = gridEl.querySelector('.ns-cell-name');
  const sampleEn = gridEl.querySelector('.ns-cell-name-en');
  if (!sampleZh || !sampleEn) return;
  const available = sampleZh.clientWidth * NS_WIDTH_SAFETY_FACTOR;

  const probeZh = document.createElement('div');
  probeZh.style.cssText = 'position:absolute; visibility:hidden; left:-99999px; top:0; white-space:nowrap; font-family:' + getComputedStyle(sampleZh).fontFamily + '; font-weight:800;';
  probeZh.textContent = sampleZh.textContent;
  document.body.appendChild(probeZh);

  const probeEn = document.createElement('div');
  probeEn.style.cssText = 'position:absolute; visibility:hidden; left:-99999px; top:0; white-space:nowrap; font-family:' + getComputedStyle(sampleEn).fontFamily + '; font-weight:800;';
  probeEn.textContent = sampleEn.textContent;
  document.body.appendChild(probeEn);

  let unit = NS_NAME2_UNIT_MAX;
  const applyProbeSizes = (u) => {
    probeZh.style.fontSize = Math.round(u * 3) + 'px';
    probeEn.style.fontSize = Math.round(u * 2) + 'px';
  };
  applyProbeSizes(unit);
  while (unit > NS_NAME2_UNIT_MIN && (probeZh.getBoundingClientRect().width > available || probeEn.getBoundingClientRect().width > available)) {
    unit -= 0.5;
    applyProbeSizes(unit);
  }
  const finalZh = Math.round(unit * 3);
  const finalEn = Math.round(unit * 2);
  document.body.removeChild(probeZh);
  document.body.removeChild(probeEn);

  gridEl.querySelectorAll('.ns-cell-name').forEach(el => { el.style.fontSize = finalZh + 'px'; });
  gridEl.querySelectorAll('.ns-cell-name-en').forEach(el => { el.style.fontSize = finalEn + 'px'; });
}

function canvasToBlobAsync(canvas) {
  return new Promise((resolve) => {
    canvas.toBlob((blob) => resolve(blob), 'image/png');
  });
}

// 整個流程的看門狗：不管卡在哪一步，超過時間都強制結束並跳出錯誤訊息，避免按鈕永遠停在「產生中」
function withWatchdog(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('WATCHDOG_TIMEOUT')), ms))
  ]);
}

// html2canvas 截圖會把整個頁面複製一份，改成把樣板複製進乾淨的獨立 iframe 再截圖，
// 跟 school-list.html 的姓名貼產生器同一招，已驗證能避免手機上卡住的狀況
async function captureInIsolatedFrame(sourceEl, options) {
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed; left:-99999px; top:0; border:0;';
  iframe.width = String(options.width || sourceEl.offsetWidth || 400);
  iframe.height = String(options.height || sourceEl.offsetHeight || 400);
  document.body.appendChild(iframe);

  try {
    const doc = iframe.contentDocument;
    doc.open();
    doc.write(`<!DOCTYPE html><html><head><base href="${location.href}"></head><body style="margin:0;"></body></html>`);
    doc.close();

    document.querySelectorAll('head style').forEach(styleEl => {
      const s = doc.createElement('style');
      s.textContent = styleEl.textContent;
      doc.head.appendChild(s);
    });
    document.querySelectorAll('head link[rel="stylesheet"]').forEach(linkEl => {
      const l = doc.createElement('link');
      l.rel = 'stylesheet';
      l.href = linkEl.href;
      doc.head.appendChild(l);
    });

    const clone = sourceEl.cloneNode(true);
    doc.body.appendChild(clone);

    const fontsReady = doc.fonts && doc.fonts.ready ? doc.fonts.ready : Promise.resolve();
    const imgs = Array.from(clone.querySelectorAll('img'));
    const imgsReady = Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(resolve => {
      img.addEventListener('load', resolve);
      img.addEventListener('error', resolve);
    })));
    await Promise.race([
      Promise.all([fontsReady, imgsReady]),
      new Promise(resolve => setTimeout(resolve, 3000))
    ]);

    return await html2canvas(clone, options);
  } finally {
    document.body.removeChild(iframe);
  }
}

async function generateNameStickerImage() {
  const btn = document.getElementById('nsGenerateBtn');
  const originalBtnText = btn.textContent;

  try {
    if (!nsSelectedStyle) {
      alert('請先選擇姓名貼款式喔');
      return;
    }
    const nameInput = document.getElementById('nsNameInput');
    const name = nameInput.value.trim();
    if (!name) {
      alert('請先輸入姓名喔');
      nameInput.focus();
      return;
    }
    // 用 ?. 保底：就算這個欄位因為某種原因抓不到，也不會讓整個產生流程
    // 在還沒進 try 之前就整個掛掉、按鈕完全沒反應
    const englishNameInput = document.getElementById('nsEnglishNameInput');
    const englishName = englishNameInput ? englishNameInput.value.trim() : '';

    btn.disabled = true;
    btn.textContent = '圖片產生中…';

    await withWatchdog((async () => {
      let finalCanvas;

      if (STICKER_STYLES[nsSelectedStyle].mode === 'sheet') {
        // 整張底圖直接畫，不需要 DOM 樣板，也不用載 html2canvas
        finalCanvas = await buildSheetStickerCanvas(nsSelectedStyle, name);
      } else if (STICKER_STYLES[nsSelectedStyle].mode === 'bodygrid') {
        // 姓名疊畫在貓咪身體裡，同樣不經 html2canvas，直接 canvas 2D 畫整張成品
        finalCanvas = await buildBodyGridStickerCanvas(nsSelectedStyle, name);
      } else {
        await ensureHtml2Canvas();
        await buildNameStickerPoster(nsSelectedStyle, name, englishName);

        // 等字體 / 版面穩定
        await new Promise(r => setTimeout(r, 150));

        const posterEl = document.getElementById('nsPoster');
        const outputScale = 3;
        const capturedCanvas = await captureInIsolatedFrame(posterEl, {
          width: 576,
          height: 384,
          scale: outputScale,
          backgroundColor: '#ffffff',
          useCORS: true,
          imageTimeout: 8000
        });

        // 6x4 明信片尺寸・橫式（576 x 384，跟樣板寬度一致）＊輸出倍率，白底
        const targetW = 576 * outputScale;
        const targetH = 384 * outputScale;
        finalCanvas = document.createElement('canvas');
        finalCanvas.width = targetW;
        finalCanvas.height = targetH;
        const ctx = finalCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, targetW, targetH);
        ctx.drawImage(capturedCanvas, 0, 0, targetW, targetH);
      }

      const blob = await canvasToBlobAsync(finalCanvas);
      if (!blob) {
        alert('圖片產生失敗，請再試一次');
        return;
      }
      const url = URL.createObjectURL(blob);
      const now = new Date();
      const stamp = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
      const styleLabel = STICKER_STYLES[nsSelectedStyle].label;

      const previewImg = document.getElementById('nsPreviewImg');
      previewImg.src = url;

      const downloadBtn = document.getElementById('nsDownloadBtn');
      downloadBtn.href = url;
      downloadBtn.download = `姓名貼_${styleLabel}_${name}_${stamp}.png`;

      document.getElementById('nsPreviewWrap').style.display = 'block';
      document.getElementById('nsPreviewWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    })(), 40000);
  } catch (err) {
    console.error(err);
    if (err && err.message === 'WATCHDOG_TIMEOUT') {
      alert('圖片產生逾時了，可能是網路不穩或裝置暫時卡住，請再試一次；如果一直發生，麻煩截圖回報給我們 🙏');
    } else {
      alert('圖片產生失敗，請再試一次');
    }
  } finally {
    btn.disabled = false;
    btn.textContent = originalBtnText;
  }
}

document.getElementById('nsGenerateBtn').addEventListener('click', generateNameStickerImage);
document.getElementById('nsNameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') generateNameStickerImage();
});
document.getElementById('nsEnglishNameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') generateNameStickerImage();
});

<!-- 頁面瀏覽量統計：獨立區塊，不依賴本頁其他程式碼。key 白名單見 Code.gs STAT_KEY_WHITELIST_RE（頁面代號只能小寫英數，不能有 - 或 _） -->
<script>
(function sendNameStickerPageview() {
  const STATS_BACKEND_URL = 'https://dondon-platform.vercel.app/api/legacy'; // 灰度切換 2026-08-17：計數改打新後端，回退＝revert 本 commit
  const d = new Date();
  const key = `page_namesticker_${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const payload = JSON.stringify({ type: 'stat-view', key });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(STATS_BACKEND_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    } else {
      fetch(STATS_BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }
  } catch (e) { /* 統計失敗不影響使用者瀏覽，安靜忽略 */ }
})();
</script>
