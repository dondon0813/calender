<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪莉與朵栗 兒童專區</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* kids.html 專屬樣式。共用的 reset / 版面 / 返回鈕 / 標題 / 頁尾在 shared.css。 */

  /* ===== 四張入口卡 ===== */
  .home-subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--c-brown);
    font-weight: 700;
    margin-bottom: 22px;
  }

  .home-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 24px;
  }
  .home-card {
    border-radius: var(--r-xl);
    padding: 26px 12px 20px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .home-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(230,160,110,0.22);
  }

  .home-card-coral { background: var(--c-coral-bg); border-color: var(--c-coral-border); }
  .home-card-coral .home-card-title { color: var(--c-coral-text); }
  .home-card-coral .home-card-title-divider { border-color: var(--c-coral-text); }

  .home-card-mint { background: var(--c-mint-bg); border-color: var(--c-mint-border); }
  .home-card-mint .home-card-title { color: var(--c-mint-text); }
  .home-card-mint .home-card-title-divider { border-color: var(--c-mint-text); }

  .home-card-blue { background: var(--c-blue-bg); border-color: var(--c-blue-border); }
  .home-card-blue .home-card-title { color: var(--c-blue-text); }
  .home-card-blue .home-card-title-divider { border-color: var(--c-blue-text); }

  .home-card-purple { background: var(--c-purple-bg); border-color: var(--c-purple-border); }
  .home-card-purple .home-card-title { color: var(--c-purple-text); }
  .home-card-purple .home-card-title-divider { border-color: var(--c-purple-text); }

  .soon-card { position: relative; opacity: 0.92; }
  .soon-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 9px;
    font-weight: 800;
    color: #fff;
    background: var(--c-tag-bg);
    border-radius: var(--r-pill);
    padding: 3px 8px;
  }
  .home-card-icon { font-size: 34px; margin-bottom: 8px; }
  .home-card-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 17px;
  }
  .home-card-title-divider {
    width: 60%;
    height: 0;
    border-bottom: 2px dashed;
    margin: 8px auto;
    opacity: .5;
  }
  .home-card-desc { font-size: 11.5px; color: var(--c-text-soft); }

  /* 本頁頁尾比共用的緊一點 */
  .footer {
    margin-top: 22px;
    font-size: 13px;
  }

  @media (max-width: 420px) {
    .home-card-icon { font-size: 28px; }
    .home-card-title { font-size: 15px; }
  }
</style>
</head>
<body>

<a class="site-home-btn" href="recipes.html" title="回首頁" aria-label="回首頁">🏠</a>

<div class="wrap">
  <button class="back-btn" onclick="location.href='recipes.html'">← 返回主頁</button>

  <div class="page-title-wrap">
    <div class="page-title-badge">💗 雪莉與朵栗</div>
    <div class="page-title">🌈 兒童專區</div>
  </div>

  <div class="home-subtitle">🌟 陪孩子一起玩中學、學中玩 🌟</div>

  <div class="home-cards">
    <a class="home-card home-card-coral" href="star-card.html" style="text-decoration:none; display:block;">
      <div class="home-card-icon">⭐</div>
      <div class="home-card-title">我的集點卡</div>
      <div class="home-card-title-divider"></div>
      <div class="home-card-desc">蓋星星集點，累積小成就 💗</div>
    </a>

    <div class="home-card home-card-mint soon-card">
      <div class="soon-badge">即將推出</div>
      <div class="home-card-icon">🎨</div>
      <div class="home-card-title">塗鴉牆</div>
      <div class="home-card-title-divider"></div>
      <div class="home-card-desc">自由創作的塗鴉空間 💗</div>
    </div>

    <div class="home-card home-card-blue soon-card">
      <div class="soon-badge">即將推出</div>
      <div class="home-card-icon">🎵</div>
      <div class="home-card-title">兒歌童謠</div>
      <div class="home-card-title-divider"></div>
      <div class="home-card-desc">好聽好唱的兒歌精選 💗</div>
    </div>

    <div class="home-card home-card-purple soon-card">
      <div class="soon-badge">即將推出</div>
      <div class="home-card-icon">🧩</div>
      <div class="home-card-title">小遊戲</div>
      <div class="home-card-title-divider"></div>
      <div class="home-card-desc">簡單好玩的益智小遊戲 💗</div>
    </div>
  </div>

  <div class="footer"><a href="https://www.instagram.com/dondon0813/" target="_blank" rel="noopener noreferrer" style="color:inherit; text-decoration:none;">雪莉與朵栗 ♥</a></div>
</div>

<script>
document.querySelectorAll('.soon-card').forEach(card => {
  card.addEventListener('click', () => {
    alert('這個功能還在準備中，敬請期待！🩷');
  });
});
</script>

</body>
</html>
