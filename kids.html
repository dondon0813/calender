<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<link rel="stylesheet" href="shared.css">
<style>
  /* kids.html 專屬樣式。共用的 reset / 版面 / 返回鈕 / 標題 / 頁尾在 shared.css。 */

  /* ===== 四張入口卡 ===== */
  .home-subtitle {
    text-align: center;
    font-size: 13px;
    color: var(--c-brown);
    font-weight: 700;
    margin-bottom: 22px;
  }

  .home-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 24px;
  }
  .home-card {
    border-radius: var(--r-xl);
    padding: 26px 12px 20px;
    text-align: center;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .home-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(230,160,110,0.22);
  }

  .home-card-coral { background: var(--c-coral-bg); border-color: var(--c-coral-border); }
  .home-card-coral .home-card-title { color: var(--c-coral-text); }
  .home-card-coral .home-card-title-divider { border-color: var(--c-coral-text); }

  .home-card-mint { background: var(--c-mint-bg); border-color: var(--c-mint-border); }
  .home-card-mint .home-card-title { color: var(--c-mint-text); }
  .home-card-mint .home-card-title-divider { border-color: var(--c-mint-text); }

  .home-card-blue { background: var(--c-blue-bg); border-color: var(--c-blue-border); }
  .home-card-blue .home-card-title { color: var(--c-blue-text); }
  .home-card-blue .home-card-title-divider { border-color: var(--c-blue-text); }

  .home-card-purple { background: var(--c-purple-bg); border-color: var(--c-purple-border); }
  .home-card-purple .home-card-title { color: var(--c-purple-text); }
  .home-card-purple .home-card-title-divider { border-color: var(--c-purple-text); }

  .soon-card { position: relative; opacity: 0.92; }
  .soon-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 9px;
    font-weight: 800;
    color: #fff;
    background: var(--c-tag-bg);
    border-radius: var(--r-pill);
    padding: 3px 8px;
  }
  .home-card-icon { font-size: 34px; margin-bottom: 8px; }
  .home-card-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 17px;
  }
  .home-card-title-divider {
    width: 60%;
    height: 0;
    border-bottom: 2px dashed;
    margin: 8px auto;
    opacity: .5;
  }
  .home-card-desc { font-size: 11.5px; color: var(--c-text-soft); }

  /* 本頁頁尾比共用的緊一點 */
  .footer {
    margin-top: 22px;
    font-size: 13px;
  }

  @media (max-width: 420px) {
    .home-card-icon { font-size: 28px; }
    .home-card-title { font-size: 15px; }
  }
</style>
</head>
<body>

<a class="site-home-btn" href="recipes.html" title="回首頁" aria-label="回首頁">🏠</a>

<script>

<!-- 頁面瀏覽量統計：獨立區塊，不依賴本頁其他程式碼。key 白名單見 Code.gs STAT_KEY_WHITELIST_RE（頁面代號只能小寫英數，不能有 - 或 _） -->
<script>
(function sendKidsPageview() {
  const STATS_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzTxoqVO1nf--Q9s-lf1eIPdgrDpJgLsuAy1mAwgydYzb7ThAuygx79oFNsEH-kWD2R/exec';
  const d = new Date();
  const key = `page_kids_${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const payload = JSON.stringify({ type: 'stat-view', key });
  try {
    if (navigator.sendBeacon) {
      navigator.sendBeacon(STATS_BACKEND_URL, new Blob([payload], { type: 'text/plain;charset=UTF-8' }));
    } else {
      fetch(STATS_BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: payload,
        keepalive: true
      }).catch(() => {});
    }
  } catch (e) { /* 統計失敗不影響使用者瀏覽，安靜忽略 */ }
})();
</script>

</body>
</html>
